<style>
.request-form{width:80%;margin:0 auto;font-size:14px;background-color:whitesmoke}
.request-form h3.panel-title{text-align:center; padding-bottom:2%}
.request-form .panel .panel-body{background-color:white;border-radius:4px;border:1px solid lightgray;margin-bottom:15px;box-shadow:3px 3px 8px -2px rgba(0,0,0,0.1);padding:15px}
.request-form h4.panel-title{color:#3a6ba0;padding:10px;margin:-15px -15px 15px -15px;border-bottom:1px dashed #e2e2e2}

.request-form [name]{padding:2px 5px;border-radius:0;font-weight:400}
.request-form [name]:disabled{background-color:#F2F2F2}
.request-form input:read-only{color:#aaa}
.request-form [type="radio"],
.request-form [type="checkbox"]{width:auto;height:auto;margin-right:10px;display:inline;box-shadow:none}

.request-form .form-group{margin-bottom:10px}
.request-form .panel-body .form-group:last-child{margin-bottom:0}
.request-form .form-group span,.request-form .form-group table td{font-weight:400;color:gray;font-style:italic;min-height:5px;text-align:justify}
.request-form .form-group span{display:block}
.request-form .form-group label       strong{white-space:nowrap;width:100%;display:inline-block;overflow:hidden;text-overflow:ellipsis;float:left}
.request-form .form-group label       span.title{display:inline;font-style:normal;color:#555}
.request-form .form-group label:hover span.title{font-weight:700}
.request-form .form-group label       span.extra-info{line-height:1.2em;color:#d8d8d8}
.request-form .form-group label:hover span.extra-info{color:gray}
.request-form .form-group label :checked+span.title{font-weight:700;color:#3a6ba0}
.request-form .form-group label :checked~span.extra-info{color:#3a6ba0}
.request-form .form-group label.error{color:red;display:block;font-weight:400;padding:0 15px}

.request-form .horizontal span{text-align:left}
.request-form .horizontal.has-error .error{width:100%}
.request-form .form-group.has-error .show-no-error{border-color:#ccc !important;box-shadow:none !important}

.request-form label.highlight{font-style:italic}
.request-form label.highlight span{font-weight:700}

.request-form .summary-chapter .form-group label{margin:0;display:table;float:left;width:100%}
.request-form .summary-chapter .form-group label.highlight{margin-bottom:5px}
.request-form .summary-chapter .form-group label>*{margin:0;display:table-cell;line-height:1.2em;padding:3px 10px;font-size:14px;font-weight:400;font-style:normal;vertical-align:top;text-align:left}
.request-form .summary-chapter .form-group label>span{width:35%;padding-left:0}
.request-form .summary-chapter .form-group label>p   {width:65%;border-top:1px solid #eaeaea;color:#1e6aa2}
.request-form .summary-chapter .form-group label:nth-child(odd) p{background-color:#f7f7f7}

.request-form .summary-chapter .form-group .chapter-subgroup{margin-bottom:10px;float:left;margin-left:4%;width:96%}
.request-form .summary-chapter .form-group .chapter-subgroup label>span{margin-left:4%;width:30%}
.request-form .summary-chapter .form-group .chapter-subgroup.s-content label>*{background-color:#f7f7f7;border:0;padding:3px 10px}
.request-form .summary-chapter .form-group .chapter-subgroup.s-content label.highlight>*{background-color:#eaeaea;border-bottom:1px solid lightgray;font-style:normal;font-weight:700;line-height:1.4em}
.request-form .summary-chapter .form-group .chapter-subgroup.s-content label:nth-child(2){margin-top:-5px}
.request-form .summary-chapter .form-group .chapter-subgroup.s-content label:not(.highlight):last-child>*{border-bottom:5px solid #f0f0f0;margin-bottom:5px}

.request-form .terms-conditions>label       >label{color:#3a6ba0;font-style:normal}
.request-form .terms-conditions>label:hover>label{text-decoration:underline}
.request-form label.title{font-weight:normal}

.request-form div.underline{border-bottom:1px solid #e8e8e8;}
.request-form div.scheduleType{border-bottom:1px solid #e8e8e8;}
.request-form table.leftline{border-left:5px solid #e8e8e8;}
.request-form .summary-chapter .form-group div>p,.request-form .summary-chapter .form-group table>tbody>tr>td{color:#1e6aa2!important;min-height:1.5em;text-align:justify;}
.request-form .summary-chapter .form-group table>tbody>tr>td:first-child{max-width:15rem;}

#mapExtent{height:480px;border:1px solid #c5c5c5;margin-bottom:10px}
#myFlatMap .poly-actions-panel.drawer-panel .drawer-content{width:auto}

#request_usr_page_2 input[type="file"]:disabled{color:lightgray}

.glyphicon.glyphicon-backward,.glyphicon.glyphicon-forward{top:1rem;font-size:2rem;color:#c5c5c5;background-color:whitesmoke;position:absolute;z-index:10}
.glyphicon-backward:not([disabled]):hover,.glyphicon.glyphicon-forward:not([disabled]):hover{color:#4c9ac8}

.glyphicon.glyphicon-backward{left:0.5rem}
.glyphicon.glyphicon-forward{right:0.5rem}

#request_usr_page_3 .schedule-row input[type="number"]{padding:2px;width:40px;text-align:center;}
#request_usr_page_3 .schedule-row label{font-weight:400;width:35px;margin:0;}
#request_usr_page_3 td>.nowrap{display:inline-flex;}
#request_usr_page_3 td.task_name{font-weight:700;}
#request_usr_page_3 td .form-control {width:auto;line-height:normal;height:auto;}

#myModalLoading div{background:transparent;box-shadow:none !important;}

svg .cog-group{animation:spin 4s linear infinite;transform-origin:50% 50%;animation-delay:0.4s;}

svg .small-cog{animation:spinback 3s linear infinite;transform-origin:41.8px 20.8px;animation-delay:0.4s;}

<script type="text/javascript">
	function purgeAllProductsDialogs() {
		purgeUiDialog("request_submit");
	}

	function createProcessorList(data) {
		$.each(data, function(index,value){
			$("#processor").append("<option value='" + value.id + "' data-shortName='" + value.shortName + "' data-description='" + value.description + "'>" + siteTitle.replaceAll(" ","") + " - " + value.name + "</option>");
		});
	}
	
	function getServiceList() {
		$.ajax({
			url: baseApiUrl + "request/",
			type: "GET",
			async: false,
			dataType: 'json',
			beforeSend: function (xhr) {
				xhr.setRequestHeader("Accept", "application/json");
				xhr.setRequestHeader("Content-Type", "application/json");
			},
			success: function(response) {
				if (response.status === responseStatus.success) {
					var uiVisibleData = response.data.filter(obj=> obj.serviceUIVisible);
					createProcessorList(uiVisibleData);
					$("#content").data("serviceList",uiVisibleData);
				}else {
					console.log(response.status + ": " + response.message);
				}
			},
			error: function (jqXHR, textStatus, errorThrown) {
				console.log("ERROR: " + textStatus);
				if (jqXHR.status == 401) { // unauthorized
					logout();
				}
			}
		});
	}
	
	$(document).ready(function() {
		getServiceList();
		var previousServiceList = [];
		var formData = new FormData();
		
		$("#wp-custom-header h1.header-post-title-class").html("User service request");
		$("ul", ".request-form").addClass("hidden");
		$(".request-form").tabs({
			activate: function (event, ui) {
				var currentServiceList = $("#processor").val();
				var currentSelectedService = $("#prevSites").val();
				switch (ui.newPanel.get(0).id) {
					case "tab_usr_page1":
						break;
					case "request_usr_page_1":
						if (JSON.stringify(currentServiceList) != JSON.stringify(previousServiceList)) {
							previousServiceList = $("#processor").val();
						}
						break;
					case "request_usr_page_2":
						if (JSON.stringify(currentServiceList) != JSON.stringify(previousServiceList)) {
							existingServices();
							refreshAreaOfInterest();
							if (previousServiceList.length > 0 && $("#usePrevSite").is(":checked")) {								
								$("#defineNew").prop("checked", true).trigger("change");
							}
						}
						if (typeof $("#content").data("retrivedRegions") === "undefined") {
							retrivedRegions();
						}
						if (typeof $("#content").data("generalParams") === "undefined") {
							getGeneralParams();
						}
						if (currentSelectedService !== $("#content").data("prevSelectedService")) {
							$("#content").data("prevSelectedService", currentSelectedService);
						}
						break;
					case "request_usr_page_4":
						if (currentSelectedService !== $("#content").data("prevSelectedService")) {
							$("#content").data("prevSelectedService", currentSelectedService);
						}
						break;
				}
			}
		});
		
		$("#processor").on("change", function (e) {
			$(this).siblings(".extra-info").html("");
			$.each ($(this).children("option:selected"), function (index, option) {
				if ($(this).parent().siblings(".extra-info").html() !== "") {
					$(this).parent().siblings(".extra-info").append("<br/><br/>");
				}
				$(this).parent().siblings(".extra-info").append($(option).data("description"));
			});
		});

		$("body").on("change", ".has-group-toggle", function (e) {
			if ($(this).is(':checked')) {
				$(this).closest(".form-group").next().removeClass("hidden");
			} else {
				$(this).closest(".form-group").next().addClass("hidden");
			}
		});
		
		$("#request_usr_page_1").on("change","#name", function (){
			$("#content").removeData("defaultScheduledType");
		});
		
		/* Functions */
			/*START Get general parameters*/
				function getGeneralParams () {
					$.ajax({
						url: baseApiUrl + "request/get_general_config",
						type: "GET",
						async: false,
						dataType: 'json',
						beforeSend: function (xhr) {
							xhr.setRequestHeader("Accept", "application/json");
							xhr.setRequestHeader("Content-Type", "application/json");
						},
						success: function(response) {
							if (response.status === responseStatus.success) {
								$("#content").data("generalParams",response.data);
							}else {
								console.log(response.status + ": " + response.message);
							}
						},
						error: function (jqXHR, textStatus, errorThrown) {
							console.log("ERROR: " + textStatus);
							if (jqXHR.status == 401) { // unauthorized
								logout();
							}
						}
					});
				}
			/*END Get general parameters*/
			
			/*START Get continent, country and region.*/
				var getRegions = function (){
					return $.ajax({
						beforeSend: function(xhr) { xhr.setRequestHeader("X-Auth-Token", window.tokenKey); },
						cache: false,
						async: false,
						url  : baseApiUrl + "rois/regions",
						type : "GET"
					});
				}
				
				function retrivedRegions() {
					$.when(getRegions()).done(function (response) {
						if (response.status === responseStatus.success) {
							$("#content").data("retrivedRegions", response.data);
						} else {
							console.log(response.status + ": " + response.message);
						}
					});
				}
			/*END Get continent, country and region*/
			
			/* START Get existing projects and populate the fileds*/
			var getExistingServices = function () {
				return $.ajax({
					beforeSend: function(xhr) { xhr.setRequestHeader("X-Auth-Token", window.tokenKey); },
					cache: false,
					async: false,
					url  : baseApiUrl + "request/all-reuse?userId="+window.userID,
					type : "GET"
				});
			};
		
			function existingServices() {
				$.when(getExistingServices()).done(function (response) {
					if (response.status === responseStatus.success){
						if (response.data.length > 0) {
							var existingMatchServices = [];

		// Get Regex pattern for a comma separated list of numbers between 1 and maxValue
		// (only works when maxValue is between 100 and 999)
		function getListOfNumbersRegex(maxValue) {
			var hundreds = parseInt(maxValue/100);
			if (hundreds > 0) {
				var decimals = parseInt((maxValue - hundreds*100)/10);
				var units    = parseInt(maxValue - hundreds*100 - decimals*10);
				
				var number = "[1-9]|[1-9][0-9]|";
				number += hundreds > 1 ? "[1-" + (hundreds-1) + "][0-9][0-9]|" : "";
				number += decimals > 0 ? hundreds + "[0-" + (decimals-1) + "][0-9]|" : "";
				number += (hundreds*10+decimals) + "[0-" + units + "]";
				return "^ *(" + number + ")( *, *(" + number + "))* *$";
			} else {
				return "^.*$";
			}
		}

		function drawRectangle(latmin, latmax, lonmin, lonmax, source) {
		   
			var polyCoords = [];
			var p1 = lonmin + "," + latmin;
			var p2 = lonmax + "," + latmin;
			var p3 = lonmax + "," + latmax;
			var p4 = lonmin + "," + latmax;
			var coords = (p1 + " " + p2 + " " + p3 + " " + p4).split(' ');
			for (var i in coords) {
				var c = coords[i].split(',');
				polyCoords.push(ol.proj.transform([parseFloat(c[0]), parseFloat(c[1])], 'EPSG:4326', 'EPSG:3857'));
			}
		   
			var feature = new ol.Feature({
				geometry: new ol.geom.Polygon([polyCoords])
			});
			feature.setProperties({"extraFeatureDescription": "preview"});
			source.clear();
			source.addFeature(feature);
		   
			return feature;
		}

				}
				html += "</div>";
				return html;
		}
		function createProcessorPramSection (data, $processorDiv) {
			$(".panel-title", $processorDiv).html(data.name);
			$(".form-group.row span", $processorDiv).html(data.description);
			
			if (data.lpisRequired || data.additionalConfigRequired) {
				$(".important_info",$processorDiv).show();
				if (data.additionalConfigRequired && !data.lpisRequired) {
					$(".important_info span",$processorDiv).html("This service needs additional configuration files");
				} else if (data.lpisRequired && !data.additionalConfigRequired){
					$(".important_info span",$processorDiv).html("This service needs LPIS and LUT files");
				} else {
					$(".important_info span",$processorDiv).html("This service needs LPIS, LUT and additional configuration files");
				}
			} else {
				$(".important_info",$processorDiv).hide();
			}
			var html = "";
			
			//get the root category id (workaround)
			var parametersWithCategory = data.parameters.filter(obj => typeof obj.parentCategoryIds !== "undefined" && obj.parentCategoryIds !== null && obj.parentCategoryIds.length > 0)[0];
			var rootCategoryId;
			if (typeof parametersWithCategory !== "undefined") {
				var parametersCategoryIds = parametersWithCategory.parentCategoryIds;
				rootCategoryId = parametersCategoryIds[parametersCategoryIds.length - 1];
			} else {
				var parametersCategoryIds =  Array.from(new Set(Array.prototype.concat(...data.parameters.map(obj => obj.categoryId))));
				if (parametersCategoryIds.length === 1) {
					rootCategoryId = parametersCategoryIds[0];
				}
			}
			if (typeof rootCategoryId !== "undefined") {
				$processorDiv.attr("id",rootCategoryId);
			}
			
			var uiVisibleParams = data.parameters.filter(obj=> obj.serviceUiVisible);
			var sortedParams = _.sortBy(uiVisibleParams,"dataType").reverse();
			$.each(sortedParams, function (idx, param) {
				var $intermProcessorDiv = $processorDiv;
				if (typeof param.parentCategoryIds !== "undefined" && param.parentCategoryIds !== null) {
					$.each(param.parentCategoryIds.reverse(), function(index,categoryId) {
						if (parseInt($processorDiv.attr("id")) !== categoryId) {
							if (typeof $categoryTemplate === "undefined" && $("div#"+categoryId,$processorDiv).length === 0) {
								$categoryTemplate = $("div","#processor_category_template").clone().attr("id",categoryId);
								$("h4",$categoryTemplate).html(param.parentCategoryNames.reverse()[index]);
								$intermProcessorDiv.append($categoryTemplate);
							}
							$intermProcessorDiv = $("div#"+categoryId,$processorDiv);
						}
					});
				}
					
				if (parseInt($processorDiv.attr("id")) !== param.categoryId) {
					if ($("div#"+param.categoryId,$processorDiv).length > 0) {
						$intermProcessorDiv = $("div#"+param.categoryId,$processorDiv);
					} else {
						var $categoryTemplate = $("div","#processor_category_template").clone().attr("id",param.categoryId);
						$("h4",$categoryTemplate).html(param.category);
						$intermProcessorDiv.append($categoryTemplate);
						$intermProcessorDiv = $("div#"+param.categoryId,$processorDiv);
					}
				}
				//  add hidden class for those file element that depends on another parameter
				var parentParam = sortedParams.filter(obj => obj.key === param.key.substring(0,param.key.lastIndexOf(".")))[0];
				var hidden = false;
				if (typeof parentParam !== "undefined" && parentParam.key+"."+parentParam.value !== param.key) {
					hidden = true;
				}
				html = createProcessorHtml(param, hidden);
				$intermProcessorDiv.append(html);
			});
		}
		
		/* START scheduled type creation and action */
			function createScheduledTypeTemplate(prop) {
				var $scheduledTypeTemplate = $("tr","#scheduled_type_template").clone().attr("id",prop.name.replaceAll(" ","_"));
				$("td.task_name", $scheduledTypeTemplate).html(prop.name);
				//select a repeat type
				 $("select[name='schedule']>option[value='" + prop.repeatType + "']", $scheduledTypeTemplate).get(0).selected = true;
				// populate start date field
				$("input[name='startdate']",$scheduledTypeTemplate).attr("id", "startdate_" + prop.name.replaceAll(" ","_")).val(prop.firstRun);
				$("input[name='repeatafter']", $scheduledTypeTemplate).val(1);
				$("input[name='oneverydate']", $scheduledTypeTemplate).val(1);
				switch (prop.repeatType) {
					case 0:
						$(".div_repeatnever", $scheduledTypeTemplate).removeClass("hidden");
						break;
					case 1:
						$(".div_repeatafter", $scheduledTypeTemplate).removeClass("hidden");
						$("input[name='repeatafter']", $scheduledTypeTemplate).val(prop.repeatAfterDays);
						break;
					case 2:
						$(".div_oneverydate", $scheduledTypeTemplate).removeClass("hidden");
						$("input[name='oneverydate']", $scheduledTypeTemplate).val(prop.repeatOnMonthDay);
						break;
				}
				$("tbody",$categoryTemplate).append($scheduledTypeTemplate);
			}
			
			function createScheduledTypeSection (data,$processorDiv) {
				var processorScheduledData = $("#content").data("defaultScheduledType").filter(obj => obj.processorId === data.id);
				if (processorScheduledData.length > 0) {
					if ($("div#scheduled_task_"+data.id,$processorDiv).length > 0) {
						//delete extra rows
						$.each($("tbody tr",$("div#scheduled_task_"+data.id,$processorDiv)), function (idx,elem) {
							if ($("#content").data("defaultScheduledType").filter(obj => obj.processorId === data.id).filter(obj =>obj.name===elem.id).length === 0) {
								elem.remove();
							}
						});
						//add or modify rows
						$.each(processorScheduledData,function(idx,prop) {
							if ($("input#startdate_"+prop.name.replaceAll(" ","_"),$("div#scheduled_task_"+data.id,$processorDiv)).length > 0) {
								if (!$("input.startdate",$("div#scheduled_task_"+data.id,$processorDiv)).hasClass("changedByUser")) {
									$("input#startdate_"+prop.name.replaceAll(" ","_"),$("div#scheduled_task_"+data.id,$processorDiv)).data("DateTimePicker").date(prop.firstRun);
								}
							} else {
								createScheduledTypeTemplate(prop);
							}
						});
					} else {
						$categoryTemplate = $("div","#scheduled_type_category_template").clone().attr("id","scheduled_task_"+data.id);
						$("h4",$categoryTemplate).html("Scheduled type");
						$.each(processorScheduledData,function(idx,prop) {
							createScheduledTypeTemplate(prop);
						});
						$processorDiv.append($categoryTemplate);
						// Set dateTimePicker for startdate fileds
						$(".startdate", $processorDiv).datetimepicker({ format: "YYYY-MM-DD HH:mm:ss", showClose: true })
						.on('dp.show', function (e) {
							var datepicker = $('body').find('.bootstrap-datetimepicker-widget:last');
							var position = datepicker.offset();
							datepicker.appendTo('body');
							datepicker.css({ top: position.top, bottom: 'auto', left: position.left, right: 'auto' });
						})
						.on("dp.change", function (e) { 
							$(e.target).trigger("dp-change");
						});
					}
				}
			}
			
			$("#request_usr_page_3").on("change dp-change", ".schedule-row [name]", function (e) {
                switch (this.name) {
                    case "schedule": selectedSchedule(this); break;
                    case "repeatafter": jobEdit(this); break;
                    case "oneverydate": setMin(this); break;
                    case "startdate": jobEdit(this); break;
                }
            });
			
			function jobEdit(elem) {
				var $parent = $(elem).closest(".schedule-row");
				$parent.addClass("edit-mode");
				$(elem).addClass("changedByUser");
			}
		
			function selectedSchedule(elem) {
				var $parent = $(elem).closest(".schedule-row");
				var $div_repeatnever = $(".div_repeatnever", $parent);
				var $div_repeatafter = $(".div_repeatafter", $parent);
				var $div_oneverydate = $(".div_oneverydate", $parent);
				switch (elem.value) {
					case "0": // Once
						$div_repeatnever.removeClass("hidden");
						$div_repeatafter.addClass("hidden");
						$div_oneverydate.addClass("hidden");
						break;
					case "1": // Cycle
						$div_repeatnever.addClass("hidden");
						$div_repeatafter.removeClass("hidden");
						$div_oneverydate.addClass("hidden");
						break;
					case "2": // Repeat
						$div_repeatnever.addClass("hidden");
						$div_repeatafter.addClass("hidden");
						$div_oneverydate.removeClass("hidden");
						break;
					default: // Once by default
						$div_repeatnever.removeClass("hidden");
						$div_repeatafter.addClass("hidden");
						$div_oneverydate.addClass("hidden");
						break;
				}
				jobEdit(elem);
			}
		
			function setMin(elem) {
				jobEdit(elem);
				var $parent = $(elem).closest(".schedule-row");
				var val = $("input[name='oneverydate']", $parent).val();
				if (val < 1 || val > 31) {
					alert("Number should be between [1, 31]");
				}
			}
		/* END scheduled type creation and action */
		
		/* START validate input type file (must not be empty if are visible)*/
		function validateFileInputs() {
			var valid = true;
			$.each($("input[type='file']","#request_usr_page_3 div.panel-body.service:not(.hidden)"), function(idx,elem) {
				if (!$(elem).closest(".form-group.row").hasClass("hidden") && elem.value === "") {//add error label,if the file is empty
					valid = false;
					$(elem).closest(".form-group").append("<label class='error'>Select a file!</label>");
					return true;
				} else {
					$(elem).closest(".form-group").find("label.error").remove();//remove error label
				}
			});
			return valid
		}
		
		$("#request_usr_page_3").on("change","div.panel-body.service:not(.hidden) input[type='file']", function () {
			validateFileInputs();
		});
		/* END validate input type file (must not be empty if are visible)*/
		
/* Page navigation section */
		var processorIndex = 0;
		
		$("#content").on("click", ".go-to-page, .glyphicon.glyphicon-backward:not([disabled]), .glyphicon.glyphicon-forward:not([disabled])", function (e) {
			e.preventDefault();
			var visibleServiceIndex;
			var pageId = $(".ui-tabs-active", ".ui-tabs").index() + 1;
			var page3Parent = $(".go-to-page","div.form-page:not([style*='display: none'])").closest(".form-page").attr("id") === "request_usr_page_3";
			var action = "";
			if (pageId >= 0) {
				switch (e.currentTarget.textContent) {
					case "Previous":
						action = "previous";
						if (page3Parent) {
							visibleServiceIndex = parseInt($("div.panel-body.service:not(.hidden)", "#request_usr_page_3").attr("listindex"));
							if (visibleServiceIndex === 0) {
								set_usr_active_page(pageId - 1);
							} else {
								set_usr_active_page(pageId);
							}
						} else {
							set_usr_active_page(pageId - 1);
						}
						break;
					case "Back and edit":
						action = "previous";
						set_usr_active_page(pageId - 1);
						break;
					case "Next":
						action = "next";
						if (page3Parent) {
							set_usr_active_page(pageId, true);
						} else {
							set_usr_active_page(pageId + 1, true);
						}
						break;
					case "Review and submit the request":
						set_usr_active_page(pageId + 1, true);
						break;
				}
				switch (e.currentTarget.className) {
					case "glyphicon glyphicon-backward":
						action = "previous";
						if (page3Parent) {
							visibleServiceIndex = parseInt($("div.panel-body.service:not(.hidden)", "#request_usr_page_3").attr("listindex"));
							if (visibleServiceIndex === 0) {
								set_usr_active_page(pageId - 1);
							} else {
								set_usr_active_page(pageId);
							}
						} else {
							set_usr_active_page(pageId - 1);
						}
						break;
					case "glyphicon glyphicon-forward":
						action = "next";
						if (page3Parent && $("#right-btn", "#request_usr_page_3").html() === "Next") {
							set_usr_active_page(pageId, true);
						} else {
							set_usr_active_page(pageId + 1, true);
						}
						break;
				}
			}
			$("#myModalLoading").hide();
			$("#content").show();
			if ((action === "previous" && visibleServiceIndex === 0 && (pageId - 1) === 2) || (action === "next" && (pageId + 1) === 2)) {
				if (typeof myPolygonMap !== "undefined" && typeof myPolygonMap.map !== "undefined") {
					myPolygonMap.map.updateSize();
				}
			}
		});
		
		$("#request_usr_page_3").on("change", "select[id]", function(){
			if ($("*[id='"+this.id+"."+this.value+"']","#request_usr_page_3").length > 0){
				$("*[id='"+this.id+"."+this.value+"']","#request_usr_page_3").closest("div.form-group.row").removeClass("hidden");
			} else {
				$("*[id*='"+this.id+".'][id!='"+(this.id+"."+this.value)+"']","#request_usr_page_3").closest("div.form-group.row").addClass("hidden");
				// clear prevoius selected file
				$("*[id*='"+this.id+".'][id!='"+(this.id+"."+this.value)+"']","#request_usr_page_3").val("");
				//remove error label
				$("*[id*='"+this.id+".'][id!='"+(this.id+"."+this.value)+"']","#request_usr_page_3").closest(".form-group").find("label.error").remove();
			}
		});
		
		function set_usr_active_page(pageIndex, validation) {
			if (!validation || (validation && checkPageValidation())) {
				$("#content").hide();
				$("#myModalLoading").show();
				var prevPageId = $(".ui-tabs-active", ".ui-tabs").index() + 1;
				$("li:nth-child(" + pageIndex + ")>a", ".ui-tabs-nav ").trigger("click");
				
				$(".first-tag", "#request_usr_page" + pageIndex).focus();
				
				if (pageIndex == 2) {
					processorIndex = 0;
					if (validation && $("#request_usr_page_" + pageIndex).html().trim() === "") {
						showFragmentHtml("request.regionOfInterest.fragment.html", $("#request_usr_page_" + pageIndex));
					}
					
					if (typeof myPolygonMap !== "undefined" && typeof myPolygonMap.map !== "undefined") {
						myPolygonMap.map.updateSize();
					}
					if (prevPageId < pageIndex) {
						var currentServiceList = $("#processor").val();
						var currentSelectedService = $("#prevSites").val();
						if (JSON.stringify(currentServiceList) != JSON.stringify(previousServiceList)) {
							createObsDataList();
						}
					}
				}
				if (pageIndex == 3) {
					if (typeof $("#content").data("defaultScheduledType") === "undefined") {
						defaultScheduledTaskVal();
					}
					var selectedProcessors = $("#processor").val();
					
					var usedIndexes = 0;
					if (!validation && processorIndex > 0) {
						processorIndex = parseInt($("div.panel-body.service:not(.hidden)", "#request_usr_page_3").attr("listindex"));
						if (prevPageId == pageIndex) {
							processorIndex--;
						}
					}
					var indexGroup = processorIndex + 1;
					
					if (processorIndex < selectedProcessors.length) {
						var $processorDiv = $("#processor_config", "#processor_config_template").clone().removeAttr("id");
						var processorDivId = selectedProcessors[processorIndex];
						
						if ($("." + processorDivId,"#request_usr_page_" + pageIndex).length === 0) {
							usedIndexes = 1;
							var $subProcessor = $(".sub-service", "#sub_service_template").clone().addClass(processorDivId);
							$processorDiv.attr("id",processorDivId);
							createProcessorPramSection($("#content").data("serviceList").find(obj=> obj.id === parseInt(processorDivId)), $subProcessor);
							$processorDiv.append($subProcessor);
						}
						
						// hide all existing services div elements
						$("div.panel-body.service", "#request_usr_page_" + pageIndex).addClass("hidden");
						
						//set service div insert order
						if ($processorDiv.html() !== "") {
							var $element = $("div.panel-body.service", "#request_usr_page_" + pageIndex)[processorIndex];
							if (typeof $element !== "undefined") {
								$processorDiv.insertBefore($element);
							} else {
								$processorDiv.insertBefore($( ".submit-buttons", "#request_usr_page_" + pageIndex));
							}
						} else {
							$("." + processorDivId,"#request_usr_page_" + pageIndex).parent(".panel-body").removeClass("hidden");
							$("." + processorDivId,"#request_usr_page_" + pageIndex).trigger('classChange');
						}
						//add schedule type to processor
						if (typeof $("#content").data("defaultScheduledType") !== "undefined") {
							createScheduledTypeSection($("#content").data("serviceList").find(obj=> obj.id === parseInt(processorDivId)),$(".sub-service."+processorDivId, "#request_usr_page_" + pageIndex));
						}
						// set processor index (used on page navigation) only on next action
						if (validation) {
							$("div.service", "#request_usr_page_" + pageIndex).each(function () {
								var processorClass = this.classList[1];
								$(this).attr("listindex", $("#processor").val().indexOf(this.id));
							});
						}
						
						// Add right button text
						if (selectedProcessors.length - 1 > processorIndex) {
							$("#right-btn", "#request_usr_page_" + pageIndex).html("Next");
							processorIndex++;
						} else {
							$("#right-btn", "#request_usr_page_" + pageIndex).html("Review and submit the request");
						}
					}
				}
				if (pageIndex == 4) {
					prettifyNumericList();
					if ($("#request_usr_page_" + pageIndex).html().trim() === "") {
						showFragmentHtml("request.summary.fragment.html", $("#request_usr_page_" + pageIndex));
					}
					populate_summary_page();
				}
				var lastIndexOfIdSeparator = $(".form-page", "#request_usr_form").last().attr("id").lastIndexOf("_");
				var maxPages = parseInt($(".form-page", "#request_usr_form").last().attr("id").substr(lastIndexOfIdSeparator + 1));
				if (pageIndex === maxPages) {
					$("#content .glyphicon.glyphicon-forward").attr("disabled", true).addClass("hidden");
				} else if (pageIndex === 1) {
					$("#content .glyphicon.glyphicon-backward").attr("disabled", true).addClass("hidden");
				} else {
					$("#content").find(".glyphicon").attr("disabled", false).removeClass("hidden");
				}
			}
		}
		/* END Page navigation section */
	});

	$(window).on('load', removeLoadingImg());
	
	function removeLoadingImg() {
		$("#myModalLoading").hide();
		$("#content").show();
	};

</script>
