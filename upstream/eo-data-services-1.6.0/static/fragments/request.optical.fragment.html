<style>
	.panel-sub-title{color:#3a6ba0;}

	.sub-service.optical input[type="number"] {width:5rem;margin:0 1rem;padding-right:0;}
	.sub-service.optical input[type="text"] {width:33.3%;}
	.sub-service.optical input[type=number]::-webkit-inner-spin-button,.sub-service.optical input[type=number]::-webkit-outer-spin-button {height:30px;}
	
	label.composite-period{display:inline-flex;}
	.composite-text{font-weight:700!important;padding-top:5px;}
	
	.has-error input.form-control{border-color:#a94442}
	.has-error input.form-control:focus {border-color:#843534;-webkit-box-shadow:inset 0 1px 1px rgb(0 0 0 / 8%), 0 0 6px #ce8483;box-shadow:inset 0 1px 1px rgb(0 0 0 / 8%), 0 0 6px #ce8483;}

<div class="sub-service optical">
	<h4 class="panel-title">Optical</h4>
	<div class="form-group row">
		<label class="col-md-12">
			<span>The sensors function in the optical part of wavelength spectrum, and include visible, near infrared and short-wave infrared wavelengths. These wavelengths are useful for distinguishing between forest types and other vegetation classes. Satellite sensors commonly used for detailed mapping include Landsat, and Sentinel-2 with moderate resolution (pixel size 10 to 30 m).</span>
		</label>
	</div>
	
	<div class="panel-body">
		<h4 class="panel-title">Vegetation Index</h4>
		<div class="form-group row">
			<label class="col-md-5">
				<span>Select Vegetation Index to be used.</span>
			</label>
			<div class="form-group col-md-7">
				<label class="col-md-12" for="useNDVI">
					<input type="checkbox" class="form-control" name="vegetationIndex" id="useNDVI" value="NDVI" checked /><label>NDVI</label>
				</label>		
				<label class="col-md-12" for="useLAI">
					<input type="checkbox" class="form-control" name="vegetationIndex" id="useLAI" value="LAI" /><label>LAI</label>
				</label>
				<label class="col-md-12" for="useFAPAR">
					<input type="checkbox" class="form-control" name="vegetationIndex" id="useFAPAR" value="FAPAR" /><label>FAPAR</label>
				</label>		
				<label class="col-md-12" for="useFCOVER">
					<input type="checkbox" class="form-control" name="vegetationIndex" id="useFCOVER" value="FCOVER" /><label>FCOVER</label>
				</label>
			</div>
		</div>
	</div>
	
	<div class="panel-body">
		<h4 class="panel-title">Earth Observation Data</h4>
		<div class="form-group row">
			<label class="col-md-5">
				<span>Select Earth observation data to be used.</span>
			</label>
			<div class="col-md-7">
				<label class="col-md-12" for="useS2">
					<input type="checkbox" class="form-control" name="useS2" id="useS2" value="Sentinel-2" checked /><label>Sentinel-2</label>
				</label>		
				<label class="col-md-12" for="useL8">
					<input type="checkbox" class="form-control" name="useL8" id="useL8" value="Landsat-8" /><label>Landsat-8</label>
				</label>
			</div>
		</div>
		
		<div class="form-group row">
			<label class="col-md-5">
				<span>Select the output resolution. </span>
			</label>
			<div class="col-md-7">					
				<label class="col-md-5" for="output_resolution">
					<select id="output_resolution" name="output_resolution" class="form-control">
						<option id="resolution_10" value="10m">10m</option>
						<option id="resolution_20" value="20m">20m</option>
						<option id="resolution_30" value="30m">30m</option>
					</select>
				</label>
			</div>
		</div>
		
		<div class="form-group row">
			<label class="col-md-12">
				<span>If the previous selected observation data is Sentinel-2 all resolutions are available. For Landsat-8 only 20m or 30m resolution can be selected.
				In case both observation data are selected only the resolutions available for both can be chosen.</span>
			</label>
		</div>
	</div>

			<div class="form-group row">

							<option id="l2a_s2cor" value="l2a_s2cor">L2A and S2COR</option>
						</select>
					</label>
				</div>
			</div>

	<div id="composite_period_optical" class="panel-body">
		<h4 class="panel-title">Composite period</h4>
		<div class="form-group row">
			<label class="col-md-5">
				<span>Select the composite period that represents the interval when the composite is generated (every X days, weeks or months).</span>
			</label>
			<div class="col-md-7">
				<label class="col-md-6 composite-period"><span class="composite-text">Every</span> <input type="number" class="form-control" name="selected_number_optical" id="selected_number_optical" min="1" value="7"/> 
					<select name="selected_period_optical" id="selected_period_optical" class="form-control">
						<option value="days" selected>Days</option>
						<option value="weeks">Weeks</option>
						<option value="months">Months</option>
					</select>
				</label>
			</div>
		</div>
		
		<div class="form-group row">
			<label class="col-md-5">
				<span>Select the composite window that represents the period of time to tahe into account when the composite is generated (X days).</span>
			</label>
			<div class="col-md-7">
				<label class="col-md-12 composite-period"><input type="number" class="form-control" name="selected_number_optical" id="selected_number_optical" min="1" value="30"/> <span class="composite-text">Days</span></label>
			</div>
		</div>
	</div>
	
	<div class="panel-body">
		<h4 class="panel-title">Metadata items to be generated</h4>
		<div class="form-group row">
			<label class="col-md-12">
				<span>Check the box in order to recevive information about cloud free pixel number and acquisition dates of cloud free pixels.</span>
			</label>
		</div>
		<div class="form-group">
			<label class="col-md-12 first-tag" for="cloud_free_nr_info">
				<input type="checkbox" class="form-control" name="cloud_free_nr_info" id="cloud_free_nr_info"/><label>Get information about cloud free pixel number</label>
			</label>
			<label class="col-md-12 first-tag" for="acquisition_cloud_free_info">
				<input type="checkbox" class="form-control" name="acquisition_cloud_free_info" id="acquisition_cloud_free_info"/><label>Get information about acquisition dates of cloud free pixels</label>
			</label>
		</div>
	</div>
</div>

	$("#selected_number_optical, #selected_period_optical").on("change", function(e) {
