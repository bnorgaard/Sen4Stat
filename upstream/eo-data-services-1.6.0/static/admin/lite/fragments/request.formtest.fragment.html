<style>

<script type="text/javascript">
	function purgeAllProductsDialogs() {
		purgeUiDialog("request_submit");
	}

	$(document).ready(function() {
		var previousServiceList = [];
		var formData = new FormData();
		$("#wp-custom-header h1.header-post-title-class").html("User service request");
		$("ul", ".request-form").addClass("hidden");
		$(".request-form").tabs({
			activate: function (event, ui) {
				var currentServiceList = $("#processor").val();
				switch (ui.newPanel.get(0).id) {
					case "tab_usr_page1":
						break;
					case "request_usr_page_1":
						if (JSON.stringify(currentServiceList) != JSON.stringify(previousServiceList)) {
							previousServiceList = $("#processor").val();
						}
						break;
					case "request_usr_page_2":						
						if (JSON.stringify(currentServiceList) != JSON.stringify(previousServiceList)) {
							existingServices();
						}
						break;
				}
			}
		});
		
		$("#processor").on("change", function (e) {
			if ($("#processor").val().indexOf("agriculture") >= 0) { 
				$(this).siblings(".info").html("EarthAgriculture service provides reports and statistical analysis of the vegetation status over several crop types into an area of interest over a season");
			} else {
				$(this).siblings(".info").html("");
			}
			$(this).siblings(".extra-info").html("");
			$.each ($(this).children("option:selected"), function (index, option) {
				if ($(this).parent().siblings(".extra-info").html() !== "") {
					$(this).parent().siblings(".extra-info").append("<br/><br/>");
				}
				$(this).parent().siblings(".extra-info").append($(option).data("description"));
			});
		});

		$("body").on("change", ".has-group-toggle", function (e) {
			if ($(this).is(':checked')) {
				$(this).closest(".form-group").next().removeClass("hidden");
			} else {
				$(this).closest(".form-group").next().addClass("hidden");
			}
		});
		
		$("#content").on("change", "#insituDataFile, #modeSupervisedFile, #l4SupervisedFile, #referenceMapFile, #referenceMapFileBoth",function (){
			$(this).closest(".form-group").find("label.error").remove();
		});
		
		/* Functions */
			/* START Get existing projects and populate the fileds*/
			var getExistingServices = function () {
				return $.ajax({
					beforeSend: function(xhr) { xhr.setRequestHeader("X-Auth-Token", window.tokenKey); },
					cache: false,
					async: false,
					url  : "/services/all-reuse?userId="+window.userID,
					type : "GET"
				});
			};
		
			function existingServices(){
				$.when(getExistingServices()).done(function (response){
					if (response.status === responseStatus.success) {
						$("#content").data("existingServices", response.data);
					} else {
						console.log(response.status + ": " + response.message);
					}
				});
			}
			/* END Get existing projects and populate the fileds*/
		
		// Get Regex pattern for a comma separated list of numbers between 1 and maxValue
		// (only works when maxValue is between 100 and 999)
		function getListOfNumbersRegex(maxValue) {
			var hundreds = parseInt(maxValue/100);
			if (hundreds > 0) {
				var decimals = parseInt((maxValue - hundreds*100)/10);
				var units    = parseInt(maxValue - hundreds*100 - decimals*10);
				
				var number = "[1-9]|[1-9][0-9]|";
				number += hundreds > 1 ? "[1-" + (hundreds-1) + "][0-9][0-9]|" : "";
				number += decimals > 0 ? hundreds + "[0-" + (decimals-1) + "][0-9]|" : "";
				number += (hundreds*10+decimals) + "[0-" + units + "]";
				return "^ *(" + number + ")( *, *(" + number + "))* *$";
			} else {
				return "^.*$";
			}
		}

		// Clean list format to match the following example: n1, n2, n3, ...
		function prettifyNumericList() {
			$.each($(".numeric-list"), function () {
				// Trim value
				var list = $(this);
				var value = list.val().replace(/^ *| *$/g, "");
				value = value.replace(/ *, */g, ", ");
				list.val(value);
			});
		}
		
		// Populate summary page;
		function populate_summary_page() {
			// PAGE 1: About the service request
			var selectedProcessors = $("#processor").val();
			var selectedProcessorsText = [];
			$("option:checked","#processor").toArray().forEach(function (currentValue) {  
				selectedProcessorsText.push(currentValue.outerHTML.replace("EarthAgriculture - ",""))
			});
			
			$("#sum_usr_processor"         ).html(selectedProcessorsText);
			$("#sum_usr_project_name"      ).html($("#name").val());
			$("#sum_usr_additional_support").html($("#additionalSupport").val().replace(/\n/g, "<br/>"));
			
			// PAGE 2: Parameterize the selected services
			if ($("#useS2").is(":checked")) {
				$("#sum_usr_useS2").html('&#10003;').css({ color: "" });
			} else {
				$("#sum_usr_useS2").html('&#10007;').css({ color: "#b7b7b7" });
			}
			if ($("#useL8").is(":checked")) {
				$("#sum_usr_useL8").html('&#10003;').css({ color: "" });
			} else {
				$("#sum_usr_useL8").html('&#10007;').css({ color: "#b7b7b7" });
			}
			// Show selected services summary
			if ($.inArray("l3b", selectedProcessors) >= 0) {
				$(".vegetation", "#request_usr_page_4").removeClass("hidden");
				if ($("#includeNDVI").is(":checked")) {
					$("#sum_usr_includeNDVI").html('&#10003;').css({ color: "" });
				} else {
					$("#sum_usr_includeNDVI").html('&#10007;').css({ color: "#b7b7b7" });
				}
				if ($("#includeLAI").is(":checked")) {
					$("#sum_usr_includeLAI").html('&#10003;').css({ color: "" });
				} else {
					$("#sum_usr_includeLAI").html('&#10007;').css({ color: "#b7b7b7" });
				}
			} else {
				$(".vegetation", "#request_usr_page_4").addClass("hidden");
			}
			
			if ($.inArray("l4a", selectedProcessors) >= 0 && $.inArray("l4b", selectedProcessors) < 0) {
				$(".dynamic_crop_mask", "#request_usr_page_4").removeClass("hidden");
				if ($("input[name='crop_mask_mode']:checked").val() == "Unsupervised") {
					$("#sum_usr_mode_unsupervised"      ).html('&#10003;').css({ color: "" });
					$("#sum_usr_mode_supervised"        ).html('&#10007;').css({ color: "#b7b7b7" });
					$("#sum_usr_mode_use_EarthSignature").html('&#10007;').css({ color: "#b7b7b7" });
				} else if ($("input[name='crop_mask_mode']:checked").val() == "Supervised") {
					$("#sum_usr_mode_supervised"        ).html('&#10003;').css({ color: "" });
					$("#sum_usr_mode_unsupervised"      ).html('&#10007;').css({ color: "#b7b7b7" });
					$("#sum_usr_mode_use_EarthSignature").html('&#10007;').css({ color: "#b7b7b7" });
				} else {
					$("#sum_usr_mode_use_EarthSignature").html('&#10003;').css({ color: "" });
					$("#sum_usr_mode_unsupervised"      ).html('&#10007;').css({ color: "#b7b7b7" });
					$("#sum_usr_mode_supervised"        ).html('&#10007;').css({ color: "#b7b7b7" });
				}
			} else {

			}
			
			if ($.inArray("l4a", selectedProcessors) < 0 && $.inArray("l4b", selectedProcessors) >= 0) {
				$(".crop_type_map", "#request_usr_page_4").removeClass("hidden");
				if ($("input[name='crop_map_mode']:checked").val() == "Supervised") {
					$("#sum_usr_mode_insitu", "div.crop_type_map"        ).html('&#10003;').css({ color: "" });
					$("#sum_usr_mode_EarthSignature", "div.crop_type_map").html('&#10007;').css({ color: "#b7b7b7" });
				} else {
					$("#sum_usr_mode_EarthSignature", "div.crop_type_map").html('&#10003;').css({ color: "" });
					$("#sum_usr_mode_insitu", "div.crop_type_map"        ).html('&#10007;').css({ color: "#b7b7b7" });
				}
				if ($("#useReferenceMap").is(":checked")) {
					$("#sum_usr_useReferenceMap", "div.crop_type_map").html('&#10003;').css({ color: "" });
				} else {
					$("#sum_usr_useReferenceMap", "div.crop_type_map").html('&#10007;').css({ color: "#b7b7b7" });
				}
			} else {
				$(".crop_type_map", "#request_usr_page_4").addClass("hidden");
			}
			
			if ($.inArray("l4a", selectedProcessors) >= 0 && $.inArray("l4b", selectedProcessors) >= 0) {
				$(".crop_mask_type", "#request_usr_page_4").removeClass("hidden");
				if ($("input[name='crop_mask_type_mode']:checked").val() == "Supervised") {
					$("#sum_usr_mode_insitu", "div.crop_mask_type"       ).html('&#10003;').css({ color: "" });
					$("#sum_usr_mode_EarthSignature", "div.crop_mask_type").html('&#10007;').css({ color: "#b7b7b7" });
				} else {
					$("#sum_usr_mode_EarthSignature", "div.crop_mask_type").html('&#10003;').css({ color: "" });
					$("#sum_usr_mode_insitu", "div.crop_mask_type"        ).html('&#10007;').css({ color: "#b7b7b7" });
				}
				if ($("#useReferenceMap").is(":checked")) {
					$("#sum_usr_useReferenceMap", "div.crop_mask_type").html('&#10003;').css({ color: "" });
				} else {
					$("#sum_usr_useReferenceMap", "div.crop_mask_type").html('&#10007;').css({ color: "#b7b7b7" });
				}
			} else {
				$(".crop_mask_type", "#request_usr_page_4").addClass("hidden");
			}
			
			// Region of interest
			$("#sum_usr_refp").html($("#shapeFile").val().split('\\').pop() + "&nbsp;");

			$("#sum_usr_lonmin").html($("#lonmin").val());
			$("#sum_usr_lonmax").html($("#lonmax").val());
			
			// Sensing period section
			$("#sum_usr_time_range_from").html($("#startDate").val());

		}
			
		function drawRectangle(latmin, latmax, lonmin, lonmax, source) {
		   
			var polyCoords = [];
			var p1 = lonmin + "," + latmin;
			var p2 = lonmax + "," + latmin;
			var p3 = lonmax + "," + latmax;
			var p4 = lonmin + "," + latmax;
			var coords = (p1 + " " + p2 + " " + p3 + " " + p4).split(' ');
			for (var i in coords) {
				var c = coords[i].split(',');
				polyCoords.push(ol.proj.transform([parseFloat(c[0]), parseFloat(c[1])], 'EPSG:4326', 'EPSG:3857'));
			}
		   
			var feature = new ol.Feature({
				geometry: new ol.geom.Polygon([polyCoords])
			});
			feature.setProperties({"extraFeatureDescription": "preview"});
			source.clear();
			source.addFeature(feature);
		   
			return feature;
		}
/* END Functions */

/* Validation section */
		// Custom validation for comma separated lists of numbers between 1 and maxValue (only works with maxValue between 100 and 999)
		$.validator.addMethod('commaSeparatedList', function (value, element, params) {
			var pattern = new RegExp(getListOfNumbersRegex(params.maxValue), "g");
			var sentinelChk = $(element).closest(".sentinel-group").find('input[type="checkbox"]');
			if (sentinelChk.is(":checked")) {
				var match = value.match(pattern);
				return (value.length == 0 || match);
			}
			return true;
		}, 'Invalid list of comma separated numbers');
		
		// Custom validation for ROI selection (shape file or lat/lon)
		$.validator.addMethod('roiSelect', function (value, element, params) {
			if ($("#shapeFile").closest("div").find("label#roiSelect-error").length > 0) {
				clearRegionOfInterest();
			}
			return $("#shapeFile").val() != ''|| $(".latlon input[type='number']").filter(function () { return this.value !== ''; }).length == 4;
		}, 'Select either a shapefile or the geographical coordinates.');
		
		// Custom validation for a set of two dates
		$.validator.addMethod('datesGroupValidation', function(value, element, params) {
			var dates = $(".date-field", "#" + params.datesGroup).filter(function () { return this.value !== ''; });
			return dates.length == 2 && $(dates[0]).datepicker("getDate") <= $(dates[1]).datepicker("getDate");
		}, function (params, element) {
			var dates = $(".date-field", "#" + params.datesGroup).filter(function () { return this.value !== ''; });
			return dates.length < 2 ? 'Both fields above are required' : 'Start date should not be greater than end date';
		});
		
		$.validator.addMethod('supervisedCropMask', function(value) {
			if (value === "Supervised") {
				return $("#modeSupervisedFile").val() != "";
			}
			return true;
		}, 'Reference crop mask file must be selected!');
		
		$.validator.addMethod('supervisedCropType', function(value) {
			if (value === "Supervised") {
				return $("#insituDataFile").val() != "";
			}
			return true;
		}, 'In-situ Data file must be selected!');
		
		$.validator.addMethod('supervised', function(value) {
			if (value === "Supervised") {
				return $("#l4SupervisedFile").val() != "";
			}
			return true;
		}, 'In-situ Data file must be selected!');
		
		$.validator.addMethod('referenceCropMask', function(value, element) {
			if (value === "on") {
				if ($(element).attr("id") === "useReferenceMap") {
					return $("#referenceMapFile").val() != "";
				}
				if ($(element).attr("id") === "useReferenceMapBoth") {
					return $("#referenceMapFileBoth").val() != "";
				}
			}
			return true;
		}, 'Reference crop mask file must be selected!');
		
		//Form validation
		$("#request_usr_form").validate({
			rules: {
				// PAGE 1
				processor      		: { required: true },
				name   				: { required: true },
				// PAGE 2
				latmin  	       	: { roiSelect: true },
				latmax      	   	: { roiSelect: true },
				lonmin         		: { roiSelect: true },
				lonmax        	  	: { roiSelect: true },
				shapeFile   	    : { roiSelect: true },
				startDate			: { datesGroupValidation: { datesGroup: "time_range_grp" } },
				endDate  			: { datesGroupValidation: { datesGroup: "time_range_grp" } },
				crop_mask_mode		: { supervisedCropMask: true},
				crop_map_mode		: { supervisedCropType: true},
				crop_mask_type_mode : { supervised: true},
				useReferenceMap 	: { referenceCropMask: true},
				useReferenceMapBoth : { referenceCropMask: true},
				// PAGE 3
				conditions      	: { required: true }
			},
			highlight: function(element, errorClass) {
				$(element).closest(".form-group").addClass("has-error");
			},
			unhighlight: function(element, errorClass) {
				$(element).closest(".form-group").removeClass("has-error");
			},
			groups: {
				roiSelect    : "latmin latmax lonmin lonmax shapeFile",
				timeRange    : "startDate endDate"
			},
			messages: {
			},
			errorPlacement: function(error, element) {
				$(error).addClass("col-md-12");
				if (element.closest(".roi").length > 0) {
					error.appendTo($(element).closest(".roi").find(">div.form-group:last-child"));
				} else if (element.hasClass("numeric-list")) {
					error.appendTo($(element).parent());
				} else {
					error.appendTo($(element).closest(".form-group"));
				}
			},
			success: function(label) {
				label.remove();
			}
		});
		
		function checkPageValidation() {
			if ($("#request_usr_form").valid()) {
				return true;
			} else {
				var ferror = $("label.error:visible", ".form-page:visible").first();
				// PAGE 1
				
				// PAGE 2
				if ($(ferror).attr("for") == "roiSelect") {
					if      ($("#latmin").val() == '') { $("#latmin").first().focus(); }
					else if ($("#latmax").val() == '') { $("#latmax").first().focus(); }
					else if ($("#lonmin").val() == '') { $("#lonmin").first().focus(); }
					else                               { $("#lonmax").first().focus(); }
				} else if ($(ferror).attr("for") == "timeRange") {
					if   ($("#startDate").val() == "") { $("#startDate").first().focus(); }
					else      						   { $("#endDate").first().focus(); }
				} else { $(ferror).focus(); }
				return false;
			}
		}
/* END Validation section */

/* Page navigation section */
		var processorIndex = 0;
		$("#content").on("click", ".go-to-page, .glyphicon.glyphicon-backward:not([disabled]), .glyphicon.glyphicon-forward:not([disabled])", function (e) {
			e.preventDefault();
			var pageId = $(".ui-tabs-active", ".ui-tabs").index() + 1;
			var page3Parent = $(".go-to-page","div.form-page:not([style*='display: none'])").closest(".form-page").attr("id") === "request_usr_page_3";
			
			if (pageId >= 0) {
				switch (e.currentTarget.textContent) {
					case "Previous":
						if (page3Parent) {
							visibleServiceIndex = parseInt($("div.panel-body:not(.hidden)", "#request_usr_page_3").find("div.sub-service").attr("listindex"));
							if (visibleServiceIndex === 0) {
								set_usr_active_page(pageId - 1);
							} else {
								set_usr_active_page(pageId);
							}
						} else {
							set_usr_active_page(pageId - 1);
						}
						break;
					case "Back and edit":
						set_usr_active_page(pageId - 1);
						break;
					case "Next":
						if (page3Parent) {
							set_usr_active_page(pageId, true);
						} else {
							set_usr_active_page(pageId + 1, true);
						}
						break;
					case "Review and submit the request":
						set_usr_active_page(pageId + 1, true);
						break;
				}
				switch (e.currentTarget.className) {
					case "glyphicon glyphicon-backward":
						if (page3Parent) {
							visibleServiceIndex = parseInt($("div.panel-body:not(.hidden)", "#request_usr_page_3").find("div.sub-service").attr("listindex"));
							if (visibleServiceIndex === 0) {
								set_usr_active_page(pageId - 1);
							} else {
								set_usr_active_page(pageId);
							}
						} else {
							set_usr_active_page(pageId - 1);
						}
						break;
					case "glyphicon glyphicon-forward":
						if (page3Parent && $("#right-btn", "#request_usr_page_3").html() === "Next") {
							set_usr_active_page(pageId, true);
						} else {
							set_usr_active_page(pageId + 1, true);
						}
						break;
				}
			}
		});
		
		function set_usr_active_page(pageIndex, validation) {
			if (!validation || (validation && checkPageValidation())) {
				var prevPageId = $(".ui-tabs-active", ".ui-tabs").index() + 1;
				$("li:nth-child(" + pageIndex + ")>a", ".ui-tabs-nav ").trigger("click");
				
				$(".first-tag", "#request_usr_page" + pageIndex).focus();
				
				if (pageIndex == 2) {
					processorIndex = 0;
					if (validation && $("#request_usr_page_" + pageIndex).html().trim() === "") {
						showFragmentHtml("request.regionOfInterest.fragment.html", $("#request_usr_page_" + pageIndex));
					}
					
					if (typeof myPolygonMap !== "undefined" && typeof myPolygonMap.map !== "undefined") {
						myPolygonMap.map.updateSize();
					}
				}
				if (pageIndex == 3) {
					var selectedProcessors = $("#processor").val();
					
					var usedIndexes = 0;
					if (!validation && processorIndex > 0) {
						processorIndex = parseInt($("div.panel-body:not(.hidden)", "#request_usr_page_3").find("div.sub-service").attr("listindex"));
						if (prevPageId == pageIndex) {
							processorIndex--;
						}
					}
					var indexGroup = processorIndex + 1;
					
					if (processorIndex < selectedProcessors.length) {
						var $processorDiv = $("#processor_config", "#processor_config_template").clone().removeAttr("id");
						var processorDivClass = selectedProcessors[processorIndex];
						if (selectedProcessors[processorIndex] == "l4a" && typeof selectedProcessors[indexGroup] !== "undefined" && selectedProcessors[indexGroup] == "l4b") {
							usedIndexes = 2;
							processorDivClass = "l4";
							if ($("." + processorDivClass,"#request_usr_page_" + pageIndex).length === 0) {								
								showFragmentHtml("request." + processorDivClass + ".fragment.html", $processorDiv);
							}							
						} else {
							usedIndexes = 1;
							if ($("." + processorDivClass,"#request_usr_page_" + pageIndex).length === 0) {
								showFragmentHtml("request." + processorDivClass +".fragment.html", $processorDiv);
							}
						}
						
						// hide all existing services div elements
						$("div.panel-body", "#request_usr_page_" + pageIndex).addClass("hidden");
						
						//set service div insert order
						if ($processorDiv.html() !== "") {							
							var $element = $("div.panel-body", "#request_usr_page_" + pageIndex)[processorIndex];
							if (typeof $element !== "undefined") {
								$processorDiv.insertBefore($element);
							} else {
								$processorDiv.insertBefore($( ".submit-buttons", "#request_usr_page_" + pageIndex));
							}
						} else {
							$("." + processorDivClass,"#request_usr_page_" + pageIndex).parent(".panel-body").removeClass("hidden").trigger('classChange');
						}
						
						// set processor index (used on page navigation) only on next action
						if (validation) {
							$("div.sub-service", "#request_usr_page_" + pageIndex).each(function () {
								var processorClass = this.classList[1];
								if (processorClass === "l4") {
									$(this).attr("listindex", $("#processor").val().indexOf("l4a"));
								} else {
									$(this).attr("listindex", $("#processor").val().indexOf(processorClass));
								}
							});
						}
						
						// Add right button text
						if (selectedProcessors.length - usedIndexes > processorIndex) {							
							$("#right-btn", "#request_usr_page_" + pageIndex).html("Next");							
						} else {
							$("#right-btn", "#request_usr_page_" + pageIndex).html("Review and submit the request");
						}
						
						// increment index
						if (processorIndex < selectedProcessors.length - 1) {
							processorIndex++;
						}
					}
				}
				if (pageIndex == 4) {
					prettifyNumericList();
					if ($("#request_usr_page_" + pageIndex).html().trim() === "") {
						showFragmentHtml("request.summary.fragment.html", $("#request_usr_page_" + pageIndex));
					}
					populate_summary_page();
				}
				var lastIndexOfIdSeparator = $(".form-page", "#request_usr_form").last().attr("id").lastIndexOf("_");
				var maxPages = parseInt($(".form-page", "#request_usr_form").last().attr("id").substr(lastIndexOfIdSeparator + 1));
				if (pageIndex === maxPages) {
					$("#content .glyphicon.glyphicon-forward").attr("disabled", true);
				} else if (pageIndex === 1) {
					$("#content .glyphicon.glyphicon-backward").attr("disabled", true);
				} else {
					$("#content").find(".glyphicon").attr("disabled", false);
				}
			}
		}
	});
/* END Page navigation section */


//# sourceURL=request_form.js
</script>
