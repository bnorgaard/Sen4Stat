<style>
	.sub-service.l4 input[type="number"] {width:10%;margin-right:1rem;}
	.sub-service.l4 input[type="text"] {width:33.3%;}
</style>
<div class="sub-service l4">
	<h4 class="panel-title">Dynamic Crop Mask & Crop Type Map</h4>
	<div class="form-group row">
		<label class="col-md-12">
			<span>Binary map separating annual cropland areas and other areas, thus corresponding to a mask over annually cultivated area. This binary map is produced along the agricultural season on a monthly basis, to serve for instance as a mask for monitoring crop growing conditions, as basis for sampling stratification and for agricultural extension.</span>
		</label>
		<label class="col-md-12">
			<span>Map of the main crop types in a given region, with a minimum mapping unit of 0.01 ha and provided along with several quality flags. The crop types are classified over the cropland area identified in the cropland mask. The map is generated twice over the season, at the middle and at the end of the season.</span>
		</label>
	</div>
	<div class="form-group row">
		<div>
			<label class="col-md-12" for="usel4al4bSupervisedFile">
				<input type="radio" class="form-control" name="crop_mask_type_mode" id="usel4al4bSupervisedFile" value="Supervised"/>
				<label class="title">In-situ Data</label>
				<label class="col-md-12">
					<span>Please define your In-situ Data using a GIS layer in ESRI Shapefile (in a zip file including all the components of the layer), GeoJSON or KML format.</span>
					<input type="file" class="form-control mode_supervised_group" id="l4SupervisedFile" name="l4SupervisedFile" accept="application/zip,application/x-zip,application/x-zip-compressed,application/octet-stream,.kml,.geojson" onchange="$(this).trigger('blur');" disabled="disabled"/>
				</label>
			</label>
		</div>
		<label class="col-md-12" for="useEarthSignature">
			<input type="radio" class="form-control" name="crop_mask_type_mode" id="usel4al4bEarthSignature" value="EarthSignature" checked />
			<label class="title">EarthSignature</label>
		</label>
		<label class="col-md-12" style="padding-top:3rem;">
			<span>Schedule type represents the time period when the crop mask is generated. The start date must be after the middle of the sensing period.</span>
		</label>
		<div>
			<label class="col-md-12" for="schedule_once">
				<input type="radio" class="form-control" name="schedule_type" id="schedule_once" value="Once" checked />
				<label class="title">Once</label>
				<label class="col-md-12" style="display:inline-flex;padding: 1.5rem 0 0 2.7rem;">
					<strong style="width:15%;">First run time:</strong>
					<input type="text" class="form-control date-field timeRun" name="onceFirstTimeRun" id="onceFirstTimeRun" autocomplete="off" value="" />
				</label>
			</label>
		</div>
		<div>
			<label class="col-md-12" for="schedule_repeat">
				<input type="radio" class="form-control" name="schedule_type" id="schedule_repeat" value="Repeat" />
				<label class="title">Repeat</label>
				<label class="col-md-12" style="display:inline-flex;padding:1.5rem 0 0 2.7rem;">
					<strong style="width:15%;">First run time:</strong>
					<input type="text" class="form-control date-field timeRun" name="repeatFirstTimeRun" id="repeatFirstTimeRun" autocomplete="off" value="" disabled />
					<strong style="width:10%;padding-left:2rem;">Every:</strong>
					<input type="number" class="form-control" name="oneverydate" id="oneverydate" min="1" max="31" step="1" value="" disabled /> day of month
				</label>
			</label>
		</div>
	</div>
</div>
<script type="text/javascript">
	$(document).ready(function() {
		$("input[name='crop_mask_type_mode']").change(function (){
			$(this).closest(".form-group").find("label.error").remove();
			if ($(this).is(":checked") && $(this).attr("id") === "usel4al4bSupervisedFile") {
				$("#l4SupervisedFile").prop("disabled", false);
			} else {
				$("#l4SupervisedFile").prop("disabled", true);
			}
		});
	});

	// Date pickers with active validation
	$("#onceFirstTimeRun").datepicker({ changeYear: true, changeMonth: true, yearRange: "1970:2037", dateFormat: "yy-mm-dd" })
	.on('change', function() {
		if ($("#l4aOnceFirstTimeRun").val() != "") { 
			$(this).valid();
		}
	});
	
	$("#repeatFirstTimeRun").datepicker({ changeYear: true, changeMonth: true, yearRange: "1970:2037", dateFormat: "yy-mm-dd" })
	.on('change', function() {
		if ($("#l4aRepeatFirstTimeRun").val() != "") { 
			$(this).valid();
		}
	});
//# sourceURL=request_l4.js
</script>
