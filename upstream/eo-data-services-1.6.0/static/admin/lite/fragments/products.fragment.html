<script type="text/javascript">
// ======================== PUBLIC Graph Colors ======================== //
var graphColors =["#009945","#003366","#660000","#006666","#660066","#e17831","#25bb32","#a81541","#83c998","#e49a6d","#696969","#bada55","#7fe5f0","#ff0000","#ff80ed","#407294","#cbcba9","#f6f73d","#133337","#065535","#c0c0c0","#5ac18e","#f7347a","#576675","#ffc0cb","#008080","#ffd700","#ffa500","#ff7373","#00ffff","#40e0d0","#d3ffce","#0000ff","#b0e0e6","#c6e2ff","#003366","#fa8072","#ffff00","#7fffd4","#ffb6c1","#800000","#800080","#f08080","#c39797","#00ff00","#fff68f","#cccccc","#ffc3a0","#333333","#20b2aa"]

// ======================== PUBLIC PRODUCTS FUNCTIONS ======================== //

// ======================== DOCUMENT READY ======================== //
$(document).ready(function() {
	// Get site seasons
	var getSiteSeasons = function (siteId) {
		return $.ajax({
			cache: false,
			url: baseApiUrl + "sites/seasons?site=" + siteId,
			type: 'GET'
		});
	};
	
	
	// === Dialog Ui Functions ========================================================================== //
	function defineFormDialogs() {
		// Clear all previously defined dialogs
		purgeAllProductsDialogs();	
		
		// sites_browser dialog
		$("#sites_browser")
		.dialog({
			title: "EarthAgriculture Browser",
			width: "460px",
			autoOpen: true,
			modal: false,
			draggable: false,
			resizable: false,
			closeOnEscape: false,
			position: { my: "left top", at: "left+10px top+10px", of: "body" },
			dialogClass: "clean-slate sites_browser",
			dashConvert: {
				title: "Site &raquo; Product type &raquo; Product",
				buttons: { reduce: "left", home: "right" }
			},
		})
		.on("reduce", function () {
			myPolygonMap.setPanPercentage(getMapPanPercentage());
		});
		// Filters dialog
		$("#search_filters")
		.dialog({
			title: "FILTERS",
			width: "460px",
			autoOpen: false,
			modal: false,
			resizable: false,
			closeOnEscape: false,
			position: { my: "left top", at: "left bottom", of: $("#sites_browser .filter") },
			dialogClass: "clean-slate filters",
			dashConvert: {
				title: "Configurations",
				buttons: { close: "right" }
			}
		});
		// Properties dialog
		$("#properties")
		.dialog({
			title: "PROPERTIES",
			width: "460px",
			autoOpen: false,
			modal: false,
			resizable: false,
			closeOnEscape: false,
			position: { my: "left top", at: "right+10px top", of: $("#sites_browser").parent() },
			dialogClass: "clean-slate properties",
			dashConvert: {
				title: "File name",
				buttons: { minimize: "left", close: "right" }
			}
		}).on("minimize", function (e) {
			var $dialog = $(this).closest(".ui-dialog");
			// Check left window position
			var windowWidth  = $(window).width();
			var dialogLeft      = $dialog.offset().left;
			var dialogWidth     = $dialog.outerWidth();
			if (dialogLeft + dialogWidth > windowWidth) {
				alignDialogRight($dialog);
			}
			// Check top window position
			var windowHeight = $(window).height();
			var dialogTop    = $dialog.offset().top;
			var dialogHeight  = $dialog.outerHeight() + 15;
			if (dialogTop + dialogHeight > windowHeight) {
				var newTop = windowHeight - dialogHeight;
				newTop = newTop < 10 ? 10 : newTop;
				$dialog.css({ "top": newTop + "px", "max-width": "100%"});
			}
		});
	}
	function alignDialogRight($dialog, top) {
		var mapControlsLeft = $(".ol-zoom", myPolygonMap.container).offset().left;
		var dialogWidth     = $dialog.outerWidth();
		if($dialog.hasClass("minimized")){
			dialogWidth = $dialog.removeClass("minimized").outerWidth();
			$dialog.addClass("minimized");
		}
		var dialogLeft      = mapControlsLeft - 10 - dialogWidth;
		dialogLeft = dialogLeft < 10 ? 10 : dialogLeft;
		$dialog.css({ "left": dialogLeft + "px" });
		if (typeof top !== "undefined") {
			$dialog.css({ "top": top + "px" });
		}
	}
	
	// === FILE TREE SECTION ========================================================================== //
	function refreshTree(attributes, filter) {
		var root = (typeof attributes === "undefined");
		var deferred = $.Deferred();
		
		if (root) $(".treeview-loading").removeClass("hidden");
		var url = baseApiUrl + "products/?userId=" + window.userID + "&siteId=0&productTypeId=0";
		if (attributes && attributes.site && attributes.fileInfo) {
			url = baseApiUrl + "products/?userId=" + window.userID + "&siteId=" + attributes.site.id + "&productTypeId=" + attributes.fileInfo.fileID;
		}
		$.ajax({
			url: url,
			type: "GET",
			dataType: 'json',
			beforeSend: function (xhr) {
				xhr.setRequestHeader("Accept", "application/json");
				xhr.setRequestHeader("Content-Type", "application/json");
			},
			success: function(response) {
				if (root) $(".treeview-loading").addClass("hidden");
				if (response.status === responseStatus.success) {							  
					if (root) {
						var data = response.data;
						if (typeof filter === "undefined"){
							populateFiltersForm(data);
						} else {
							data = responseFilter(response.data, filter);
						}
						populateTreeBranch(data);
					} else {
						// Reach products list for selected Product Type
						$.each(response.data, function () {
							$.each(this.products, function () {
								populateTreeBranch(this, attributes.relativePath);
							});
						});
					}
					deferred.resolve(response);
				} else {
					alert(response.message);
					deferred.reject(null, response.status, response.message);
				}
			},
			error: function (jqXHR, textStatus, errorThrown) {
				if (jqXHR.status == 500) {
					deferred.reject(jqXHR, textStatus, errorThrown);
				}
				if (root) $(".treeview-loading").addClass("hidden");
				deferred.reject(jqXHR, textStatus, "Error while loading files.");
			}
		});
		return deferred.promise();
	}
	function getParentFolder(node) {
		var $parent = $("#sites_browser .treeview");
		if (typeof node.parent !== "undefined" && typeof node.parent.relativePath !== "undefined") {
			$parent = $("input[id='" + node.parent.relativePath + "']~.sub", $parent);
		}
		if ($parent.length === 0) { $parent = $("#sites_browser .treeview"); }
		return $parent;
	}
	function renderFolder(node) {
		if (typeof node === "undefined") { return; }
		
		//var parent = (typeof parentPath === "undefined" ? {} : $('~label>a', 'input[id="' + parentPath + '"]').data("attributes"));
		var attributes = $.extend({},
			node,
			{
				fileInfo: {
					fileID  : node.id,
					fileName: node.name,

		var $compsTree = $("#sites_browser .treeview");

	function populateTreeBranch(nodes, relativePath) {
		var $compsTree = $("#sites_browser .treeview");
		
		if ((typeof nodes === "undefined") ||
			($.isArray(nodes) && nodes.length === 0) ||
			(typeof nodes === "object" && Object.keys(nodes).length === 0)) {
			
			$("input[id='" + relativePath + "']~div.sub", $compsTree).removeClass("loading");
			return;
		}
		
		var parentFolder = (typeof relativePath === "undefined" ? "" : relativePath);
		if (parentFolder === "") {
			// Sites => render as folders
			$compsTree.html("");
			$.each(nodes, function () {
				var site = this;
				site.relativePath = site.name + ":" + site.id;
				site.type = "site";
				renderFolder(site);
				
				// Continue with produt types
				populateTreeBranch(site.products, site.relativePath);
			});
		} else if (parentFolder.indexOf(":") >= 0 && parentFolder.indexOf(":") == parentFolder.lastIndexOf(":")) {
			// Product Types => render as folders
			$.each(nodes, function (typeIdx, productTypes) {
				var productType = {
					id          : parseInt(typeIdx.substr(typeIdx.indexOf(":") + 1)),
					name        : typeIdx.substr(0, typeIdx.indexOf(":")),
					type        : "product type",
					relativePath: parentFolder + "/" + typeIdx,
					parent      : $('~label>a', 'input[id="' + parentFolder + '"]').data("attributes"),
					site        : $('input[id="' + parentFolder + '"]').closest("div.site").find(">label>a").data("attributes")
				};
				renderFolder(productType);
				
				// Continue with produts
				populateTreeBranch(productTypes, parentFolder);
			});
		} else {
			// Products => render as files
			$.each(nodes, function (index, file) {
				var size = parseInt(file.size);
				if (size < 1024) {
					size = size + " B";
				} else if (size < 1024*1024) {
					size = parseFloat(size / 1024, 2).toFixed(2) + " KB";
				} else if (size < 1024*1024*1024) {
					size = parseFloat(size / 1024 / 1024, 2).toFixed(2) + " MB";
				} else if (size < 1024*1024*1024*1024) {
					size = parseFloat(size / 1024 / 1024 / 1024, 2).toFixed(2) + " GB";
				} else {
					size = parseFloat(size / 1024 / 1024 / 1024 / 1024, 2).toFixed(2) + " TB";
				}
				
				var attributes = $.extend({},
					file,
					{
						fileInfo: {
							fileID  : file.name, 
							fileName: file.name,
							fileSize: size,
							fileType: (file.path && file.name.indexOf(file.path) < 0) ? "vector" : "product",
							uri	    : file.path
						},
						geometry    : file.footprint,
						size        : size,
						parent      : $('~label>a', 'input[id="' + parentFolder + '"]').data("attributes"),
						site        : $('input[id="' + parentFolder + '"]').closest("div.site").find(">label>a").data("attributes")
					}
				);
				delete attributes.footprint;
				
				var fafile = "fa-cube";
				var $element = $('<a href="#" title="' + attributes.name + '"' + ((attributes.path || attributes.type === ".tile") ? '' : ' class="unavailable"') + '><span class="fa ' + fafile + '"></span>' + attributes.name + '</a>');
				$element.data("attributes", attributes);
				
				var $folder = getParentFolder(attributes);
				if (!$element.hasClass("unavailable") && $(".unavailable", $folder).length > 0) {
					$element.insertBefore($(".unavailable", $folder).get(0));
				} else {
					$folder.append($element);
				}
				$folder.removeClass("empty loading");
			});
		}
		
		// Adjust folder indentation
		$(".select-for", $compsTree).closest(".sub").addClass("has-selectable-for");
	}

	function displayPreviewOnMap(attributes) {
		if (!myPolygonMap.mapActive) {
			return;
		}
		cleanMap("Raster");
		
		var _map = myPolygonMap;
		if (typeof attributes === "undefined") {
			attributes = {
				previewImage: { width: 260, height: 280, base64: "assets/dist/img/missing.jpg" }
			};
		} else {
			_map.createShapeFromGeometry(attributes.geometry, { description: "preview" });
			_map.setFeaturesStyleByProperty({ "description": "preview" }, _map.styleDefaultRO);
			_map.fitAllFeatures();
		}
		var features = _map.getAllFeatures("preview").getArray();
		if (features.length > 0 && features[0].getGeometry().getArea() > 0) {
			proj4.defs("EPSG:32632", "+proj=utm +zone=33 +datum=WGS84 +units=m +no_defs");
			proj4.defs("EPSG:32633", "+proj=utm +zone=34 +datum=WGS84 +units=m +no_defs");
			proj4.defs("EPSG:3035" , "+proj=laea +lat_0=52 +lon_0=10 +x_0=4321000 +y_0=3210000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");
			proj4.defs("EPSG:28992", "+proj=sterea +lat_0=52.15616055555555 +lon_0=5.38763888888889 +k=0.9999079 +x_0=155000 +y_0=463000 +ellps=bessel +towgs84=565.417,50.3319,465.552,-0.398957,0.343988,-1.8774,4.0725 +units=m +no_defs");
			ol.proj.proj4.register(proj4);
			
			var mapDefaultProjection = "EPSG:3857";
			var imgProjection = mapDefaultProjection;
			// TODO: remove hardcoded values
			if (attributes.name.indexOf("_L2A_") > 0) {
				imgProjection = "EPSG:3035";
			} else if (attributes.name.indexOf("_L3B_") > 0) {
				switch (attributes.site) {
					case 'Lithuania': imgProjection = "EPSG:32633"; break;
					default:          imgProjection = "EPSG:32632"; break;
				}
			} else if (attributes.name.indexOf("_L3B_") > 0) {
				imgProjection = "EPSG:32632";
			}
			
			var feature = features[0];
			var extent = feature.clone().getGeometry().transform(mapDefaultProjection, imgProjection).getExtent();
			var geoImg = new ol.layer.Image({
				name       : "Raster",
				opacity    : window.imageLayerOpacity,
				source: new ol.source.ImageStatic({
					url: attributes.previewImage.base64,
					projection: imgProjection,
					imageExtent: extent
				})
			});
			_map.map.addLayer(geoImg);
			_map.refreshLayerOpacity();
		}
	}
	function populateTableWithAttributes($table, attributes, extra) {
		var readAttributes = $.extend({}, attributes, extra);
		$.each(readAttributes, function (name, value) {
			if (typeof value === "string") {
				$("tbody", $table).append('<tr><td>' + name + '</td><td>' + (value ? value.replace(/[\r\n\x0B\x0C\u0085\u2028\u2029]+/g, "<br/>") : "") + '</td></tr>');
			} else if (typeof value === "number") {
				$("tbody", $table).append('<tr><td>' + name + '</td><td>' + value + '</td></tr>');
			} else if (typeof value === "boolean") {
				$("tbody", $table).append('<tr><td>' + name + '</td><td>' + (value ? "&#10003;" : "&#10007;") + '</td></tr>');
			}
		});
		if ($("tbody tr", $table).length === 0) {
			$("tbody", $table).append('<tr class="empty"><td>-</td><td>-</td></tr>');
		}
	}

	// === RASTER SECTION ================================================================== //
	function displayRasterOnMap(attributes) {
		if (!myPolygonMap.mapActive) {
			return;
		}
		cleanMap("Raster");
		
		var _map = myPolygonMap;
		if (typeof attributes !== "undefined") {
			_map.createShapeFromGeometry(attributes.geometry, { description: "preview" });
			_map.setFeaturesStyleByProperty({ "description": "preview" }, _map.styleDefaultRO);
			_map.fitAllFeatures();
		}
		var features = _map.getAllFeatures("preview").getArray();
		if (features.length > 0 && features[0].getGeometry().getArea() > 0) {
			var rasterTile = new ol.layer.Tile({
				name: "Raster",
				source: new ol.source.XYZ({					
					url: baseApiUrl + "products/view/tile/?name="+attributes.name+"&z={z}&x={x}&y={-y}",
					tileLoadFunction:function(tile, src) {
						var xhr = new XMLHttpRequest();
						xhr.responseType = 'blob';
						xhr.addEventListener('loadend', function (evt) {
							var data = this.response;
							if (data !== undefined) {
								tile.getImage().src = URL.createObjectURL(data);
							} else {
								tile.setState(TileState.ERROR);
							}
						});
						xhr.addEventListener('error', function () {
							tile.setState(TileState.ERROR);
						});
						xhr.open('GET', src);
						xhr.setRequestHeader("X-Auth-Token", window.tokenKey);						
						xhr.send();
					}
				}),
				extent: features[0].getGeometry().getExtent()
			});	
			
			_map.map.addLayer(rasterTile);
			_map.refreshLayerOpacity();
		}
	}

		// Populate attributes table
		var $table = $(".attributes-holder table", "#properties");
		populateTableWithAttributes($table, attributes);
		
		// Draw raster
		displayRasterOnMap(attributes);
		
		// Show Properties window with attributes section visible
		$("#properties .attributes-holder").removeClass("hidden");
	}

	function showProperties(attributes) {
		// Skip
		if (typeof attributes.fileInfo === "undefined") {
			return;
		}
		
		// Reset
		resetProperties(typeof attributes.extra === "undefined");
		
		// Title
		$("#properties").dialog("updateDashTitle", attributes.fileInfo.fileName);
		
		// Content for different type of products
		if (attributes.fileInfo.fileType === "folder") {
			// Site
			$("#properties").addClass("folder");
			showFolderProperties(attributes);
		} else if (attributes.path) {
			/* // Preview
			$("#properties").addClass("file");
			showPreviewProperties(attributes);
		} else if (attributes.path === null) { */
			// Raster
			$("#properties").addClass("file");
			showRasterProperties(attributes);
		} else {
			// Content unavailable
			$("#properties").addClass("unavailable");
		}
		
		// Actions
		displayActions(attributes);
		
		// Show Properties section
		if (attributes.fileInfo.fileType !== "folder") {
			showPropertiesWindow();
		}
		
		// Data
		$("#properties").data("attributes", attributes);
	}

	function responseFilter(data, filter) {

			if (!$.isArray(filter.sites) || $.inArray(this.id + "", filter.sites) >= 0) {
				fData.push(site);
			}
		});
		$.each(fData, function (index, site) {
			if ($.isArray(filter.productTypes) && filter.productTypes.length > 0) {
				$.each(site.products, function (typeIdx, productTypes) {
					var typeId = typeIdx.substr(typeIdx.indexOf(":") + 1);
					if ($.inArray(typeId, filter.productTypes) < 0) {

			filter.interval = [ start_date, end_date ];
    	}
		$.when(refreshTree(void(0), filter)).done(function(){
			
		});
	});
	$("#search_filters").on("change", "#siteName", function () {
		var selectedSites = $(this).val();
		if (selectedSites === null) {
			// Disable ALL range filters (tiles, season)
			$("#optseason,#choose_season,input[name='tiles']", "#range_filters").prop({ "disabled": true });
			// Clear season checkbox
			$("#optseason", "#range_filters").prop({ "checked" : false });
			// Reset season filter: hide all season options and set value to empty
			$("#choose_season option:not([value=''])", "#range_filters").addClass("hidden");
			$("#choose_season", "#range_filters").val("");
		} else {
			// Enable tiles filtes
			$("#optseason,input[name='tiles']", "#range_filters").prop({ "disabled": false });
			
			// Activate/deactivate seasons according to selected sites
			$("#choose_season option:not([value=''])", "#range_filters").addClass("hidden");
			$.each(selectedSites, function (index, siteId) {
				$("#choose_season option[data-siteid='" + siteId + "']", "#range_filters").removeClass("hidden");
			});
			 // Reset season when its parrent site is no longer selected
			var season = $("#choose_season", "#range_filters").val();
			if ($("#choose_season option[value='" + season + "']", "#range_filters").hasClass("hidden")) {
				$("#choose_season", "#range_filters").val("");
			}
		}
	});
	$("#search_filters").on("change", ".searchInterval input[type='checkbox']", function () {
		if ($(this).is(':checked')) {
			// disable ALL form controls from FilterBy section
			$(this).closest(".searchInterval").find(".form-control").prop("disabled", true);
			// only enable form controls for the selected filter
			$(this).closest(".checkboxGroup").find(".form-control").prop("disabled", false);
			// disable all other filters from FilterBy section
			$(this).closest(".checkboxGroup").siblings().find("input[type='checkbox']").prop("checked", false);
		} else {
			// only disable form controls for the selected filter
			$(this).closest(".checkboxGroup").find(".form-control").prop("disabled", true);
		}
	});
	
	// === MAP SECTION ========================================================================== //
	function cleanMap(layerName) {
		var _map = myPolygonMap;
		_map.removeAllFeatures("preview");
		if (typeof layerName === "undefined") {
			$(".drawer-content .slidercontainer:not(:has([data-name='Map'],[data-name='Features']))", "#mapExtent").remove();
			
			var layersToRemove = [];
			_map.map.getLayers().forEach(function (layer) {
				if (typeof layer !== "undefined" && layer.get("name") != "Map" && layer.get("name") != "Features") {
					layersToRemove.push(layer);
				}
			});
			for (var i = 0; i < layersToRemove.length; i++) {
				_map.map.removeLayer(layersToRemove[i]);
			}
		} else {
			$(".drawer-content .slidercontainer:has([data-name='" + layerName + "'])", "#mapExtent").remove();
			
			var layersToRemove = [];
			_map.map.getLayers().forEach(function (layer) {
				if (typeof layer !== "undefined" && layer.get("name") == layerName) {
					layersToRemove.push(layer);
				}
			});
			for (var i = 0; i < layersToRemove.length; i++) {
				_map.map.removeLayer(layersToRemove[i]);
			}
		}
	}
	function handlePolygonMapEvents() {
		var _map = myPolygonMap;
		_map.el.on("layerOpacityChange", function (evt, layer) { //function (evt, layer, modifier) {
			evt.stopPropagation();
			if (layer) {
				if (layer.get("name") == "Raster") {
					window.imageLayerOpacity = layer.getOpacity();
				}
			}
		});
	}
	function getMapPanPercentage() {
		var $dialog = $("#sites_browser").closest(".ui-dialog");
		if ($("#map").length > 0) {
			if ($dialog.hasClass("minimized")) {
				return 0;
			} else {
				return parseInt(($dialog.outerWidth() + $dialog.offset().left + 5)/$("#map").innerWidth()*10000)/100;
			}
		} else {
			return parseInt(($dialog.outerWidth() + $dialog.offset().left + 5)/$(window).innerWidth()*10000)/100;
		}
	}
	function setMapSize() {
		var h = 400;
		if ($("#header").length > 0 && $("#bar").length > 0 && $("#footer").length > 0) {
			h = $(window).height() - $("#header")[0].offsetHeight - $("#bar")[0].offsetHeight - $("#footer")[0].offsetHeight;
		}
		$("#mapExtent").css({ "height": h + "px" });
		if (typeof myPolygonMap !== "undefined" && myPolygonMap.mapActive) {
			var _map = myPolygonMap;
			var pan = getMapPanPercentage();
			_map.setPanPercentage(pan);
		}
	}
	$(window).on("ready resize", function() {
		setMapSize();
	});
	
	// === GLOBAL EVENTS SECTION ========================================================================== //
	$(".dialogs .panel-heading .panel-control").on("click", function () {
		var $panel = $(this).closest(".panel");
		if ($(this).filter(".min,.max").length > 0) {
			$panel.toggleClass("minimized");
		} else if ($(this).filter(".close").length > 0) {
			$panel.addClass("hidden");
		} else if ($(this).filter(".filter").length > 0) {
			if ($("#search_filters").dialog("isOpen")) {
				hideFiltersWindow();
			} else {
				showFiltersWindow();
			}
			
		} else if ($(this).filter(".filter-reset").length > 0) {
			resetFilters();
		}
	});
	// === START ====================================================================================== //
	defineFormDialogs();
	// Define click event action on dialog header button right after dialogs are created
	
	setMapSize();
	
	window.imageLayerOpacity = 0.8;
	window.myPolygonMap = { mapActive: false };
	// Initialize map and query
	var pan = getMapPanPercentage();
	var olPoly = $("#mapExtent").poly2D({ startLat: 47, startLon: 14, zoom: 5, maxFeaturesNo: 5, extraFeatureDescription: "preview", panPrc: pan });
	$.when(olPoly)
	.done(function (result) {
		if (typeof result.readOnly === "boolean") {
			$(".extent", "#myModalNodes").removeClass("no-map");
			$("#mapExtent").removeClass("hidden");
			myPolygonMap = result;
			if (myPolygonMap.mapActive) {
				window.defaultMapZoom = myPolygonMap.map.getView().getZoom();
				handlePolygonMapEvents();
				myPolygonMap.setReadOnly(true);
			}
		}
		// Initialize query functionality after map is loaded
	})
	// Initialize query functionality without map
	.fail(function () { });
	
	// Get tree
	resetFilters();
});
	
//# sourceURL=products.js
</script>
