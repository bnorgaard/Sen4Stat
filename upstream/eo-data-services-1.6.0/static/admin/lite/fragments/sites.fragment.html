											 
<div class="panel panel-resources">
	<div class="panel-heading">
		<h2 class="panel-title">Site manager</h2>
	</div>
	<div class="panel-body">
		<input type="button" name="addsite" class="add-edit-btn vspace" value="Create new site">

			<div class="panel bevel" style="border:1px solid lightgray">
				<div id="div_addsite" style="display:none">
					<!-- form add site -->

						<input type="hidden" name="userId" />

							<label class="control-label col-md-4">Site shape file:</label>

							</div>

							<label class="control-label col-md-12">Enabled sensors:</label>

						<div class="form-group form-group-sm row">
							<label class="control-label col-md-12">List of seasons:</label>

						<div class="form-group form-group-sm row">

								<input type="checkbox" name="edit_enabled" id="edit_enabled">
							</div>

						<div class="form-group form-group-sm row">
							<div class="col-md-12 error hidden">
							</div>

						<div class="submit-buttons" style="text-align:right">

						</div>
					</form>
				</div>
				<div id="div_deletesite" style="display:none">
					<!--  form delete site -->
		   
		  
								
					<form id="siteform_delete" method="delete" class="tspace vspace">
						<input type="hidden" class="form-control" name="siteId" value="">
						<input type="hidden" class="form-control" name="siteShortName" value="">
		  
		  
		
																			
																	  
											  
					 
							
						<div class="form-group row">
							<h3 class="control-label col-md-12" id="delete_sitename">Site name:</h3>
																											 
																													
						</div>
						<div class="form-group form-group-sm row">
		  
					 
							
							  
							<label class="control-label col-md-12">Select which products types to be deleted along with the site:</label>
							<div class="col-md-12">
								<div class="col-md-1"></div>
								<div class="col-md-11 loading" id="product_types">
									<img src="assets/dist/img/loader.gif" width="64px" height="64px">
								</div>
							</div>
						</div>
						<div class="form-group form-group-sm row">
							<div class="col-md-12 error hidden">
							</div>
						</div>
						<div class="submit-buttons">
							<input class="add-edit-btn delete-btn left-btn" type="submit" value="Confirm Delete Site" style="float:left" />
							<input class="add-edit-btn cancel-btn" type="button" value="Abort" />
						</div>
					</form>
				</div>
				<div id="div_uploadfiles" style="display:none">
					<!--  form upload files -->
					<div class="form-group form-group-sm row">
						<h3 class="control-label col-md-12" id="upload_sitename">Site name:</h3>
					</div>
		  
					<div class="form-group form-group-sm row tspace vspace">
						<div class="unique-by-year hidden">
							<label class="control-label col-md-4">Configuration year:</label>
							<div class="col-md-8">
								<input type="text" class="form-control" id="upload_year" name="upload_year" value="" style="width:120px;float:left">
								<input type="button" class="add-edit-btn upload-btn small-btn lspace" name="change_upload_year" value="Change year">

						<div class="unique-by-season hidden">

							<div class="col-md-8">
								<h4 id="upload_season_name" style="margin:0 0 5px 0"></h4>
							</div>
						</div>
					</div>
		  
					<div class="container-fluid">
						<div id="upload_html_page"></div>
						<div class="panel-group config" id="accordion"></div>
		  
		  
		
																			
						<div class="submit-buttons" style="margin:10px 0">
							<input class="add-edit-btn cancel-btn" type="button" value="Close" />
						</div>
							 
																		   
																											
					</div>
				</div>
				<!-- list of sites -->
				<div class="panel">
					<div class="panel-heading"><h3 class="panel-title">Sites list</h3></div>
					<div class="panel-body">
						<table id="sites" class="table table-striped">
							<thead>
								<tr>
									<th rowspan="2">Site name</th>
									<th rowspan="2">Short name</th>
									<th class="seasons">Seasons</th>
									<th rowspan="2" style="text-align:center">Edit</th>
									<th rowspan="2">Enabled</th>
								</tr>
								<tr>
									<th>
										<table class="subtable"><thead><tr><th>Season name</th><th>Season start</th><th>Season mid</th><th>Season end</th><th>Enabled</th></tr></thead><tbody></tbody></table>
									</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
																			   
														 
														   
																																		  
																															   
		  
		 
		</div>
		<hr/>
												
		  
		
	</div>
</div>
<div class="error-notification">
	<div class="error main hidden">
								 
		 
		
		 
																																								   
		  
		 
		   
				  
		  
																				 
	</div>
</div>

<link  href="assets/libs/bootstrap-switch/3.3.2/bootstrap-switch.min.css" rel="stylesheet" type="text/css" />
<script src="assets/libs/bootstrap-switch/3.3.2/bootstrap-switch.min.js"></script>

<!-- includes for validate form -->

<script type="text/javascript">
// ======================== PUBLIC SITES FUNCTIONS ======================== //
function purgeAllSitesDialogs() {
	purgeUiDialog("div_addsite");
	purgeUiDialog("div_editsite");
	purgeUiDialog("div_deletesite");
	purgeUiDialog("div_uploadfiles");
}
// ======================== DOCUMENT READY ======================== //
$(document).ready(function () {
	var getSites = function (userId) {
		return $.ajax({
			cache: false,
			url  : baseApiUrl + "sites/" + (userId ? "?userId=" + userId : ""),
			type : "GET"
		});
	};
	var getSite = function (siteId) {
		return $.ajax({
			cache: false,
			url  : baseApiUrl + "sites/" + siteId,
			type : 'GET',
		});
	};
	var getSiteSeasons = function (siteId) {
		return $.ajax({
			cache: false,
			url  : baseApiUrl + "sites/seasons?site=" + siteId,
			type : 'GET'
		});
	};
	var getProductTypes = function (userId) { // TODO implementation for userId
		return $.ajax({
			cache: false,
			url  : baseApiUrl + "products/types/",
			headers: { "content-type": "application/json" },
			type : 'GET'
		});
	};
	function getSiteSeasonsHtml(seasons, $parent) {
		$parent.html("");
		var $container = (seasons.length == 0) ? $("<span>-</span>") : $('<table class="subtable"></table>');
		$.each(seasons, function(index, season) {
			// Create a table line for each site in list
			var tr = '<tr class="season" data-id="' + season.id + '">' +
						'<td>' + season.name + '</td>' +
						'<td>' + season.startDate + '</td>' +
						'<td>' + season.midDate + '</td>' +
						'<td>' + season.endDate + '</td>' +
						'<td><input type="checkbox" class="season-enabled"></td>' +
					'</tr>';
			var $tr = $(tr);
			$('input.season-enabled', $tr)
			.prop("checked", season.enabled)
			.bootstrapSwitch({
				size       : "mini",
				onColor    : "success",
				offColor   : "default",
				disabled   : true,
				handleWidth: 25
			});
			$container.append($tr);
		});
		$parent.append($container);
	}
	function getSitesHtml(sites, $parent) {
		hidePanelError(".error-notification");
		
		$parent.html("");
		$.each(sites, function(index, site) {
			// Create a line for each site in the list
			var tr = '<tr class="site" data-id="' + site.id + '">' +
						'<td>' + site.name + '</td>' +
						'<td>' + site.shortName + '</td>' +
						'<td class="seasons"></td>' +
						'<td><a class="site-edit">Edit</a></td>' +
						'<td><input type="checkbox" class="site-enabled"></td>' +
					'</tr>';
			var $tr = $(tr);
			$('input.site-enabled', $tr)
			.prop("checked", site.enabled)
			.bootstrapSwitch({
				size       : "mini",
				onColor    : "success",
				offColor   : "default",
				disabled   : true,
				handleWidth: 25
			});
			
			// Change row style when starting site editing
			$('a.site-edit', $tr)
			.on("click", function (e) {
				$("tr.site", $parent).removeClass("editing");
				$tr.addClass("editing");
				openEditSiteDialog(site.id);
			});
			
			// Get site seasons
			$.when(getSiteSeasons(site.id))
			.done(function (response) {
				if (response.status === responseStatus.success) {
					getSiteSeasonsHtml(response.data, $("td.seasons", $tr));
				} else {
					showPanelError(".error-notification", response.message, true);
				}
			})
			.fail(function (jqXHR, textStatus, errorThrown) {
				showPanelError(".error-notification", jqXHR.responseText, true);
			});
			$tr.data("dna", site);
			$parent.append($tr);
		});
	}
	function refreshSiteHtml(siteId, $parent) {
		hidePanelError(".error-notification");
		
		var $tr = $('tr[data-id="' + siteId + '"]', $parent);
		if ($tr.length > 0) {
			$.when(getSite(siteId), getSiteSeasons(siteId))
			.done(function (responseSite, responseSeasons) {
				var site    = responseSite[0];
				var seasons = responseSeasons[0];
				if (site.status === responseStatus.success && seasons.status === responseStatus.success) {
					// Update site data
					$tr.data("dna", site.data);
					
					// Refresh site
					$('input.site-enabled', $tr)
					.prop("checked", site.data.enabled)
					.bootstrapSwitch('destroy', true)
					.bootstrapSwitch({ size: "mini",onColor: "success", offColor: "default", disabled: true, handleWidth: 25 });
					
					// Refresh seasons list
					getSiteSeasonsHtml(seasons.data, $("td.seasons", $tr));
				} else {
					var msg  = (site.status   === responseStatus.success ? "" : site.message);
						msg += (seasons.status === responseStatus.success ? "" : (msg == "" ? "" : "<br>") + seasons.message);
					showPanelError(".error-notification", msg);
				}
			})
			.fail(function (jqXHR, textStatus, errorThrown) {
				showPanelError(".error-notification", jqXHR.responseText);
			});
		}
	}
	function getProductTypesHtml(productTypes, $parent) {
		$parent.html("");
		$.each(productTypes, function(index, ptype) {
			// Create a table line for each site in list
			var pt = '<div class="row product-type">' +
						'<label class="control-label col-md-4" for="delete_chk' + ptype.shortName + '">' +
							'<input id="delete_chk' + ptype.shortName + '" type="checkbox" name="delete_chk' + ptype.shortName + '" value="' + ptype.id + '" />' + ptype.shortName +
						'</label>' +
						'<div class="col-md-8">' +
							 '<span>' + ptype.description + '</span>' +
						 '</div>' +
					 '</div>';
			var $pt = $(pt);
			$parent.append($pt);
		});
		refreshDialogPosition($parent.closest(".ui-dialog-content"));
	}
	function openAddNewSiteDialog() {
		// open add site dialog and close all others
		$(".ui-dialog-content:not(#div_addsite)").dialog("close");
		$("#div_addsite").dialog("open");
			  
					   
			 
			  
					
							   
							   
								
													  
						   
	}
	function openEditSiteDialog(siteId) {
		var site = $("tr.site[data-id=" + siteId + "]", "#sites").data("dna");
		$("#edit_sitename").html(site.name);
		$("#edit_siteid").val(site.id);
		$("#shortname").val(site.shortName);
		$("#edit_enabled").bootstrapSwitch('state', site.enabled);
		
		// set editing variables
		$("#div_editsite").data("dna", site);
		
		// Get site tiles
																
 
											
										 
 
																				   
													  
											  
									 
		

							   
															  

					 
								  
				
			   
														 
			  
	
 
										
				
			   
										 
			  
	
 
										 
		$.ajax({
			cache: false,
			url  : "fragments/site.tiles.fragment.html",
												  
			  
	
 
											   
				  
																									  
										  
											  
															  
									 
										  
										
										
			type : "GET",
			dataType: "html",
			success: function(data) {
				$("#site_tiles", "#div_editsite").removeClass("loading").html(data);
			},
			error: function (jqXHR, textStatus, errorThrown) {
				console.log("Status: " + textStatus + "   Error: " + errorThrown);
			}
						  
					 
				  
	 
						 
	 
							
 
									   
									  
											
														  
								   
										
								  
															
															  
			
				  
							  
								
					
					   
						  
						  
					 
				  
		});
		
		// Get site seasons
		$.ajax({
			cache: false,
			url  : "fragments/site.seasons.fragment.html",
			type : "GET",
			dataType: "html",
			success: function(data) {
				$("#site_seasons", "#div_editsite").removeClass("loading").html(data);
			},
			error: function (jqXHR, textStatus, errorThrown) {
				console.log("Status: " + textStatus + "   Error: " + errorThrown);
			}
		});
		
		// Get uploaded files
		$.ajax({
			cache: false,
			url  : "fragments/site.uploads.fragment.html",
			type : "GET",
			dataType: "html",
			success: function(data) {
				$("#upload_html_page", "#div_uploadfiles").html(data);
			},
			error: function (jqXHR, textStatus, errorThrown) {
				console.log("Status: " + textStatus + "   Error: " + errorThrown);
			}
		});
		
					  
	
 
													 
				  
											  
											  
											 
																					   
																																							  
				 
							   
												 
				
			  
				  
					  
	 
 
								 
						 
									 
 
											 
														   
								  
 
									 
																  
									
								
									 
														   
 
						 
									  
 
				  
		 
			   
											  
			   
				   
						   
												
	
													
																	 
   
	
 
					
		 
			   
												
			   
				   
						   
												  
	
													
																	 
   
	
 
					  
		 
			   
												
			   
				   
						   
							  
	
													
																	 
   
	
 
		$("#accordion").collapse('hide');
		$("#accordion").on("hidden.bs.collapse shown.bs.collapse", function (e) {
			$(this).closest(".ui-dialog").position({
				my: "center",
				at: "center",
				of: "#div_editsite",
				collision: "fit",
				// Ensure the titlebar is always visible
				using: function (pos) {
					var topOffset = $(this).css(pos).offset().top;
					if (topOffset < 0) {
						$(this).css("top", pos.top - topOffset);
					}
				}
			});
		});
		
		// open edit site dialog and close all others
		$(".ui-dialog-content:not(#div_editsite)").dialog("close");
		$("#div_editsite").dialog("open");
	}
	function openDeleteSiteDialog() {
		var form = $("#siteform_delete").get(0);
		hidePanelError(form);
		
		var site = $("#div_editsite").data("dna");
		$('input[name="siteId"]'       , "#div_deletesite").val(site.id);
		$('input[name="siteShortName"]', "#div_deletesite").val(site.shortName);
		$('#delete_sitename'           , "#div_deletesite").html(site.name);
		$("label"                      , "#div_deletesite").removeClass("selected");
		
		// Get product types (needed when deleting site along with products of a certain type)
		$.when(getProductTypes())
		.done(function (response) {
			if (response.status === responseStatus.success) {
				$("div#product_types").removeClass("loading");
				getProductTypesHtml(response.data, $("div#product_types"));
			} else {
				showPanelError(form, response.message);
			}
		})
		.fail(function (jqXHR, textStatus, errorThrown) {
			showPanelError(form, jqXHR.responseText);
		});
		
		// open delete dialog
											  
															
								   
 
								 
										   
 
						 
										
 
									  
												  
 
											 
		$("#div_deletesite").dialog("open");
	}
	function changeUploadYear(uploadYear) {
		openUploadSiteFilesDialog({ 'uniqueBy': 'Year', 'uniqueData': uploadYear });
	}
	function changeUploadSeason(seasonData) {
		openUploadSiteFilesDialog({ 'uniqueBy': 'Season', 'uniqueData': seasonData });
 
									  
 
											 
									  
 
								  
						   
									
								   
									 
										  
									   
										   
										
	}
 
	function openUploadSiteFilesDialog(descriptor) {
		var site = $("#div_editsite").data("dna");
		$(".unique-by-year"  , "#div_uploadfiles").addClass("hidden");
		$(".unique-by-season", "#div_uploadfiles").addClass("hidden");
		if (descriptor && descriptor.uniqueBy == "Year") {
			$(".unique-by-year", "#div_uploadfiles").removeClass("hidden");
			if (typeof getUploadDescriptorsByYear !== "undefined" && typeof getUploadSiteFiles !== "undefined") {
				$("#upload_sitename", "#div_uploadfiles").html(site.name);
				$("#upload_year"    , "#div_uploadfiles").val(descriptor.uniqueData);
				closeDialog($("#div_uploadfiles"));
				$.when(getUploadDescriptorsByYear(site.id, descriptor.uniqueData))
				.done(function (response) {
					if (response.status === responseStatus.success) {
						getUploadSiteFiles(response.data);
						// open add site dialog and close all others
						$("#div_uploadfiles").dialog("open");
					}
				});
			}
		} else {
			$(".unique-by-season", "#div_uploadfiles").removeClass("hidden");
			if (typeof getUploadDescriptorsBySeason !== "undefined" && typeof getUploadSiteFiles !== "undefined") {
				$("#upload_sitename"   , "#div_uploadfiles").html(site.name);
				$("#upload_season_name", "#div_uploadfiles").html(descriptor.uniqueData.name + " [" + descriptor.uniqueData.startDate + " &raquo; " + descriptor.uniqueData.endDate + " ]");
				closeDialog($("#div_uploadfiles"));
				$.when(getUploadDescriptorsBySeason(site.id, descriptor.uniqueData.id))
				.done(function (response) {
					if (response.status === responseStatus.success) {
						getUploadSiteFiles(response.data);
						// open add site dialog and close all others
						$("#div_uploadfiles").dialog("open");
					}
				});
			}
		  
													
								 
		}
	   
	}
	function refreshAllSites() {
		hidePanelError(".error-notification");
		// Get sites
		$.when(getSites(window.userIsAdmin ? void 0 : window.userID))
						 
 
										
									 
															   
														
		 
			   
																						 
				
		.done(function (response) {
			if (response.status === responseStatus.success) {
				getSitesHtml(response.data, $("table#sites>tbody"));
					   
				   
			} else {
				showPanelError(".error-notification", response.message);
			}
		})
		.fail(function (jqXHR, textStatus, errorThrown) {
			showPanelError(".error-notification", jqXHR.responseText);
   
		});
	}
	function saveNewSite(form) {
		hidePanelError(form);
		$.ajax({
			async      : true,
			url        : base baseApiUrl + "sites/",
			method     : "POST",
			processData: false,
			contentType: false,
			mimeType   : "multipart/form-data",
			data       : new FormData(form),
			success: function (JSONresponse) {
				var response = JSON.parse(JSONresponse);
				if (response.status === responseStatus.success) {
					refreshAllSites();
					closeDialog(form);
				} else {
					showPanelError(form, response.message);
				}
			},
			error: function (jqXHR, textStatus, errorThrown) {
				showPanelError(form, jqXHR);
			}
		});
	}
	function updateSite(form) {
		hidePanelError(form);
		
		var $dialog = $("#div_editsite");
		
		// Set site status (enables / disabled)
		var siteId = (typeof $dialog.data("dna") === "undefined") ? void 0 : $dialog.data("dna").id;
		var siteEnabled = $("#edit_enabled").bootstrapSwitch('state');
		$.ajax({
			cache: false,
			url: baseApiUrl + "sites/status?siteId=" + siteId + "&enabled=" + (siteEnabled ? "true" : "false"),
			method: "GET",
			success: function (response) {
				if (response.status === responseStatus.success) {
					// Update site tiles if site status has been correctly set
					if (typeof updateSiteTiles === "function") {
						$.when(updateSiteTiles($dialog))
							 
								  
									
									   
						
						   
							  
							  
						 
					  
		 
	  
							 
									 
						.done(function (response) {
							if (response.status === responseStatus.success) {
								closeDialog(form);
							} else {
								showPanelError(form, response.message);
							}
						})
						.fail(function (jqXHR, textStatus, errorThrown) {
							showPanelError(form, jqXHR);
						});
						 
							
					}
	   
				} else {
					showPanelError(form, response.message);
				}
			},
			error: function (jqXHR, textStatus, errorThrown) {
				showPanelError(form, jqXHR);
			}
	
													
															 
   
		});
 
							 
													 
																	   
	}
 

						 
	function deleteSite(form) {
		hidePanelError(form);
		
		var pTypes = new Array();
		$.each($("#product_types input[type='checkbox']:checked", form), function () { pTypes.push(this.value); });
		var postData = JSON.stringify({
			siteId        : $('input[name="siteId"]'       , form).val(),
			siteShortName : $('input[name="siteShortName"]', form).val(),
			userId        : window.userID,
			productTypeIds: pTypes
		});
		$.ajax({
			url: baseApiUrl + "sites/",
			type: "DELETE",
							
					 
				 
				  
			  
				   
																		  
	
									  
							  
					   
				 
			processData: false,
			data: postData,
			headers: {
				"content-type": "application/json",
			},
			success: function (response) {
				if (response.status === responseStatus.success) {
					refreshAllSites();
					closeDialog(form);
					closeDialog($("#siteform_edit").get(0));
				} else {
					showPanelError(form, response.message);
				}
			},
			error: function (jqXHR, textStatus, errorThrown) {
				showPanelError(form, jqXHR);
														   
											
				
					 
					 
	
															
											 
				
					 
					  
										  
												  
										   
			}
   
		});
	}
	
	// ======================== Dialog Ui Functions ======================== //
	function defineFormDialogs() {
		// clear all previous dialogs
		purgeAllSitesDialogs();
		
		// create dialog for add site form
		$("#div_addsite").dialog({
			title: "Add New Site",
			width: '560px',
			autoOpen: false,
			modal: true,
			resizable: false,
			beforeClose: function (event, ui) { resetFormDialog($("form", this)); },
		}).on("click", ".cancel-btn", function (e) {
			e.preventDefault();
			closeDialog(this);
		});
		
		// create dialog for edit site form
		$("#div_editsite").dialog({
			title: "Edit Site",
			width: '800px',
			autoOpen: false,
			modal: true,
			resizable: false,
			beforeClose: function (event, ui) { resetFormDialog($("form", this)); }
		}).on("click", ".cancel-btn", function (e) {
			e.preventDefault();
			closeDialog(this);
		});;
		// create dialog for delete site form
		$("#div_deletesite").dialog({
			title: "Delete Site",
			width: '700px',
			autoOpen: false,
			modal: true,
			resizable: false,
			beforeClose: function (event, ui) { resetFormDialog($("form", this)); }
		}).on("click", ".cancel-btn", function (e) {
			e.preventDefault();
			closeDialog(this);
		});;
		// create dialog for upload files
		$("#div_uploadfiles").dialog({
			title: "Upload Files",
			width: '700px',
			autoOpen: false,
			modal: true,
			resizable: false,
			beforeClose: function (event, ui) { resetFormDialog($("form", this)); }
		}).on("click", ".cancel-btn", function (e) {
			e.preventDefault();
			closeDialog(this);
		});
		
		// create switch for enabled checkbox in the add site form
		$("[name='add_enabled']").bootstrapSwitch({
			size: "small",
			onColor: "success",
			offColor: "default"
		});
		// create switch for enabled checkbox in the edit site form
		$("[name='edit_enabled']").bootstrapSwitch({
			size: "small",
			onColor: "success",
			offColor: "default",
			onSwitchChange: function(event, state) {
				if (typeof enableDisableTiles === "function") {
					enableDisableTiles($("#div_editsite"));
				}
							  
																						
																				 
				 
			}
   
		});
 
						 
						
	  
																		
			  
			 
	}
	function resetFormDialog($forms) {
		$.each($forms, function (index, form) {
			if (form.id) {
				if (form.id == "siteform_add") {
					$(form).validate().resetForm();
					form.reset();
					hidePanelError(form);
				} else if (form.id == "siteform_edit") {
					$(form).validate().resetForm();
					form.reset();
					hidePanelError(form);
					
					$("tr.site", "table#sites").removeClass("editing");
					
					// Refresh site in list
					var siteId  = (typeof $("#div_editsite").data("dna")) === "undefined" ? void 0 : $("#div_editsite").data("dna").id;
					var $parent = $("table#sites>tbody");
					refreshSiteHtml(siteId, $parent);
				} else if (form.id == "siteform_delete") {
					hidePanelError(form);
					form.reset();
				} else if ($(form).hasClass("upload-form")) {
					hidePanelError(form);
					// removeAppendedColoredText
					var $acc = $(form).closest(".panel").find(".panel-title>a");
					if ($acc.length > 0) {
						var str = $acc.html();
						var modifIdx = str.indexOf('<font color');
						$acc.html(str.substring(0, modifIdx > 0 ? modifIdx : str.length));
					}
					// reset uploaded statuses
					$(form).closest(".panel").removeClass("uploading uploading-started uploading-done");
					$(form).closest(".panel").find('input[name="file"]').prop("disabled", false);
					form.reset();
				}
			}
   
									
															
		});
	}
								
															   
 
								
													   
 

							   
			 
				   
							
												  
													   
		  
						   
   
   
												  
					
	
																					   
						  
							
												  
															  
		  
						   
   
   
												  
					
	
	
	// ======================== START ======================== //
	refreshAllSites();
	defineFormDialogs();
	
	// validate add form
	$("input[name=userId]", "#siteform_add").val(window.userID);
	$("#siteform_add").validate({
		rules: {
			name:{ required: true, pattern: "[A-Z]{1}[\\w ]*" },
			shapeFile: "required"
		},
		messages: {
			name: { pattern : "First letter must be uppercase. Letters, digits, spaces and underscores are allowed" }
		},
		highlight: function (element, errorClass) {
			$(element).parent().addClass("has-error");
		},
		unhighlight: function (element, errorClass) {
			$(element).parent().removeClass("has-error");
		},
		errorPlacement: function (error, element) {
			error.appendTo(element.parent());
		},
		submitHandler: function (form) {
			saveNewSite(form);
		},
		// set this class to error-labels to indicate valid fields
		success: function (label) {
			label.remove();
		},
	});
	
	// validate edit site form
	$("#siteform_edit").validate({
		rules: {
			shortname:{ required: true, pattern: "[a-z]{1}[a-z_ ]*" }
		},
		messages: {
			shortname: { pattern : "Only small letters,space and underscore are allowed" }
		},
		highlight: function (element, errorClass) {
			$(element).parent().addClass("has-error");
		},
		unhighlight: function (element, errorClass) {
			$(element).parent().removeClass("has-error");
		},
		errorPlacement: function(error, element) {
			error.appendTo(element.parent());
		},
		submitHandler: function (form) {
			//check the tiles
			var tilesL8NotValid = '';var tilesS2NotValid = '';
			if($("#chkS2Edit").is(':checked')){
				var s2Tiles = $('textarea[name="S2Tiles"]').val();
				
				if(s2Tiles!=""){
					tilesS2Arr = s2Tiles.split(',');
					for(i = 0; i < tilesS2Arr.length; i++){
						var noMatch = tilesS2Arr[i].replace(/^(\d{2}[A-Z]{3})(,\d{2}[A-Z]{3})*/gm,'');
						if(noMatch.trim()!=''){
							tilesS2NotValid = tilesS2NotValid+" "+tilesS2Arr[i];
						}
					}
				}
			}
			if($("#chkL8Edit").is(':checked')){
				var l8Tiles = $('textarea[name="L8Tiles"]').val();
 
				if(l8Tiles!=""){
					tilesL8Arr = l8Tiles.split(',');
					for(i = 0; i < tilesL8Arr.length; i++){
						var noMatch = tilesL8Arr[i].replace(/^(\d{6})(,\d{6})*/gm,'');
						if(noMatch.trim()!=''){
							tilesL8NotValid = tilesL8NotValid+" "+ tilesL8Arr[i];
						}
					}
				}
			}
			if(tilesS2NotValid!=''){
				$(".invalidTilesS2").text("Invalid tile: "+tilesS2NotValid);
			}else{
				$(".invalidTilesS2").text("");
				}
			if(tilesL8NotValid!=''){
				$(".invalidTilesL8").text("Invalid tile: "+tilesL8NotValid);
			}else{
				$(".invalidTilesL8").text("");
			}
			if(tilesS2NotValid=='' && tilesL8NotValid==''){
				updateSite(form);
			}
		},
		// set this class to error-labels to indicate valid fields
		success: function (label) {
			label.remove();
		},
	});
	
	// open Add new site dialog
	$("input[name=addsite]").on("click", function (e) {
		openAddNewSiteDialog();
	});
	// open Delete Site dialog
	$("#div_editsite").on("click", "#delete_site", function (e) {
		e.preventDefault();
		openDeleteSiteDialog();
	});
	$("#siteform_delete").on("change", "input[type='checkbox']", function (e) {
		if ($(this).is(":checked")) {
			$(this).closest("label").addClass("selected");
		} else {
			$(this).closest("label").removeClass("selected");
		}
	});
	// validate Delete site form
	$("#siteform_delete").on("submit", function (e) {
		e.preventDefault();
		deleteSite(this);
	});
	// open Upload Files dialog for default configuration year
	$("#div_editsite").on("click", "#upload_files", function (e) {
		e.preventDefault();
		var uploadYear = $(this).data("uniqueValue");
		changeUploadYear(uploadYear);
	});
	// open Upload Files dialog for custom configuration year
	$("#div_uploadfiles").on("click", "input[name='change_upload_year']", function (e) {
		e.preventDefault();
		var uploadYear = $("#upload_year", "#div_uploadfiles").val();
		changeUploadYear(uploadYear);
	});
	// open Upload Files dialog for selected season
	$("#site_seasons").on("upload", function (e) {
		var seasonData = $(this).data("dna");
		changeUploadSeason(seasonData);
	});
