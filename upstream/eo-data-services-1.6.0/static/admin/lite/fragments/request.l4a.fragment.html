<style>
	.sub-service.l4a input[type="number"].oneverydate {width:10%;margin-right:1rem;}
	.sub-service.l4a input[type="text"] {width:33.3%;}
</style>
<div class="sub-service l4a">
	<h4 class="panel-title">Dynamic Crop Mask</h4>
	<div class="form-group row">
		<label class="col-md-12">
			<span>Binary map separating annual cropland areas and other areas, thus corresponding to a mask over annually cultivated area. This binary map is produced along the agricultural season on a monthly basis, to serve for instance as a mask for monitoring crop growing conditions, as basis for sampling stratification and for agricultural extension.</span>
		</label>
		<label class="col-md-12" for="mode_unsupervised">
			<input type="radio" class="form-control" name="crop_mask_mode" id="mode_unsupervised" value="Unsupervised" />
			<label class="title">Unsupervised</label>
			<span class="extra-info">Mode - unsupervised</span>
		</label>
		<div>
			<label class="col-md-3" for="mode_supervised">
				<input type="radio" class="form-control" name="crop_mask_mode" id="mode_supervised" value="Supervised" />
				<label class="title">Supervised</label>
				<span class="extra-info">Mode - Supervised</span>
			</label>
			<label class="col-md-9" for="modeSupervisedFile">
				<span>Please define your In-situ Data using a GIS layer in ESRI Shapefile (in a zip file including all the components of the layer), GeoJSON or KML format.</span>
				<input type="file" class="form-control mode_supervised_group" id="modeSupervisedFile" name="l4SupervisedFile" accept="application/zip,application/x-zip,application/x-zip-compressed,application/octet-stream,.kml,.geojson" onchange="$(this).trigger('blur');" disabled="disabled"/>
			</label>
		</div>
		<label class="col-md-12" for="mode_use_earthSignature">
			<input type="radio" class="form-control" name="crop_mask_mode" id="mode_use_earthSignature" value="EarthSignature" checked />
			<label class="title">EarthSignature</label>
			<span class="extra-info">Mode - using EarthSignature</span>
		</label>
		
		<label class="col-md-12" style="padding-top:3rem;">
			<span>Schedule type represents the time period when the crop mask is generated. The start date must be after the middle of the sensing period.</span>
		</label>
		<div>
			<label class="col-md-12" for="l4a_schedule_once">
				<input type="radio" class="form-control" name="schedule_type" id="l4a_schedule_once" value="Once" checked />
				<label class="title">Once</label>
				<label class="col-md-12" style="display:inline-flex;padding:1.5rem 0 0 2.7rem;">
					<strong style="width:15%;">First run time:</strong>
					<input type="text" class="form-control date-field timeRun" name="onceFirstTimeRun" id="l4aOnceFirstTimeRun" autocomplete="off" value="" />
				</label>
			</label>
		</div>
		<div>
			<label class="col-md-12" for="l4a_schedule_repeat">
				<input type="radio" class="form-control" name="schedule_type" id="l4a_schedule_repeat" value="Repeat" />
				<label class="title">Repeat</label>
				<label class="col-md-12" style="display:inline-flex;padding:1.5rem 0 0 2.7rem;">
					<strong style="width:15%;">First run time:</strong>
					<input type="text" class="form-control date-field timeRun" name="repeatFirstTimeRun" id="l4aRepeatFirstTimeRun" autocomplete="off" value="" disabled />
					<strong style="width:10%;padding-left:2rem;">Every:</strong>
					<input type="number" class="form-control oneverydate" name="oneverydate" id="l4aOneverydate" min="1" max="31" step="1" value="" disabled /> day of month
				</label>
			</label>
		</div>
	</div>
</div>
<script type="text/javascript">
	$(document).ready(function() {
		$("input[name='crop_mask_mode']").change(function () {
			$(this).closest(".form-group").find("label.error").remove();
			var selected_value = $("input[name='crop_mask_mode']:checked").val();
			if (selected_value === "Supervised") {
				$("#modeSupervisedFile").prop("disabled", false);
			}else {
				$("#modeSupervisedFile").prop("disabled", true);
			}
		});
		
		// Date pickers with active validation
		$("#l4aOnceFirstTimeRun").datepicker({ changeYear: true, changeMonth: true, yearRange: "1970:2037", dateFormat: "yy-mm-dd" })
		.on('change', function() {
			if ($("#l4aOnceFirstTimeRun").val() != "") { 
				$(this).valid();
			}
		});
		
		$("#l4aRepeatFirstTimeRun").datepicker({ changeYear: true, changeMonth: true, yearRange: "1970:2037", dateFormat: "yy-mm-dd" })
		.on('change', function() {
			if ($("#l4aRepeatFirstTimeRun").val() != "") { 
				$(this).valid();
			}
		});
	});
//# sourceURL=request_l4a.js
</script>
