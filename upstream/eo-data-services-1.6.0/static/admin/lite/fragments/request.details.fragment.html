<script type="text/javascript">
	function purgeAllProductsDialogs() {
		purgeUiDialog("cancel_processor");
	}
	
	$(document).ready(function () {
		function defineFormDialogs() {
			// Clear all previously defined dialogs
			purgeAllProductsDialogs();
			
			// create dialog for cancel processor form
			$("#cancel_processor").dialog({
				title: "Cancel Processor",
				width: '700px',
				autoOpen: false,
				modal: true,
				resizable: false,
				beforeClose: function (event, ui) { resetFormDialog($("form", this)); }
			}).on("click", ".cancel-btn", function (e) {
				e.preventDefault();
				closeDialog(this);
			});
		};
		
		var getDataFrom = function (requestId) {
			return $.ajax({
				async: false,
				url: baseApiUrl + "services/get/" + requestId,
				dataType: 'json',
				beforeSend: function (xhr) {
					xhr.setRequestHeader("Accept", "application/json");
					xhr.setRequestHeader("Content-Type", "application/json");
				}
			});
		};
		
		var getService = function (serviceId) {
			return $.ajax({
				beforeSend: function(xhr) { xhr.setRequestHeader("X-Auth-Token", window.tokenKey); },
				cache: false,
				async: false,
				url  : baseApiUrl + "services/get/" + serviceId,
				type : "GET"
			});
		};
		
		function displayResponse (data) {
			if (data !== null) {
				var serviceName = [];
				var processorsStatusArray = [];
				if (typeof data["processors"] !== "undefined") {
					var bothL4 = typeof data["processors"]["l4a"] !== "undefined" && typeof data["processors"]["l4b"] !== "undefined";
					//service data
					$.each(data["processors"], function (key, value) {
						var statusName = jobStatusEnum(value["status"]);
						serviceName.push(processorEnum(key));
						processorsStatusArray.push(value["status"]);
						switch (key) {
							case "l3b":
								$("p.status",".vegetation").html(statusName).addClass("status-text-" + statusName);
								$(".sub-service.vegetation").removeClass("hidden");
								$("input[name='processorId']", ".vegetation").val(value["id"]);
								if (value["status"] == 3 || value["status"] == 7 || value["status"] == 8) {
									$("span.request-btn", ".vegetation").addClass("button-disabled");
								}
								var vegetationIndicators = value["include"];
								if (typeof vegetationIndicators !== "undefined") {
									if (vegetationIndicators.includes("NDVI")) {
										$("#sum_usr_includeNDVI").html('&#10003;').css({ color: "" });
									} else {
										$("#sum_usr_includeNDVI").html('&#10007;').css({ color: "#b7b7b7" });
									}
									if (vegetationIndicators.includes("LAI")) {
										$("#sum_usr_includeLAI").html('&#10003;').css({ color: "" });
									} else {
										$("#sum_usr_includeLAI").html('&#10007;').css({ color: "#b7b7b7" });
									}
								}
								break;
							case "l4a":
								$("p.status",".dynamic_crop_mask").html(statusName).addClass("status-text-" + statusName);
								$(".sub-service.dynamic_crop_mask").removeClass("hidden");
								$("input[name='processorId']",".dynamic_crop_mask").val(value["id"]);
								if (value["status"] == 3 || value["status"] == 7 || value["status"] == 8) {
									$("span.request-btn", ".dynamic_crop_mask").addClass("button-disabled");
								}
								if (value["mode"] === "Unsupervised") {
									$("#sum_usr_mode_unsupervised").html('').parent("label").removeClass("hidden");
									$("#sum_usr_mode_supervised").parent("label").addClass("hidden");
									$("#sum_usr_mode_use_EarthSignature").parent("label").addClass("hidden");
								} else if(value["mode"] === "EarthSignature") {
									$("#sum_usr_mode_unsupervised").parent("label").addClass("hidden");
									$("#sum_usr_mode_supervised").parent("label").addClass("hidden");
									$("#sum_usr_mode_use_EarthSignature").html('').parent("label").removeClass("hidden");
								} else {
									$("#sum_usr_mode_unsupervised").parent("label").addClass("hidden");
									$("#sum_usr_mode_supervised").html('').parent("label").removeClass("hidden");
									$("#sum_usr_mode_use_EarthSignature").parent("label").addClass("hidden");
									
									$(".sub-service.used_file").removeClass("hidden");
									$("#sum_usr_dynamic_crop_mask_file").html(value["fileName"]);
									$("#sum_usr_dynamic_crop_mask_file").parent("label").removeClass("hidden");
								}
								
								if (typeof value["firstRunDate"] !== "undefined" && typeof value["repeatOnMonthDay"] !== "undefined") {
									$("#sum_usr_type_repeat").html("Repeat on every " + value["repeatOnMonthDay"] + " day of month, starting with " + value["firstRunDate"]);
								} else if (typeof value["firstRunDate"] !== "undefined") {
									$("#sum_usr_type_repeat").html("Once on " + value["firstRunDate"]);
								} else {
									$("#sum_usr_type_repeat").html("");
								}
								break;
							case "l4b":
								$("p.status",".crop_type_map").html(statusName).addClass("status-text-" + statusName);
								$(".sub-service.crop_type_map").removeClass("hidden");
								$("input[name='processorId']",".crop_type_map").val(value["id"]);
								if (value["status"] == 3 || value["status"] == 7 || value["status"] == 8) {
									$("span.request-btn", ".crop_type_map").addClass("button-disabled");
								}
								if (value["mode"] === "Supervised") {
									$("#sum_usr_mode_insitu"        ).html('').parent("label").removeClass("hidden");
									$("#sum_usr_mode_EarthSignature").parent("label").addClass("hidden");
									
									$(".sub-service.used_file").removeClass("hidden");
									$("#sum_usr_crop_type_map_insitu_file").html(value["fileName"]);
									$("#sum_usr_crop_type_map_insitu_file").parent("label").removeClass("hidden");								
								} else {
									$("#sum_usr_mode_insitu"        ).parent("label").addClass("hidden");
									$("#sum_usr_mode_EarthSignature").html('').parent("label").removeClass("hidden");
								}
								if (typeof value["referenceCropMaskFileName"] !== "undefined") {
									$("#sum_usr_useReferenceMap_file", "div.crop_type_map").html("").parent("label").removeClass("hidden");
									$("#sum_usr_useReferenceMap_project", "div.crop_type_map").parent("label").addClass("hidden");
									$("#sum_usr_useReferenceMap_selected_file", "div.crop_type_map").html(value["referenceCropMaskFileName"]).css({ color: "" });
								} else if (typeof value["useOutputCropMaskOfServiceId"] !== "undefined") {
									$("#sum_usr_useReferenceMap_project", "div.crop_type_map").html("").parent("label").removeClass("hidden");
									$("#sum_usr_useReferenceMap_file", "div.crop_type_map").parent("label").addClass("hidden");
									$.when(getService(value["useOutputCropMaskOfServiceId"])).done(function (response) {
										if (response.status === responseStatus.success) {
											$("#sum_usr_useReferenceMap_selected_project", "div.crop_type_map").html(response.data.name).css({ color: "" });
										} else {
											console.log(response.status + ": " + response.message);
										}
									});
								} else if (bothL4) {
									$("#sum_usr_useReferenceMap_file", "div.crop_type_map").parent("label").addClass("hidden");
									$("#sum_usr_useReferenceMap_file", "div.crop_type_map").parent("label").prev("label.category").addClass("hidden");
									$("#sum_usr_useReferenceMap_project", "div.crop_type_map").parent("label").addClass("hidden");
								} else {
									$("#sum_usr_useReferenceMap_file", "div.crop_type_map").parent("label").addClass("hidden");
									$("#sum_usr_useReferenceMap_selected_file", "div.crop_type_map").html("").parent("label").removeClass("hidden");
									$("#sum_usr_useReferenceMap_project", "div.crop_type_map").parent("label").addClass("hidden");
									$("#sum_usr_useReferenceMap_selected_project", "div.crop_type_map").html("").parent("label").removeClass("hidden");
								}
								break;
						}
					});
				}
			
				// title
				$(".detail-page-title").html(data["name"]);
				//general status
				var generalStatus = getRequestGeneralStatus(processorsStatusArray);
				$(".request-status").html(generalStatus).addClass("status-text-" + generalStatus);
				
				// about your service request
				$("#sum_usr_thematic_area").html(serviceName.toString().replaceAll(",", ", "));
				$("#sum_usr_additional_support").html(data["additionalSupport"]);
				
				// earth Observation Data
				$("#sum_usr_useS2").html('&#10007;').css({ color: "#b7b7b7" });
				$("#sum_usr_useL8").html('&#10007;').css({ color: "#b7b7b7" });
				if (typeof data["datasets"] !== "undefined") {
					if (typeof data["datasets"] !== "undefined") {
							if (data["datasets"].includes("Sentinel-2")){
								$("#sum_usr_useS2").html('&#10003;').css({ color: "" });
							}else {
								$("#sum_usr_useS2").html('&#10007;').css({ color: "#b7b7b7" });
							}
							if (data["datasets"].includes("Landsat-8")) {
								$("#sum_usr_useL8").html('&#10003;').css({ color: "" });
							}else {
								$("#sum_usr_useL8").html('&#10007;').css({ color: "#b7b7b7" });
							}
						}
				}
				
				// region of interest
				if (data["footprintFilename"] !== null) {
					$("#sum_usr_refp").html(data["footprintFilename"]);
				}
				var readFlatCoordinates = (new ol.format.WKT()).readGeometry(data["footprint"]).flatCoordinates;
				
				$("#sum_usr_latmin").html(readFlatCoordinates[1]);
				$("#sum_usr_latmax").html(readFlatCoordinates[5]);
				$("#sum_usr_lonmin").html(readFlatCoordinates[0]);
				$("#sum_usr_lonmax").html(readFlatCoordinates[4]);
				
				// sensing period
				$("#sum_usr_time_range_from").html(data["startDate"]);
				$("#sum_usr_time_range_to").html(data["endDate"]);
				if (data["additionalDataSpecifications"] !== "") {
					$("#sum_usr_additional").html(data["additionalDataSpecifications"]);
				}
			}
		}

		var requestId = getUrlParameter("id");
		$.when(getDataFrom(requestId)).done(function (response) {
			if (response.status === responseStatus.success) {
				displayResponse(response.data);
			}else {
				console.log(response.status + ": " + response.message);
			}
		});
		
		$("#close_detail").on("click", function (e) {
			e.preventDefault();
			window.location.href='sap.html#dashboard';
		});
		
		$("span.request-btn:not(.button-disabled)").on("click", function (e) {
			e.preventDefault();
			var processorKey = $(this).closest("div.sub-service").find("input[name='processorId']").val();
			var requestName = $(this).closest("label.highlight").children(":first").text();
			
			$("#processor_name>span", "#cancel_processor").html(requestName);
			$("input[name='processorKey']", "#cancel_processor").val(processorKey);
			
			// open cancel dialog
			$("#cancel_processor").dialog("open");
		});
		
		// validate Cancel request form
		$("#processorform_cancel").on("submit", function (e) {
			e.preventDefault();
			var processorKeyArray = [$("input[name='processorKey']", "#processorform_cancel").val()];
			var cancelObject = {};
			cancelObject["serviceId"] = requestId;
			cancelObject["processorIds"] = processorKeyArray;
			cancelRequest(cancelObject);
		});
		
		$("#wp-custom-header h1.header-post-title-class").html("View request");
		
		defineFormDialogs();
	});
	
//# sourceURL=details.js
</script>
