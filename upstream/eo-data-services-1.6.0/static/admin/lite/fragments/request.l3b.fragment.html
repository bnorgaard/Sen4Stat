<div class="sub-service l3b">
	<h4 class="panel-title">Vegetation Status Indicators</h4>
	<div class="form-group row">
		<label class="col-md-12">
			<span>Vegetation indicators informing about the evolution of the green vegetation corresponding to the crop vegetative development.</span>
		</label>
	</div>
	<div class="form-group row">
		<label class="col-md-12" for="includeNDVI">
			<input type="checkbox" class="form-control" name="include" id="includeNDVI" value="NDVI" checked /><label>NDVI</label>
		</label>
	</div>
	<div class="form-group row">
		<label class="col-md-12" for="includeLAI">
			<input type="checkbox" class="form-control" name="include" id="includeLAI" value="LAI" checked /><label>Leaf Area Index</label>
		</label>
	</div>
</div>
