<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<title>EarthAgriculture</title>
	
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<meta name="keywords" content="" />
	<meta name="description" content="" />
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="content-language" content="" />
	
	<link rel="icon" type="image/png" href="assets/dist/img/favicon.png" />
	<link rel="stylesheet" type="text/css" href="assets/libs/bootstrap/3.3.6/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="assets/dist/css/fonts/fonts.css" />
	<link rel="stylesheet" type="text/css" href="assets/dist/css/theme.css">
	<link rel="stylesheet" type="text/css" href="assets/dist/css/styles.css">
	
	<script src="assets/libs/jquery/2.2.4/jquery.min.js"></script>
	<script src="assets/libs/bootstrap/3.3.6/js/bootstrap.min.js"></script>
	<script src="assets/dist/js/general-functions.js"></script>
	<!-- includes for validate form -->
	<script src="assets/libs/jquery-validate/1.14.0/jquery.validate.min.js"></script>
	<script src="assets/libs/jquery-validate/1.14.0/additional-methods.min.js"></script>
</head>
<body>
	<div id="header">
		<div id="header2">
			<div id="logo"><a href="" title="Home"><img src="assets/dist/img/logo.png" width="100px" /></a><h3>Earth<span>Agriculture</span></h3></div>
		</div>
	</div>
	<div id="main">
		<div id="main2" style="width:36rem;font-size:1.2rem;margin-top:1rem">
			<div class="panel panel-resources">
				<div class="panel-heading">
					<h2 class="panel-title">Login</h2>
				</div>
				<div class="panel-body">
					<div class="panel-group">
						<div class="panel bevel panel-signin" style="border:1px solid lightgray">
							<div class="panel">
								<div class="panel-body">
									<form method="POST" id="loginForm">
										<div class="form-group-sm row">
											<label class="control-label col-md-12"><span class="glyphicon glyphicon-user"></span> Username:</label>
											<div class="col-md-12">
												<input class="form-control" type="text" name="user" />
											</div>
										</div>
										<div class="form-group-sm row">
											<label class="control-label col-md-12"><span class="glyphicon glyphicon-eye-open"></span> Password:</label>
											<div class="col-md-12">
												<input class="form-control" type="password" name="pwd" />
											</div>
										</div>
										<div class="form-group-sm row">
											<div class="col-md-12 error hidden"></div>
										</div>
										<div class="submit-buttons">
											<input type="submit" class="add-edit-btn" value="login" />
										</div>
									</form>
								</div>
							</div>
							<hr/>
							<div class="panel">
								<div class="panel-body">
									<label>Forgot your password or new account?<br/>
									<a href="#">Reset password.</a></label>
								</div>
							</div>
						</div>
						<div class="panel bevel panel-resetPassword hidden" style="border:1px solid lightgray">
							<div class="panel">
								<div class="panel-body">
									<form id="formPass" method="POST">
										<input type="hidden" name="token" value="">
										<div class="form-group-sm row">
											<label class="control-label col-md-12"><span class="glyphicon glyphicon-user"></span> Username:</label>
											<div class="col-md-12">
												<input class="form-control" type="text" name="userName">
											</div>
										</div>
										<div class="form-group-sm row">
											<label class="control-label col-md-12"><span class="glyphicon glyphicon-envelope"></span> Email:</label>
											<div class="col-md-12">
												<input class="form-control" type="text" name="email">
											</div>
										</div>
										<div class="form-group-sm row">
											<label class="control-label col-md-12"><span class="glyphicon glyphicon-eye-open"></span> Password:</label>
											<div class="col-md-12">
												<input class="form-control" type="password" name="newPassword" id="pwd" />
											</div>
										</div>
										<div class="form-group-sm row">
											<label class="control-label col-md-12"><span class="glyphicon glyphicon-eye-open"></span> Confirm password:</label>
											<div class="col-md-12">
												<input class="form-control" type="password" name="confirm" />
											</div>
										</div>
										<div class="form-group-sm row">
											<div class="col-md-12 error hidden"></div>
										</div>
										<div class="submit-buttons">
											<input type="submit" class="add-edit-btn" value="reset password" />
										</div>
									</form>
								</div>
							</div>
							<hr/>
							<div class="panel">
								<div class="panel-body">
									<label><a href="#">Back to login</a></label>
								</div>
							</div>
						</div>
					</div>
					<hr/>
				</div>
			</div>
		</div>
	</div>
	<div id="bar"><div id="bar2">&nbsp;</div></div>
	<div id="footer">
		<div id="footer2">
			<div class="message-footer">Copyright © <!--2015–2020 -->CS ROMANIA SA</div>
		</div>
	</div>
	<style>
		label{margin:0}
		.form-group-sm{margin-bottom:1rem}
		.add-edit-btn{background-color:#3e923e}
		.add-edit-btn:active{background-color:#5db685}
	</style>
	<script type="text/javascript">
		$.fn.clearValidation = function(){var v=$(this).validate();$('[name]',this).each(function(){v.successList.push(this);v.showErrors();});v.resetForm();v.reset();};
		function checkUserAuthCookie() {
			try {
				var cookieAuthUser = JSON.parse(_cookiesSettings.readCookie("authuser"));
				if (cookieAuthUser) {
					// Set global variables
					window.userID      = cookieAuthUser.userID;
					window.userLogin   = cookieAuthUser.userLogin;
					window.userIsAdmin = cookieAuthUser.userIsAdmin;
                    window.userRole    = cookieAuthUser.userRole;
					window.tokenKey    = cookieAuthUser.tokenKey;
					
					window.location.href = "sap.html#dashboard";
				}
			} catch(e) { }
		}
		$("#loginForm").on("submit", function (e) {
			e.preventDefault();
			
			var form = this;
			hidePanelError(form);
			$.ajax({
				url: baseApiUrl + "login",
				type: "POST",
				data: $(this).serialize(),
				success: function(response) {
					if (response.status == "SUCCEEDED") {
						var cookieAuthUser = {
							userID   : response.data.userId,
							userLogin: $('input[name="user"]').val(),
							userIsAdmin: response.data.admin,
                            userRole: response.data.role,
							tokenKey : response.data.sessionToken
						};
						_cookiesSettings.eraseCookie("authuser");
						_cookiesSettings.createCookie("authuser", JSON.stringify(cookieAuthUser), 3/24);
						checkUserAuthCookie();
					} else {
						showPanelError(form, response.message);
					}
				},
				error: function (jqXHR, textStatus, errorThrown) {
					showPanelError(form, jqXHR);
				}
			});
		});
		$('#formPass').validate({
			rules : {
				userName: { required: true },
				email   : { required: true, pattern: /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/ },
				password: { required: true, minlength: 5 },
				confirm : { required: true, minlength: 5, equalTo: "#pwd" }
			},
			messages: {
				email   : "Please enter a valid email address.",
				password: {
					required: "What is your password?",
					minlength: $.validator.format("Your password must contain at least {0} characters."),
				},
				confirm : {
					required: "You must confirm your password",
					minlength: $.validator.format("Your password must contain at least {0} characters."),
					equalTo: "Doesn't match the password."
				}
			},
			highlight: function(element, errorClass) {
				$(element).parent().addClass("has-error");
			},
			unhighlight: function(element, errorClass) {
				$(element).parent().removeClass("has-error");
			},
			errorPlacement: function(error, element) {
				error.appendTo(element.parent());
			},
			success: function(label) {
				label.remove();
			},
			submitHandler: function (form) {
				hidePanelError(form);
				
				// reset password
				$.ajax({
					url: baseApiUrl + "users/pwd/request",
					type: "POST",
					data: $(form).serialize(),
					success: function(response) {
						if (response.status == "SUCCEEDED") {
							$("input[name='token']", form).val(response.data);
							$.ajax({
								url: baseApiUrl + "users/pwd/reset",
								type: "POST",
								data: $(form).serialize(),
								success: function(response) {
									if (response.status == "SUCCEEDED") {
										alert("Password successfully reset!");
										window.location.href = "login.html";
									} else {
										showPanelError(form, response.message);
									}
								},
								error: function (jqXHR, textStatus, errorThrown) {
									showPanelError(form, jqXHR);
								}
							});
						} else {
							showPanelError(form, response.message);
						}
					},
					error: function (jqXHR, textStatus, errorThrown) {
						showPanelError(form, jqXHR);
					}
				});
			}
		});
		
		// Event handlers for frontend navigation
		$(".panel-signin").on("click", "a", function (e) {
			e.preventDefault();
			$(".panel-signin").addClass("hidden");
			$(".panel-resetPassword").removeClass("hidden");
		});
		$(".panel-resetPassword").on("click", "a", function (e) {
			e.preventDefault();
			
			hidePanelError("#formPass");
			$("#formPass").get(0).reset();
			$("#formPass").clearValidation();
			
			$(".panel-resetPassword").addClass("hidden");
			$(".panel-signin").removeClass("hidden");
		});
		$(document).ready( function() {
			checkUserAuthCookie();
			adjustFooterPosition();
		});
	</script>
</body>
</html>
