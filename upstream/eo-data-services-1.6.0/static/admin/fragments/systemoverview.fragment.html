<div class="panel panel-resources">
	<div class="panel-heading">
		<h2 class="panel-title">System overview</h2>
	</div>
	<div class="panel-body">
		<div class="tabControl">
			<ul>
				<li data-title="Server Resources"><a href="#tab_server_resources">Server Resources</a>
				</li><li data-title="Current Jobs"><a href="#tab_current_jobs">Current Jobs</a></li>
				</li><li data-title="Monitoring"><a href="#tab_monitoring">Monitoring</a></li>
				<li data-title="Job Output" class="hidden"><a id="tab_job_output_anchor" href="#tab_job_output">Job Output</a></li>
			</ul>
			<div id="tab_server_resources" class="panel-group tab-content">
				<div class="panel bevel">
					<div id="pnl_server_resources" class="dash-row"></div>
					<div class="error hidden"></div>
				</div>
			</div>
			<div id="tab_current_jobs" class="panel-group tab-content">
				<div class="panel bevel">
					<div id="pnl_current_jobs" class="panel loading">
						<div class="panel-heading"><h3 class="panel-title">Jobs list</h3></div>
						<div class="panel-body">
							<div style="float:right;margin-bottom:10px">
								<button id="page_move_first" type="button" class="btn btn-default" onclick="move_to_first_jobs_page();">&lt;&lt;</button>
								<button id="page_move_prev"  type="button" class="btn btn-default" onclick="move_to_previous_jobs_page();">Previous Page</button>
								<button id="page_current"    type="button" class="btn btn-default" style="font-weight: 700;">1</button>
								<button id="page_move_next"  type="button" class="btn btn-default" onclick="move_to_next_jobs_page()">Next Page</button>
								<button id="page_move_last"  type="button" class="btn btn-default disabled">&gt;&gt;</button>
							</div>
							<table class="table" style="table-layout:fixed">
								<thead>
									<tr>
										<th style="width:70px;text-align:center">Id</th>
										<th>Processor</th>
										<th>Site</th>
										<th style="width:140px;text-align:center">Triggered By<br/>Triggered On</th>
										<th style="width:450px;text-align:center">Task Status<br/>Modules</th>
										<th style="width:130px;text-align:center">Actions</th>
									</tr>
								</thead>
								<tbody>
								</tbody>
							</table>
						</div>
					</div>
					<div class="error hidden"></div>
				</div>
			</div>
			<div id="tab_monitoring" class="panel-group tab-content">
				<div class="panel bevel">
					<div id="pnl_monitoring" class="loading" data-chash="#systemoverview"></div>
					<div class="error hidden"></div>
				</div>
			</div>
			<div id="tab_job_output" class="panel-group tab-content">
				<div class="panel bevel">
					<div id="pnl_job_output" class="panel loading">
						<div class="panel-heading"><h3 class="panel-title">Job ID: <span id="title_job_id"></span></h3></div>
						<div class="panel-body">
							<table class="table" style="table-layout:fixed">
								 <thead> 
								  <tr> 
									<th>Step name</th> 
									<th>Command</th> 
									<th>Output</th> 
									<th>Errors</th> 
									<th>Exit code</th> 
								  </tr> 
								</thead> 
								<tbody>
								</tbody>
							</table>
						</div>
					</div>
					<div class="error hidden"></div>
				</div>
			</div>
		</div>
		<hr/>
	</div>
</div>
<div id="resource_template" class="collapse">
	<div class="panel dash-panel panel_resources loading">
		<div class="panel-heading"><h3 class="panel-title"><span class="glyphicon glyphicon-refresh  panel-control refresh"></span></h3></div>
		<div class="panel-body">
			<div class="server-resource"></div>
			<div class="error hidden"></div>
		</div>
	</div>
</div>
<style>
	div.loading{min-height:300px}
	
	.dash-row .dash-panel{padding-left:0}
	.dash-row .dash-panel::after{content:none}
	.dash-row .dash-panel .panel-body{padding:15px}
	.dash-panel.panel_resources{display:inline-block;width:49%;margin:0 2% 20px 0}
	.dash-panel.panel_resources:nth-child(even){margin-right:0}
	
	.copy-link {cursor: pointer;font-weight:bold;}

	#pnl_server_resources{margin-bottom:-20px;display:block!important}
	#pnl_server_resources .table>tbody>tr>td:nth-child(1){width:10%;font-weight:700;font-size:12px}
	#pnl_server_resources .table>tbody>tr>td:nth-child(2){width:20%}
	#pnl_server_resources .table>tbody>tr>td:nth-child(3){width:70%}
	#pnl_server_resources .table .server_resources_table_graph{min-height:65px}
	
	#pnl_current_jobs .table tr td{padding:0 4px;overflow:hidden;text-overflow:ellipsis}
	#pnl_current_jobs .table tr td:nth-child(1){font-weight:700;text-align:center}
	#pnl_current_jobs .table tr td:nth-child(4),
	#pnl_current_jobs .table tr td:last-child{text-align:center}
	#pnl_current_jobs .table .task-modules{display:flex;flex-wrap:wrap;flex-direction:row;display:-webkit-flex;-webkit-flex-wrap:wrap;-webkit-flex-direction:row;font-size:11px}
	#pnl_current_jobs .table span{margin:0;border-bottom:1px dashed var(--table-hover-bg-color)}
	#pnl_current_jobs .table .task-status,
	#pnl_current_jobs .table .task-progress-all{flex:0 0 50%;order:1;-webkit-flex:0 0 50%;-webkit-order:1;background-color:var(--table-hover-bg-color);font-weight:700;padding:0 5px;border-bottom:1px solid var(--table-border-color);font-size:12px}
	#pnl_current_jobs .table .task-status{text-align:left}
	#pnl_current_jobs .table .task-progress-all{text-align:right}
	#pnl_current_jobs .table .task-module,
	#pnl_current_jobs .table .task-progress{order:2;-webkit-order:2;padding:1px 0 0 0;color:#dadada}
	#pnl_current_jobs .table .task-module{flex:0 0 39%;-webkit-flex:0 0 39%;text-align:left;padding-left:2%}
	#pnl_current_jobs .table .task-progress{flex:0 0 10%;-webkit-flex:0 0 10%;text-align:right}
	#pnl_current_jobs .table .task-module.done,
	#pnl_current_jobs .table .task-progress.done{color:#555555}
	#pnl_current_jobs .table .btn{padding:4px 8px;border:0;width:55px;margin-left:2px}
	
	body .ui-tooltip{padding:2px 8px;font-weight:700;background-color:#fcfce3;font-style:italic;font-size:0.8em}
</style>
<script src="assets/libs/flot/0.8.3/jquery.flot.min.js"></script>
<script src="assets/libs/flot/0.8.3/jquery.flot.time.min.js"></script>
<script type="text/javascript">
	// ======================== Server Resources ======================== //
	var plots = {};
	var get_server_resource_data_interval = 10000;
	function update_server_resources_layout(json_data) {
		$("#pnl_server_resources table.to_be_refreshed_when_needed").remove();
		
		var counter = 0; // DO NOT REMOVE - This is used when updating.
		json_data.server_resources.forEach(function (server) {
			//Set up the DOM elements
			var table = "<table class=\"table server_resources_table to_be_refreshed_when_needed\">" +
			"<thead>" +
			"</thead>" +
			"<tbody>" +
			"<tr>" +
			"<td>CPU</td>" +
			"<td id=\"server_resources_table_" + counter + "_cpu\"></td>" +
			"<td>" +
			"<div id=\"server_resources_table_" + counter + "_cpu_history\" class=\"server_resources_table_graph\"></div>" +
			"</td>" +
			"</tr>" +
			"<tr>" +
			"<td>RAM</td>" +
			"<td id=\"server_resources_table_" + counter + "_ram\"></td>" +
			"<td>" +
			"<div id=\"server_resources_table_" + counter + "_ram_history\" class=\"server_resources_table_graph\"></div>" +
			"</td>" +
			"</tr>" +
			"<tr>" +
			"<td>Swap</td>" +
			"<td id=\"server_resources_table_" + counter + "_swap\"></td>" +
			"<td>" +
			"<div id=\"server_resources_table_" + counter + "_swap_history\" class=\"server_resources_table_graph\"></div>" +
			"</td>" +
			"</tr>" +
			"<tr>" +
			"<td>Disk</td>" +
			"<td id=\"server_resources_table_" + counter + "_disk\"></td>" +
			"<td>" +
			"<div id=\"server_resources_table_" + counter + "_disk_percentage\" class=\"server_resources_table_graph\"></div>" +
			"</td>" +
			"</tr>" +
			"<tr>" +
			"<td>Load</td>" +
			"<td id=\"server_resources_table_" + counter + "_load\"></td>" +
			"<td>" +
			"<div id=\"server_resources_table_" + counter + "_load_history\" class=\"server_resources_table_graph\"></div>" +
			"</td>" +
			"</tr>" +
			"</tbody>" +
			"</table>";
			
			var $template = $(".dash-panel", "#resource_template").clone(true);
			$(".panel-title", $template).html(server.name + '<span class="glyphicon glyphicon-refresh panel-control refresh"></span>');
			$(".server-resource", $template).append(table);
			$("#pnl_server_resources").append($template);
			
			if(window.navigator.userAgent.indexOf("MSIE ") > 0) {
				$("#server_resources_table_" + counter + "_cpu_history").height($("#server_resources_table_0_cpu_history").parent().height() * 90 / 100);
				$("#server_resources_table_" + counter + "_ram_history").height($("#server_resources_table_0_cpu_history").parent().height() * 90 / 100);
				$("#server_resources_table_" + counter + "_swap_history").height($("#server_resources_table_0_cpu_history").parent().height() * 90 / 100);
				$("#server_resources_table_" + counter + "_disk_percentage").height($("#server_resources_table_0_cpu_history").parent().height() * 90 / 100);
				$("#server_resources_table_" + counter + "_load_history").height($("#server_resources_table_0_cpu_history").parent().height() * 90 / 100);
			}
			
			// Add the CPU chart
			var cpu_history_series = [{label: "System", data: [], color: "rgba(46, 199, 35, 0.6)"}, {label: "User", data: [], color: "rgba(35, 199, 188, 0.6)"}];
			var cpu_history_options = {
					series: {
						stack: true,
						lines: {
							show: true,
							fill: true,
							lineWidth: 0.1
						}
					},
					xaxis: {
						mode: "time",
						tickSize: [1, "minute"],
						timeformat: ""
					},
					yaxis: {
						min: 0,
						max: 100,
						tickSize: 50,
						tickFormatter: function (v, axis) {
							return v + "%";
						},
						labelWidth: 30
					},
					legend: {
						noColumns: 0,
						position: "nw",
						backgroundOpacity: 0.5,
						margin: [0, 0],
						labelFormatter: function(label, series) {
							return "<span style=\"margin-right: 5px\">" + label + "</span>";
						}
					}
			};
			
			var element_id = "#server_resources_table_" + counter + "_cpu_history";
			plots[element_id] =  $.plot($(element_id), cpu_history_series, cpu_history_options);
			
			// Add the RAM chart
			var ram_history_series = [{data: []}];
			var ram_history_options = {
					series: {
						lines: {
							show: true,
							fill: true,
							lineWidth: 0.1,
							fillColor: { colors: ["rgba(156, 35, 199, 0.4)", "rgba(156, 35, 199, 0.9)"]}
						}
					},
					xaxis: {
						mode: "time",
						tickSize: [1, "minute"],
						timeformat: ""
					},
					yaxis: {
						min: 0,
						max: server.ram_available,
						tickSize: server.ram_available / 2,
						tickFormatter: function (v, axis) {
							return  Math.ceil(v) + " " + server.ram_unit;
						},
						labelWidth: 30
					}
			};
			
			var element_id = "#server_resources_table_" + counter + "_ram_history";
			plots[element_id] =  $.plot($(element_id), ram_history_series, ram_history_options);
			
			// Add the Swap chart
			var swap_history_series = [{data: []}];
			var swap_history_options = {
					series: {
						lines: {
							show: true,
							fill: true,
							lineWidth: 0.1,
							fillColor: { colors: ["rgba(35, 142, 199, 0.4)", "rgba(35, 142, 199, 0.9)"]}
						}
					},
					xaxis: {
						mode: "time",
						tickSize: [1, "minute"],
						timeformat: ""
					},
					yaxis: {
						min: 0,
						max: server.swap_available,
						tickSize: server.swap_available / 2,
						tickFormatter: function (v, axis) {
							return Math.ceil(v) + " " + server.swap_unit;
						},
						labelWidth: 30
					}
			};
			
			var element_id = "#server_resources_table_" + counter + "_swap_history";
			plots[element_id] =  $.plot($(element_id), swap_history_series, swap_history_options);
			
			// Add the Disk chart
			var disk_series = [{data: []}];
			var disk_options = {
					series: {
						bars: {
							show: true,
							lineWidth: 0.1,
							fillColor: "rgba(199, 199, 35, 0.8)"
						}
					},
					bars: {
						align: "center",
						barWidth: 0.5,
						horizontal: true
					},
					xaxis: {
						min: 0,
						max: server.disk_available,
						tickFormatter: function (v, axis) {
							return  Math.ceil(v) + " " + server.disk_unit;
						},
						labelWidth: 40
					},
					yaxis: {
						tickFormatter: function (v, axis) {
							return "";
						},
						labelWidth: 30
					}
			};
			
			var element_id = "#server_resources_table_" + counter + "_disk_percentage";
			plots[element_id] =  $.plot($(element_id), disk_series, disk_options);
			
			//Add the Load chart
			var load_history_series = [{label: "1", data: [], color: "rgba(199, 180, 35, 1)"}, {label: "5", data: [], color: "rgba(199, 101, 35, 1)"}, {label: "15", data: [], color: "rgba(199, 35, 35, 1)"}];
			var load_history_options = {
					series: {
						lines: {
							show: true,
							fill: false,
							lineWidth: 2
						}
					},
					xaxis: {
						mode: "time",
						tickSize: [1, "minute"],
						timeformat: ""
					},
					yaxis: {
						min: 0,
						labelWidth: 30
					},
					legend: {
						noColumns: 0,
						position: "nw",
						backgroundOpacity: 0.5,
						margin: [0, 0],
						labelFormatter: function(label, series) {
							return "<span style=\"margin-right: 5px\">" + label + "</span>";
						}
					}
			};
			
			var element_id = "#server_resources_table_" + counter + "_load_history";
			plots[element_id] =  $.plot($(element_id), load_history_series, load_history_options);
			
			counter++;
		});
	}
	function update_server_resources(json_data) {
		var counter = 0; // DO NOT REMOVE - This is used when updating.
		json_data.server_resources.forEach(function (server) {
			var element_id = "#server_resources_table_" + counter + "_cpu";
			$(element_id).html("<span data-toggle=\"tooltip\" data-placement=\"top\" title=\"CPU Used by System\" >" + server.cpu_system_now + " %</span> " +
					"/ <span data-toggle=\"tooltip\" data-placement=\"top\" title=\"CPU Used by User\" >" + server.cpu_user_now + " %</span> ");
			element_id = "#server_resources_table_" + counter + "_cpu_history";
			update_plot(element_id, [server.cpu_system_history, server.cpu_user_history], [0,1]);
			
			element_id = "#server_resources_table_" + counter + "_ram";
			$(element_id).html("<span data-toggle=\"tooltip\" data-placement=\"top\" title=\"RAM Used\" >" + server.ram_now + " " + server.ram_unit + "</span> / "
					+ "<span data-toggle=\"tooltip\" data-placement=\"top\" title=\"RAM Available\" >" + server.ram_available + " " + server.ram_unit + "</span>");
			element_id = "#server_resources_table_" + counter + "_ram_history";
			update_plot(element_id, [server.ram_history], [0]);
			
			element_id = "#server_resources_table_" + counter + "_swap";
			$(element_id).html("<span data-toggle=\"tooltip\" data-placement=\"top\" title=\"Swap Used\" >" + server.swap_now + " " + server.swap_unit + "</span> / "
					+ "<span data-toggle=\"tooltip\" data-placement=\"top\" title=\"Swap Available\" >" + server.swap_available + " " + server.swap_unit + "</span>");
			element_id = "#server_resources_table_" + counter + "_swap_history";
			update_plot(element_id, [server.swap_history], [0]);
			
			element_id = "#server_resources_table_" + counter + "_disk";
			$(element_id).html("<span data-toggle=\"tooltip\" data-placement=\"top\" title=\"Disk Used\" >" + server.disk_used+ " " + server.disk_unit + "</span> / "
					+ "<span data-toggle=\"tooltip\" data-placement=\"top\" title=\"Disk Available\" >" + server.disk_available + " " + server.disk_unit + "</span>");
			element_id = "#server_resources_table_" + counter + "_disk_percentage";
			var disk_series = [[ server.disk_used, 0 ]];
			update_plot(element_id, [disk_series], [0]);
			
			element_id = "#server_resources_table_" + counter + "_load";
			$(element_id).html("<span data-toggle=\"tooltip\" data-placement=\"top\" title=\"1 min average\" >" + server.load_1min + "</span> " +
					"/ <span data-toggle=\"tooltip\" data-placement=\"top\" title=\"5 min average\" >" + server.load_5min + "</span> " +
					"/ <span data-toggle=\"tooltip\" data-placement=\"top\" title=\"15 min average\" >" + server.load_15min + "</span> ");
			element_id = "#server_resources_table_" + counter + "_load_history";
			update_plot(element_id, [server.load_1min_history, server.load_5min_history, server.load_15min_history], [0,1,2]);
			
			counter++;
		});
		
		// Enable the newly added tooltips.
		$('[data-toggle="tooltip"]').tooltip();
	}
	function update_plot(element_id, series_data, series_idxs) {
		var plot = plots[element_id];
		var series = plot.getData();
		var options = plot.getOptions();
		
		for (i = 0; i < series_idxs.length; i ++) {
			series[series_idxs[i]].data = series_data[i];
		}
		plots[element_id] =  $.plot($(element_id), series, options);
	}
	function get_server_resource_data(refresh) {
		if (window.location.hash != "#systemoverview" ||
			typeof $(".tabControl").data("ui-tabs") === "undefined" ||
			$(".tabControl").data("ui-tabs").active.data("title") !== "Server Resources") {
			return false;
		}
		var $parent = $("#tab_server_resources");
		hidePanelError($parent);
		$.ajax({
			url: baseApiUrl + "refresh/resources",
			type: "GET",
			success: function(response) {
				if (response.status === responseStatus.success) {
					var json_data = JSON.parse(response.data);
					if (json_data.server_resources != null) {
						$("#pnl_server_resources .dash-panel").removeClass("loading");
						if ($("#pnl_server_resources table.to_be_refreshed_when_needed").length != json_data.server_resources.length) {
							update_server_resources_layout(json_data);
						}
						update_server_resources(json_data);
						$("#pnl_server_resources .dash-panel").removeClass("loading");
						// Schedule the next request
						if (refresh) {
							setTimeout(function () { get_server_resource_data(refresh); }, get_server_resource_data_interval);
						}
					}
				} else {
					showPanelError($parent, response.message);
					if (refresh) {
						setTimeout(function () { get_server_resource_data(refresh); }, get_server_resource_data_interval);
					}
				}
			},
			error: function (jqXHR, textStatus, errorThrown) {
				showPanelError($parent, jqXHR.responseText);
				if (refresh) {
					setTimeout(function () { get_server_resource_data(refresh); }, get_server_resource_data_interval);
				}
			}
		});
	}
	
	// ======================== Current Jobs ======================== //
	var jsonJobsPage = 1;
	var get_current_job_data_interval = 60000;
	function update_current_jobs(json_data) {
		$("#pnl_current_jobs table:first tr.to_be_refreshed").remove();
		if (!json_data.current_jobs) {
			var new_row = "<tr class='to_be_refreshed'>" +
				"<td colspan='6' style='text-align:center;font-size:16px;font-weight:700;font-style:italic;padding:8px;background-color:whitesmoke'>No current jobs</td>" +
			"</tr>";
			$("#pnl_current_jobs table:first").append(new_row);
			return;
		}
		
		$.each(json_data.current_jobs, function (index, job) {
			var $tr = $("<tr class='to_be_refreshed'></tr>");
			$tr.data("dna", job);
			$tr.append("<td>" + job.id + "</td>");
			$tr.append("<td>" + job.processor + "</td>");
			$tr.append("<td>" + job.site + "</td>");
			$tr.append("<td>" + job.triggered_by + "<br/>" + job.triggered_on + "</td>");
			$tr.append("<td><div class='task-modules'><span class='task-status'>" + job.status + "</span><span class='task-progress-all'>" + job.tasks_completed + " / " + job.tasks_remaining + "</span></div></td>");
			$tr.append("<td><div class='task-buttons'></div></td>");
						
			if (job.current_tasks) {			
				var $modules = $(".task-modules", $tr);
				$.each(job.current_tasks, function (idx, task) {
					$modules.append("<span class='task-module"   + (task.current_task_steps_completed > 0 ? " done" : "") + "'>" + task.current_task_module + "</span>");
					$modules.append("<span class='task-progress" + (task.current_task_steps_completed > 0 ? " done" : "") + "'>" + task.current_task_steps_completed + "/" + task.current_task_steps_remaining + "</span>");
				});
			}
			var $buttons = $(".task-buttons", $tr);
			$.each(job.actions, function (idx, action) {
				switch (action) {
					case 1:
						$buttons.append('<button type="button" class="btn btn-warning btn-xs" onclick="perform_job_action(\'pause\', ' + job.id + ')">Pause</button>');
						break;
					case 2:
						$buttons.append('<button type="button" class="btn btn-success btn-xs" onclick="perform_job_action(\'resume\', ' + job.id + ')">Resume</button>');
						break;
					case 3:
						$buttons.append('<button type="button" class="btn btn-danger btn-xs" onclick="perform_job_action(\'cancel\', ' + job.id + ')">Cancel</button>');
						break;
				}
			});
			$("#pnl_current_jobs table:first tbody").append($tr);
		});
	}
	function perform_job_action(action, job_id) {
		$.ajax({
			url: baseApiUrl + "jobs/control?jobId=" + job_id + "&action=" + action,
			type: "POST",
			success: function(response) {
				if (response.status == responseStatus.success) {
					get_current_job_data();
				} else {
					alert(response.message);
				}
			},
			error: function (jqXHR, textStatus, errorThrown) {
				alert("Status: " + textStatus + "   Error: " + errorThrown);
			}
		});
	}
	function move_to_first_jobs_page() {
		jsonJobsPage = 1;
		get_current_job_data();
	}
	function move_to_previous_jobs_page() {
		if (jsonJobsPage > 1) {
			jsonJobsPage --;
			get_current_job_data();
		} else {
			jsonJobsPage = 1;
		}
	}
	function move_to_next_jobs_page() {
		if (!$("#page_move_next").hasClass("disabled")) {
			jsonJobsPage ++;
			get_current_job_data();
		}
	}
	function get_current_job_data(refresh) {
		if (window.location.hash != "#systemoverview" ||
			typeof $(".tabControl").data("ui-tabs") === "undefined" ||
			$(".tabControl").data("ui-tabs").active.data("title") !== "Current Jobs") {
			return false;
		}
		var $parent = $("#tab_current_jobs");
		hidePanelError($parent);
		$.ajax({
			url: baseApiUrl + "jobs/current/" + jsonJobsPage,
			type: "GET",
			success: function(response) {
				if (response.status == responseStatus.success) {
					var json_data = JSON.parse(response.data);
					update_current_jobs(json_data);
					$("#pnl_current_jobs").removeClass("loading");
					
					// display page number
					$("#page_current").html(jsonJobsPage);
					if (jsonJobsPage == 1) {
						$("#page_move_prev").addClass("disabled");
						$("#page_move_first").addClass("disabled");
					} else {
						$("#page_move_prev").removeClass("disabled");
						$("#page_move_first").removeClass("disabled");
					}            
					// toggle move_next button availability
					if (json_data.current_jobs.length < 5) {
						$("#page_move_next").addClass("disabled");
					} else {
						$("#page_move_next").removeClass("disabled");
					}
					
					// Schedule the next request
					if (refresh) {
						setTimeout(function () { get_current_job_data(refresh); }, get_current_job_data_interval);
					}
				} else {
					showPanelError($parent, response.message);
					if (refresh) {
						setTimeout(function () { get_current_job_data(refresh); }, get_current_job_data_interval);
					}
				}
			},
			error: function (jqXHR, textStatus, errorThrown) {
				showPanelError($parent, jqXHR.responseText);
				if (refresh) {
					setTimeout(function () { get_current_job_data(refresh); }, get_current_job_data_interval);
				}
			}
		});
	}
	
	// ======================== Monitoring ======================== //
	function get_monitoring_data(refresh) {
		if (window.location.hash != "#systemoverview" ||
			typeof $(".tabControl").data("ui-tabs") === "undefined" ||
			$(".tabControl").data("ui-tabs").active.data("title") !== "Monitoring") {
			return false;
		}
		$("#pnl_monitoring").addClass("loading");
		var $parent = $("#tab_monitoring");
		hidePanelError($parent);
		$.ajax({
			cache: false,
			url: "./fragments/monitoring.fragment.html",
			type: "GET",
			success: function(response) {
				$("#pnl_monitoring").removeClass("loading");
				$("#pnl_monitoring").html(response.replace('data-chash="#monitoring"', 'data-chash="#systemoverview"'));
			},
			error: function (jqXHR, textStatus, errorThrown) {
				$("#pnl_monitoring").removeClass("loading");
				showPanelError($parent, jqXHR.responseText);
			}
		});
	}

	function htmlEntities(str) {
		return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
	}
	function html_entity_decode(code) {
		return code;
    }
	function get_job_output(jobId) {
		var $parent = $("#tab_job_output");
		hidePanelError($parent);
		$("#pnl_job_output table:first tbody").empty();
        $.ajax({
            cache: false,
            url: baseApiUrl + "jobs/outputs/?jobId=" + jobId,
            type: "GET",
            success: function (response) {
                if (response.status === responseStatus.success) {
                    if (response.data && response.data.length > 0) {
                        
						$.each(response.data, function (index, job) {
						var status = job.exitCode;
						var execution_status = job.executionStatus;
                        switch (execution_status) {
                            case 1:     // "Submitted"
                            case 2:     // "PendingStart"
                                status = html_entity_decode("&#x231A;");   // WATCH
                                break;
                            case 3:     // "NeedsInput"
                                status = '⚠️️';   
                                break;
                            case 4:     // "Running"
                                status = html_entity_decode("&#x26A1;");   // HIGH VOLTAGE SIGN
                                break;
                            case 5:     // "Paused"
                                status = html_entity_decode("&#x270B;");     // RAISED HAND
                                break;
                            case 6:     // "Finished"
                                status += html_entity_decode("&#x274E;");  // NEGATIVE GREEN SQUARED CROSS MARK
                                break;
                            case 7:     // "Cancelled"
                                status = html_entity_decode("&#x26D4;"); // NO ENTRY
                                break;
                            case 8:     // "Error"
                                status += html_entity_decode("&#x274C;");      // CROSS MARK
                                break;
                            default:
                                status = html_entity_decode("&#x2753;"); // BLACK QUESTION MARK ORNAMENT
                                break;
							}

                            var $tr = $("<tr></tr>");
                            $tr.append("<td>" + job.stepName + "</td>");
                            $tr.append("<td><a class='copy-link'>[Copy to clipboard]</a><textarea class='hidden'>" + htmlEntities(job.command) + "</textarea></td>");
                            $tr.append("<td><a class='copy-link'>[Copy to clipboard]</a><textarea class='hidden'>" + htmlEntities(job.stdoutText) + "</textarea></td>");
                            $tr.append("<td><a class='copy-link'>[Copy to clipboard]</a><textarea class='hidden'>" + htmlEntities(job.stderrText) + "</textarea></td>");
							$tr.append("<td>" + status + "</td>");
                            
                            $("#pnl_job_output table:first tbody").append($tr);
                        });
                        $("#pnl_job_output").on("click", ".copy-link", function (e) {
                            $(this).addClass("hidden");
                            var textArea = $(this).next("textarea");
                            textArea.removeClass("hidden");
                            textArea.select();
                            document.execCommand("copy");
                            textArea.blur(function () {
                                $(this).addClass("hidden");
                                $(this).prev("a").removeClass("hidden");
                            });
                        });
                    }
                    else {
                        $("#pnl_job_output table:first tbody").html('<tr><td colspan="5" style="text-align:center;font-size:16px;font-weight:700;font-style:italic;padding:8px;background-color:whitesmoke">No data</td></tr>');
                    }
                }
                else {
                    showPanelError($parent.closest(".panel"), response.message);
                }

                $("#title_job_id").html(jobId);
                $("#tab_job_output_anchor").parent("li").removeClass("hidden");
                $("#tab_job_output_anchor").click();

            },
			error: function (jqXHR, textStatus, errorThrown) {
				showPanelError($parent, jqXHR.responseText);
                $("#title_job_id").html(jobId);
                $("#tab_job_output_anchor").parent("li").removeClass("hidden");
                $("#tab_job_output_anchor").click();
            }
        });
	}

	// ======================== START ======================== //
	$(document).ready(function() {			
		$(".tabControl").tabs({
			activate: function (event, ui) {
				var refresh = ($(".loading", ui.newPanel).length > 0);
				switch (ui.newPanel.get(0).id) {
					case "tab_server_resources":
						get_server_resource_data(refresh);
						break;
					case "tab_current_jobs":
						get_current_job_data(refresh);
						break;
					case "tab_monitoring":
						get_monitoring_data(refresh);
						break;
				}
			}
		});
		$(".tabControl").on("click", ".panel-title span", function (e) {
			$(this).closest(".dash-panel").addClass("loading");
			get_server_resource_data();
		})
		
		get_server_resource_data(true);	// get system resources with refresh after predefined interval
		get_current_job_data(true);		// get current jobs with refresh after predefined interval
		get_monitoring_data(true);		// get monitoring data with refresh after predefined interval
		
	});
//# sourceURL=systemoverview.js
</script>
