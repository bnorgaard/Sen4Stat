<div class="panel panel-resources">
    <div class="panel-heading">
        <h2 class="panel-title">Site manager</h2>
    </div>
    <div class="panel-body">
        <input type="button" name="addsite" class="add-edit-btn vspace" value="Create new site">
        <div class="panel-group">
            <div class="panel bevel" style="border:1px solid lightgray">
                <div id="div_addsite" style="display:none">
                    <!-- form add site -->
                    <form enctype="multipart/form-data" id="siteform_add" method="post" class="tspace vspace">
                        <input type="hidden" name="userId" />
                        <div class="form-group form-group-sm row">
                            <label class="control-label col-md-4">Site name:</label>
                            <div class="col-md-8">
                                <input type="text" class="form-control" name="name">
                            </div>
                        </div>
                        <div class="form-group form-group-sm row">
                            <label class="control-label col-md-4" style="color:gray">Seasons:</label>
                            <div class="col-md-8">
                                <h6 style="color:gray">Seasons can only be added/modified after site creation</h6>
                            </div>
                        </div>
						<div class="form-group form-group-sm row roi">
                            <label class="control-label col-md-4">Site shape file:</label>
                            <div class="col-md-8">
                                <input type="file" class="form-control" name="shapeFile">
                            </div>
							<div class="col-md-12">
								<div id="mapExtent" class=""></div>
							</div>
							<div class="col-md-12 latlon">
								<label class="col-md-3"><strong>Min Latitude </strong><input type="number" class="form-control" id="latmin" name="latlon" placeholder="Lat min" value="" /></label>
								<label class="col-md-3"><strong>Max Latitude </strong><input type="number" class="form-control" id="latmax" name="latlon" placeholder="Lat max" value="" /></label>
								<label class="col-md-3"><strong>Min Longitude</strong><input type="number" class="form-control" id="lonmin" name="latlon" placeholder="Lon min" value="" /></label>
								<label class="col-md-3"><strong>Max Longitude</strong><input type="number" class="form-control" id="lonmax" name="latlon" placeholder="Lon max" value="" /></label>
							</div>
							<div class="col-md-12 roiRegionSelection">
								<label class="col-md-3">
									<strong>Country </strong>
									<select id="roiCountry" class="form-control">
										<option value="" selected disabled> -- Select country -- </option>			
									</select>
								</label>
								<label class="col-md-3 hidden">
									<strong>Region </strong>
									<select id="roiRegion" class="form-control">
										<option value="" selected disabled> -- Select region -- </option>			
									</select>
								</label>
							</div>
                        </div>
                        <div class="form-group form-group-sm row">
                            <div class="col-md-12 error hidden">
                            </div>
                        </div>
                        <div class="submit-buttons">
                            <input class="add-edit-btn" type="submit" value="Save" />
                            <input class="add-edit-btn cancel-btn lspace" type="button" value="Abort" />
                        </div>
                    </form>
                </div>
                <div id="div_editsite" style="display:none">
                    <!-- form edit sites -->
                    <form id="siteform_edit" method="post" class="tspace vspace">
                        <input type="hidden" id="edit_siteid" name="edit_siteid" value="">
                        <input type="hidden" id="shortname" name="shortname" value="">
                        <div class="form-group row">
                            <h3 class="control-label col-md-12" id="edit_sitename">Site name:</h3>
                        </div>
                        <div class="form-group form-group-sm row">
                            <label class="control-label col-md-12">Enabled sensors:</label>
                            <div class="col-md-12 loading" id="site_tiles">
                                <img src="assets/dist/img/loader.gif" width="64px" height="64px">
                            </div>
                        </div>
                        <div class="form-group form-group-sm row">
                            <label class="control-label col-md-12">List of seasons:</label>
                            <div class="col-md-12 loading" id="site_seasons">
                                <img src="assets/dist/img/loader.gif" width="64px" height="64px">
                            </div>
                        </div>
                        <div class="form-group form-group-sm row">
                            <label class="control-label col-md-2" for="edit_enabled">Enable site:</label>
                            <div class="col-md-10">
                                <input type="checkbox" name="edit_enabled" id="edit_enabled">
                            </div>
                        </div>
                        <div class="form-group form-group-sm row">
                            <div class="col-md-12 error hidden">
                            </div>
                        </div>
                        <div class="submit-buttons" style="text-align:right">
                            <input class="add-edit-btn delete-btn" id="delete_site" type="button" value="Delete Site" style="float:left" />
                            <button class="add-edit-btn upload-btn lspace" id="upload_files"><span class="fa fa-cogs">&nbsp;</span>Upload Files</button>
                            <input class="add-edit-btn lspace" type="submit" value="Save Site" />
                            <input class="add-edit-btn cancel-btn lspace" type="button" value="Close" />
                        </div>
                    </form>
                </div>
                <div id="div_deletesite" style="display:none">
                    <!--  form delete site -->
                    <form id="siteform_delete" method="delete" class="tspace vspace">
                        <input type="hidden" class="form-control" name="siteId" value="">
                        <input type="hidden" class="form-control" name="siteShortName" value="">
                        <div class="form-group row">
                            <h3 class="control-label col-md-12" id="delete_sitename">Site name:</h3>
                        </div>
                        <div class="form-group form-group-sm row">
                            <label class="control-label col-md-12">Select which products types to be deleted along with the site:</label>
                            <div class="col-md-12">
                                <div class="col-md-1"></div>
                                <div class="col-md-11 loading" id="product_types">
                                    <img src="assets/dist/img/loader.gif" width="64px" height="64px">
                                </div>
                            </div>
                        </div>
                        <div class="form-group form-group-sm row">
                            <div class="col-md-12 error hidden">
                            </div>
                        </div>
                        <div class="submit-buttons">
                            <input class="add-edit-btn delete-btn left-btn" type="submit" value="Confirm Delete Site" style="float:left" />
                            <input class="add-edit-btn cancel-btn" type="button" value="Abort" />
                        </div>
                    </form>
                </div>
                <div id="div_uploadfiles" style="display:none">
                    <!--  form upload files -->
                    <div class="form-group form-group-sm row">
                        <h3 class="control-label col-md-12" id="upload_sitename">Site name:</h3>
                    </div>
                    <div class="form-group form-group-sm row tspace vspace">
                        <div>
                            <label class="control-label col-md-4">Season:</label>
                            <div class="col-md-8">
                                <select class="form-control" id="upload_season"></select>
                            </div>
                        </div>
                    </div>
                    <div class="form-group form-group-sm row tspace vspace unique-by-year">
                        <div>
                            <label class="control-label col-md-4">Year:</label>
                            <div class="col-md-8">
                                <input type="text" class="form-control" id="upload_year" name="upload_year" value="" readonly />
                            </div>
                        </div>
                    </div>
                    <div class="container-fluid">
                        <div id="upload_html_page"></div>
                        <div class="panel-group config" id="accordion"></div>
                        <div class="submit-buttons" style="margin:10px 0">
                            <input class="add-edit-btn cancel-btn" type="button" value="Close" />
                        </div>
                    </div>
                </div>
                <!-- list of sites -->
                <div class="panel">
                    <div class="panel-heading"><h3 class="panel-title">Sites list</h3></div>
                    <div class="panel-body">
                        <table id="sites" class="table table-striped">
                            <thead>
                                <tr>
                                    <th rowspan="2">Site name</th>
                                    <th rowspan="2">Short name</th>
                                    <th class="seasons">Seasons</th>
                                    <th rowspan="2" style="text-align:center">Edit</th>
                                    <th rowspan="2">Enabled</th>
                                </tr>
                                <tr>
                                    <th>
                                        <table class="subtable"><thead><tr><th>Season name</th><th>Season start</th><th>Season mid</th><th>Season end</th><th>Enabled</th></tr></thead><tbody></tbody></table>
                                    </th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <hr />
    </div>
</div>
<div class="error-notification">
    <div class="error main hidden">
    </div>
</div>

<link href="assets/libs/bootstrap-switch/3.3.2/bootstrap-switch.min.css" rel="stylesheet" type="text/css" />
<script src="assets/libs/bootstrap-switch/3.3.2/bootstrap-switch.min.js"></script>
<!-- includes for validate form -->
<script src="assets/libs/jquery-validate/1.14.0/jquery.validate.min.js"></script>
<script src="assets/libs/jquery-validate/1.14.0/additional-methods.min.js"></script>

<script type="text/javascript">
    // ======================== PUBLIC SITES FUNCTIONS ======================== //
    function purgeAllSitesDialogs() {
        purgeUiDialog("div_addsite");
        purgeUiDialog("div_editsite");
        purgeUiDialog("div_deletesite");
        purgeUiDialog("div_uploadfiles");
    }
    // ======================== DOCUMENT READY ======================== //
    $(document).ready(function () {
		var clearSelections = true;
		var clearShapefile = true;
		var roiIgnoreLevels = []
	
        var getSites = function (userId) {
            return $.ajax({
                cache: false,
                url: baseApiUrl + "sites/" + (userId ? "?userId=" + userId : ""),
                type: "GET"
            });
        };
        var getSite = function (siteId) {
            return $.ajax({
                cache: false,
                url: baseApiUrl + "sites/" + siteId,
                type: 'GET',
            });
        };
        var getSiteSeasons = function (siteId) {
            return $.ajax({
                cache: false,
                url: baseApiUrl + "sites/seasons?site=" + siteId,
                type: 'GET'
            });
        };
        var getProductTypes = function (userId) { // TODO implementation for userId
            return $.ajax({
                cache: false,
                url: baseApiUrl + "products/types/",
                headers: { "content-type": "application/json" },
                type: 'GET'
            });
        };
        var getRegions = function (){
			return $.ajax({
				beforeSend: function(xhr) { xhr.setRequestHeader("X-Auth-Token", window.tokenKey); },
				cache: false,
				async: false,
				url  : baseApiUrl + "rois/countries",
				type : "GET"
			});
		}
		
        function getSiteSeasonsHtml(seasons, $parent) {
            $parent.html("");
            var $container = (seasons.length == 0) ? $("<span>-</span>") : $('<table class="subtable"></table>');
            $.each(seasons, function (index, season) {
                // Create a table line for each site in list
                var tr = '<tr class="season" data-id="' + season.id + '">' +
                    '<td>' + season.name + '</td>' +
                    '<td>' + season.startDate + '</td>' +
                    '<td>' + season.midDate + '</td>' +
                    '<td>' + season.endDate + '</td>' +
                    '<td><input type="checkbox" class="season-enabled"></td>' +
                    '</tr>';
                var $tr = $(tr);
                $('input.season-enabled', $tr)
                    .prop("checked", season.enabled)
                    .bootstrapSwitch({
                        size: "mini",
                        onColor: "success",
                        offColor: "default",
                        disabled: true,
                        handleWidth: 25
                    });
                $container.append($tr);
            });
            $parent.append($container);
        }
        function getSitesHtml(sites, $parent) {
            hidePanelError(".error-notification");

            $parent.html("");
            $.each(sites, function (index, site) {
                // Create a line for each site in the list
                var tr = '<tr class="site" data-id="' + site.id + '">' +
                    '<td>' + site.name + '</td>' +
                    '<td>' + site.shortName + '</td>' +
                    '<td class="seasons"></td>' +
                    '<td><a class="site-edit">Edit</a></td>' +
                    '<td><input type="checkbox" class="site-enabled"></td>' +
                    '</tr>';
                var $tr = $(tr);
                $('input.site-enabled', $tr)
                    .prop("checked", site.enabled)
                    .bootstrapSwitch({
                        size: "mini",
                        onColor: "success",
                        offColor: "default",
                        disabled: true,
                        handleWidth: 25
                    });

                // Change row style when starting site editing
                $('a.site-edit', $tr)
                    .on("click", function (e) {
                        $("tr.site", $parent).removeClass("editing");
                        $tr.addClass("editing");
                        openEditSiteDialog(site.id);
                    });

                // Get site seasons
                $.when(getSiteSeasons(site.id))
                    .done(function (response) {
                        if (response.status === responseStatus.success) {
                            getSiteSeasonsHtml(response.data, $("td.seasons", $tr));
                        } else {
                            showPanelError(".error-notification", response.message, true);
                        }
                    })
                    .fail(function (jqXHR, textStatus, errorThrown) {
                        showPanelError(".error-notification", jqXHR.responseText, true);
                    });
                $tr.data("dna", site);
                $parent.append($tr);
            });
        }
        function refreshSiteHtml(siteId, $parent) {
            hidePanelError(".error-notification");

            var $tr = $('tr[data-id="' + siteId + '"]:not(.hidden)', $parent);
            if ($tr.length > 0) {
                $.when(getSite(siteId), getSiteSeasons(siteId))
                    .done(function (responseSite, responseSeasons) {
                        var site = responseSite[0];
                        var seasons = responseSeasons[0];
                        if (site.status === responseStatus.success && seasons.status === responseStatus.success) {
                            // Update site data
                            $tr.data("dna", site.data);

                            // Refresh site
                            $('input.site-enabled', $tr)
                                .prop("checked", site.data.enabled)
                                .bootstrapSwitch('destroy', true)
                                .bootstrapSwitch({ size: "mini", onColor: "success", offColor: "default", disabled: true, handleWidth: 25 });

                            // Refresh seasons list
                            getSiteSeasonsHtml(seasons.data, $("td.seasons", $tr));
                        } else {
                            var msg = (site.status === responseStatus.success ? "" : site.message);
                            msg += (seasons.status === responseStatus.success ? "" : (msg == "" ? "" : "<br>") + seasons.message);
                            showPanelError(".error-notification", msg);
                        }
                    })
                    .fail(function (jqXHR, textStatus, errorThrown) {
                        showPanelError(".error-notification", jqXHR.responseText);
                    });
            }
        }
        function getProductTypesHtml(productTypes, $parent) {
            $parent.html("");
            $.each(productTypes, function (index, ptype) {
                // Create a table line for each site in list
                var pt = '<div class="row product-type">' +
                    '<label class="control-label col-md-4" for="delete_chk' + ptype.shortName + '">' +
                    '<input id="delete_chk' + ptype.shortName + '" type="checkbox" name="delete_chk' + ptype.shortName + '" value="' + ptype.id + '" />' + ptype.shortName +
                    '</label>' +
                    '<div class="col-md-8">' +
                    '<span>' + ptype.description + '</span>' +
                    '</div>' +
                    '</div>';
                var $pt = $(pt);
                $parent.append($pt);
            });
            refreshDialogPosition($parent.closest(".ui-dialog-content"));
        }
        function openAddNewSiteDialog() {
            // open add site dialog and close all others
            $(".ui-dialog-content:not(#div_addsite)").dialog("close");
            $("#div_addsite").dialog("open");
        }
        function openEditSiteDialog(siteId) {
            var site = $("tr.site[data-id=" + siteId + "]", "#sites").data("dna");
            $("#edit_sitename").html(site.name);
            $("#edit_siteid").val(site.id);
            $("#shortname").val(site.shortName);
            $("#edit_enabled").bootstrapSwitch('state', site.enabled);

            // set editing variables
            $("#div_editsite").data("dna", site);

            // Get site tiles
            $.ajax({
                cache: false,
                url: "fragments/site.tiles.fragment.html",
                type: "GET",
                dataType: "html",
                success: function (data) {
                    $("#site_tiles", "#div_editsite").removeClass("loading").html(data);
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    console.log("Status: " + textStatus + "   Error: " + errorThrown);
                }
            });

            // Get site seasons
            $.ajax({
                cache: false,
                url: "fragments/site.seasons.fragment.html",
                type: "GET",
                dataType: "html",
                success: function (data) {
                    $("#site_seasons", "#div_editsite").removeClass("loading").html(data);
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    console.log("Status: " + textStatus + "   Error: " + errorThrown);
                }
            });

            // Get uploaded files
            $.ajax({
                cache: false,
                url: "fragments/site.uploads.fragment.html",
                type: "GET",
                dataType: "html",
                success: function (data) {
                    $("#upload_html_page", "#div_uploadfiles").html(data);
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    console.log("Status: " + textStatus + "   Error: " + errorThrown);
                }
            });

            $("#accordion").collapse('hide');
            $("#accordion").on("hidden.bs.collapse shown.bs.collapse", function (e) {
                $(this).closest(".ui-dialog").position({
                    my: "center",
                    at: "center",
                    of: "#div_editsite",
                    collision: "fit",
                    // Ensure the titlebar is always visible
                    using: function (pos) {
                        var topOffset = $(this).css(pos).offset().top;
                        if (topOffset < 0) {
                            $(this).css("top", pos.top - topOffset);
                        }
                    }
                });
            });

            // open edit site dialog and close all others
            $(".ui-dialog-content:not(#div_editsite)").dialog("close");
            $("#div_editsite").dialog("open");
        }
        function openDeleteSiteDialog() {
            var form = $("#siteform_delete").get(0);
            hidePanelError(form);

            var site = $("#div_editsite").data("dna");
            $('input[name="siteId"]', "#div_deletesite").val(site.id);
            $('input[name="siteShortName"]', "#div_deletesite").val(site.shortName);
            $('#delete_sitename', "#div_deletesite").html(site.name);
            $("label", "#div_deletesite").removeClass("selected");

            // Get product types (needed when deleting site along with products of a certain type)
            $.when(getProductTypes())
                .done(function (response) {
                    if (response.status === responseStatus.success) {
                        $("div#product_types").removeClass("loading");
                        getProductTypesHtml(response.data, $("div#product_types"));
                    } else {
                        showPanelError(form, response.message);
                    }
                })
                .fail(function (jqXHR, textStatus, errorThrown) {
                    showPanelError(form, jqXHR.responseText);
                });

            // open delete dialog
            $("#div_deletesite").dialog("open");
        }
        function changeUploadSeason(seasonData) {
            openUploadSiteFilesDialog({ 'uniqueBy': 'Season', 'uniqueData': seasonData });
        }
        function openUploadSiteFilesDialog(selectedSeasonId) {
            var site = $("#div_editsite").data("dna");

            $.when(getSiteSeasons(site.id))
                .done(function (response) {
                    if (response.status === responseStatus.success) {

                        var selectedSeason = null;
                        if (selectedSeasonId == 0) {
                            selectedSeason = response.data[0];
                            $("#upload_season").empty();
                            $.each(response.data, function (index, season) {
                                $("#upload_season").append('<option value="' + season.id + '">' + season.name + '</option>');
                            });
                        }
                        else {
                            $.each(response.data, function (index, season) {
                                if (season.id == selectedSeasonId) {
                                    selectedSeason = season;
                                }
                            });
                        }

                        $(".unique-by-year", "#div_uploadfiles").addClass("hidden");
                        //$(".unique-by-season", "#div_uploadfiles").addClass("hidden");
                        if ($("#div_editsite").hasClass("uniqueByYear")) {

                            //set dominant year and show
                            $("#upload_year").val(getSeasonDominantYear(selectedSeason.startDate, selectedSeason.endDate));
                            $("#upload_year").removeClass("collapse");

                            $(".unique-by-year", "#div_uploadfiles").removeClass("hidden");
                            if (typeof getUploadDescriptorsByYear !== "undefined" && typeof getUploadSiteFiles !== "undefined") {
                                $("#upload_sitename", "#div_uploadfiles").html(site.name);
                                //$("#upload_year"    , "#div_uploadfiles").val(descriptor.uniqueData);
                                closeDialog($("#div_uploadfiles"));
                                $.when(getUploadDescriptorsByYear(site.id, $("#upload_year").val()/*descriptor.uniqueData*/))
                                    .done(function (response) {
                                        if (response.status === responseStatus.success) {
                                            descriptors = response.data;
                                            getUploadSiteFiles(descriptors);
                                            $.each(descriptors, function (descIdx, desc) {
                                                $.each(desc.files, function (fileIdx, file) {
                                                    $.each(file.operations, function (operationIdx, operation) {
                                                        $.each(operation.parameters, function (paramIdx, param) {
                                                            if (param.name == "year" && !param.label) {
                                                                $("#upload_year").attr("data-is-param-set", "true");
                                                            }
                                                        });
                                                    });
                                                });
                                            });
                                            // open add site dialog and close all others
                                            $("#div_uploadfiles").dialog("open");
                                        }
                                    });

                            }
                        } else {
                            //$(".unique-by-season", "#div_uploadfiles").removeClass("hidden");
                            if (typeof getUploadDescriptorsBySeason !== "undefined" && typeof getUploadSiteFiles !== "undefined") {
                                $("#upload_sitename", "#div_uploadfiles").html(site.name);
                                //$("#upload_season_name", "#div_uploadfiles").html(descriptor.uniqueData.name + " [" + descriptor.uniqueData.startDate + " &raquo; " + descriptor.uniqueData.endDate + " ]");
                                //hide year
                                $("#upload_year").addClass("collapse");
                                $("#upload_year").val("");

                                closeDialog($("#div_uploadfiles"));
                                $.when(getUploadDescriptorsBySeason(site.id, $("#upload_season").val()))

		var getPoligon = function (form) {
			return $.ajax({
				beforeSend: function(xhr) { xhr.setRequestHeader("X-Auth-Token", window.tokenKey); },

		function drawRectangle(latmin, latmax, lonmin, lonmax, source) {
		   
			var polyCoords = [];
			var p1 = lonmin + "," + latmin;
			var p2 = lonmax + "," + latmin;
			var p3 = lonmax + "," + latmax;
			var p4 = lonmin + "," + latmax;
			var coords = (p1 + " " + p2 + " " + p3 + " " + p4).split(' ');
			for (var i in coords) {
				var c = coords[i].split(',');
				polyCoords.push(ol.proj.transform([parseFloat(c[0]), parseFloat(c[1])], 'EPSG:4326', 'EPSG:3857'));
			}
		   
			var feature = new ol.Feature({
				geometry: new ol.geom.Polygon([polyCoords])
			});
			feature.setProperties({"extraFeatureDescription": "preview"});
			source.clear();
			source.addFeature(feature);
		   
			return feature;
		}
		
		function iterateToFindWKT (data, regionName, level, currentLevel) {
			var found;
				$.each(data, function (index, object) {
					if (currentLevel < level) {
						found = iterateToFindWKT (object.regions, regionName, level, currentLevel + 1);
						if (typeof found !== "undefined") {
							return false;
						}
					} else {
						if (typeof object.regions !== "undefined" && object.regions !== null) {
							found = object.regions.find(element => element.name === regionName);
							if (typeof found !== "undefined") {
								return false;
							}
						}
					}
				});
			return found;
		}
		
		function findWKT (data, regionName, level) {
			var found;
			if (level === 1) {
					found = data.find(element => element.name === regionName);
				}
				if (level >= 2) {
					found = iterateToFindWKT (data, regionName, level, 2);
				}
			return found.extentPolygon;
		}

		function filterRoi (selection) {
			var parentIndex = selection.attr("data-parent-index");
			var selectionId = selection.parent().attr("id");
			
			var nextLevelElement = $("#" + selectionId).closest("label").next();
			if (nextLevelElement.length > 0) {
				$("option",nextLevelElement).removeClass("keep hidden");
				$("option[value!='']",nextLevelElement).prop("selected",false);
				$("option[value='']",nextLevelElement).prop("selected",true);
				var elementId = nextLevelElement.find("select").attr("id");
				//variable used to keep the removed options, in order to add them later
				var hiddenOptions = "";
				$("#" + elementId).find("option[data-parent-index='" + selection.val() +"']").addClass("keep");//mark those elements that needs to be kept
				//remove unmarked elements and add the to hiddenOptions variable
				$("#" + elementId).find("option:not(.keep)[value!='']").remove().map(function(){hiddenOptions+=$(this).addClass("hidden").prop('outerHTML')});
				//add the removed elements on the end of the select element
				$("#" + elementId).append(jQuery.parseHTML(hiddenOptions));
				$("#" + elementId).find("option[value='']").prop('selected', true);
				//if next level element has data (except the option with no value) and is hidden, remove hidden class;
				if (nextLevelElement.hasClass("hidden") && $("#" + elementId).find("option:not(.hidden)").length > 1) {
					nextLevelElement.removeClass("hidden");
				} else if ($("#" + elementId).find("option:not(.hidden)").length < 2) {//if next level element does not have data (except the option with no value) add hidden class
					nextLevelElement.addClass("hidden");
				}
				filterRoi(nextLevelElement);
			}
			
			var prevElement = $("#" + selectionId).closest("label").prev();
			if (prevElement.length > 0) {
				selectRoi(prevElement.find("select").attr("id"), parentIndex);
			} else {
				selection.nextAll("label").addClass("hidden");
			}
		}

					var drawnFeatures = _map.getAllFeatures().getArray();
					if (drawnFeatures.length > 0) {
						var extent = drawnFeatures[0].getGeometry().getExtent();
						var transedExtent = ol.proj.transformExtent(extent, "EPSG:3857", "EPSG:4326");
						if (clearSelections) {
							resetSelections();
						}
						$("#latmin").val(transedExtent[1]);
						$("#latmax").val(transedExtent[3]);
						$("#lonmin").val(transedExtent[0]);
						$("#lonmax").val(transedExtent[2]);
						// when shape is drawn on map remove error for all ROI fields
						$(".roi", "#div_addsite").find("label.error").remove();
						$(".roi div.has-error", "#div_addsite").removeClass("has-error");
					}else {
						clearRegionOfInterest();
					}
				});
			});
		}
    });
//# sourceURL=sites.js
</script>
