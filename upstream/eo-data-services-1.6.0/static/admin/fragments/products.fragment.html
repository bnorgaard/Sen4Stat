<section class="dialogs">
	<div id="sites_browser">
		<div class="treeview-holder panel flexible-panel">
			<div class="panel-heading">
				<h3 class="panel-title">Product browser</h3>
				<span class="glyphicon glyphicon-filter panel-control filter rspace" title="Filters"></span>
				<span class="glyphicon glyphicon-refresh panel-control filter-reset" title="Reset filters"></span>
			</div>
			<div class="treeview sub panel-body"></div>
		</div>
	</div>
	<div id="search_filters" class="file">
		<div id="sites_names" class="panel fixed-panel">
			<div class="panel-heading"><h3 class="panel-title">Site Name</h3></div>
			<div class="panel-body">
				<select id="siteName" name="sites[]" multiple="multiple">
					<option value="">Select sites</option>
				</select>
			</div>
		</div>
		<div id="sensor_type" class="panel flexible-panel">
			<div class="panel-heading">
				<h3 class="panel-title">Sensor & Product Type</h3>
			</div>
			<div class="panel-body">
				<div class="searchSensor">
					<div class="checkboxGroup filter-group">
						<label><input type="checkbox" id="S1" name="sensor" value="3" checked="checked" />S1<div class="checkbox-container"><span class="checkbox"></span></div></label>
						<label><input type="checkbox" id="S2" name="sensor" value="1" checked="checked" />S2<div class="checkbox-container"><span class="checkbox"></span></div></label>
						<label><input type="checkbox" id="L8" name="sensor" value="2" checked="checked" />L8<div class="checkbox-container"><span class="checkbox"></span></div></label>
					</div>
				</div>
				<div class="searchProductType">
					<div class="checkboxGroup"></div>
				</div>
			</div>
		</div>
		<div id="range_filters" class="panel fixed-panel">
			<div class="panel-heading">
				<h3 class="panel-title">Filters</h3>
			</div>
			<div class="panel-body">
				<div class="searchTiles filter-group">
					<label class="group-left">Tiles</label>
					<div class="group-right"><input name="tiles" type="text" class="form-control" disabled="disabled" /></div>
				</div>
				<div class="searchInterval">
					<div class="checkboxGroup filter-group">
						<label class="group-left"><input type="checkbox" id="optseason" name="optseason" value="season" disabled="disabled" />Season<div class="checkbox-container"><span class="checkbox"></span></div></label>
						<div class="group-right">
							<select id="choose_season" name="choose_season" class="form-control" disabled="disabled"><option value="">Select season</option></select>
						</div>
					</div>
					<div class="checkboxGroup filter-group">
						<label class="group-left"><input type="checkbox" id="optinterval" name="optinterval" value="interval" />Interval<div class="checkbox-container"><span class="checkbox"></span></div></label>
						<div class="group-right">
							<input type="text" name="interval_from" class="form-control inlineDatepicker" value="" />
							&nbsp;&#9654;&nbsp;
							<input type="text" name="interval_to" class="form-control inlineDatepicker" value="" />
						</div>
					</div>
				</div>
			</div>
		</div>
		<div id="search_button" class="fixed-panel">
			<button name="search" class="btn add-edit-btn btn-cancel">Search</button>
		</div>					
	</div>
	<div id="properties">
		<div class="attributes-holder panel flexible-panel">
			<div class="panel-heading">
				<h3 class="panel-title">Attributes</h3>
				<span class="glyphicon glyphicon-chevron-up panel-control min"></span>
				<span class="glyphicon glyphicon-chevron-down panel-control max"></span>
			</div>
			<div class="panel-body">
				<table class="table table-striped table-hover"><thead></thead><tbody></tbody></table>
				<div class="imagepreview-holder hidden"><div><span class="fa fa-expand fa-fw full-preview"></span><img src=""></div></div>
			</div>
		</div>
		<div class="actions-holder panel fixed-panel">
			<div class="panel-heading">
				<h3 class="panel-title">Actions</h3>
			</div>
			<div class="panel-body">
				<table class="actions-set for-files">
					<tr class="action download-holder">
						<td><span class="action-name">Download</span></td>
						<td><span class="action-info"></span></td>
						<td><a class="download" href="#"><button class="btn btn-md add-edit-btn btn-download" disabled="disabled"><i class="fa fa-download fa-fw"></i> Download</button></a></td>
					</tr>
					<tr class="action markers-holder">
						<td><span class="action-name">Markers</span></td>
						<td><span class="action-info"></span></td>
						<td><button class="btn btn-md add-edit-btn btn-markers" disabled="disabled"><i class="fa fa-line-chart fa-fw"></i> Show Markers</button></td>
					</tr>
					<tr class="action search-holder">
						<td><span class="action-name">Search</span></td>
						<td><span class="action-info"></span><input type="text" name="parcel_id" placeholder="Ori_id" style="width:100%" /></td>
						<td><button class="btn btn-md add-edit-btn btn-search"><i class="fa fa-search fa-fw"></i> Search Parcel</button></td>
					</tr>
				</table>
				<div class="error hidden"></div>
			</div>
		</div>
		<div class="options-holder panel fixed-panel">
			<div class="panel-heading">
				<h3 class="panel-title">Options</h3>
			</div>
			<div class="panel-body">
				<div class="optionTimeline for-vector">
					<div class="checkboxGroup option-group">
						<label class="group-left"><input type="checkbox" id="showTimeline" name="showTimeline" value="enableTimeline" />Timeline<div class="checkbox-container"><span class="checkbox"></span></div></label>
						<div class="group-right">
							<select id="choose_productType" name="choose_productType" class="form-control" disabled></select>
						</div>
					</div>
				</div>
				<div class="error hidden"></div>
			</div>
		</div>
	</div>
	<div id="graph_full_screen">
		<div class="markers-holder panel fixed-panel">
			<div class="panel-heading"><h3 class="panel-title">Markers</h3></div>
			<div class="panel-body">
				<div class="search-markers form-group">
					<input type="text" name="search_markers" class="form-control" placeholder="Search" />
					<span class="glyphicon glyphicon-remove icon hidden"></span>
					<span class="glyphicon glyphicon-refresh selection-reset" title="Reset selection"></span>
				</div>
				<div class="markersGroup"></div>
			</div>
		</div>
		<div id="graph_to_export" class="graph-holder panel flexible-panel">
			<div class="panel-heading"><h3 class="panel-title">Selection</h3><span class="graph-info">A selected and not displayed marker has no values for the selected parcel</span></div>
			<div class="panel-body">
				<div id="graph_container_full_screen" class="chart"></div>
				<div id="graph_legend"></div>
				<div id="export_button"><button class="export-chart btn btn-success btn-xs">Export chart</button></div>
			</div>
		</div>
	</div>
	<div id="parcel_full_screen" style="outline-color:orange">
		<img src="" />
	</div>
</section>
<section id="mapExtent" class="hidden"></section>
<section class="treeview-loading"><img src="assets/dist/img/loader.gif" /></section>
<!-- Template -->
<div style="display:none" id="markersGroup_content_template">
	<p style="white-space:nowrap"></p>
	<div class="checkboxGroup markers"></div>

<style>
	/* Scrollbar */
	*::-webkit-scrollbar{width:8px;height:8px;background-color:#f0f0f0}
	*::-webkit-scrollbar-thumb{border:0px solid transparent;border-radius:0px;background-clip:content-box;background-color:#c0c0c0}
	
	.thin-scrollbar::-webkit-scrollbar,
	.thin-scrollbar::-webkit-scrollbar:horizontal{width:6px;height:6px;background-color:transparent}
	.thin-scrollbar::-webkit-scrollbar-thumb,
	.thin-scrollbar::-webkit-scrollbar-thumb:horizontal{background-color:#777}
	
	.scroll-at-left{direction:rtl}
	.scroll-at-left>*{direction:ltr}
	.scroll-at-left.scroll-bar-outside>*{width:calc(100% + 15px)!important;margin-right:-15px!important}
	.scroll-at-left::-webkit-scrollbar,
	.scroll-at-right::-webkit-scrollbar,
	.scroll-at-top::-webkit-scrollbar:horizontal,
	.scroll-at-bottom::-webkit-scrollbar:horizontal{border-radius:4px}
	.scroll-at-left::-webkit-scrollbar-thumb,
	.scroll-at-right::-webkit-scrollbar-thumb,
	.scroll-at-top::-webkit-scrollbar-thumb:horizontal,
	.scroll-at-bottom::-webkit-scrollbar-thumb:horizontal{border:2px solid transparent;border-radius:4px}
</style>

	.layout-sm{overflow:hidden}
	.layout-sm #header{display:none}

	.treeview-loading{position:fixed;width:auto;top:160px;left:48%;left:calc(50% - 40px);background:#ffffffc7;border:1px solid #aad3df;border-radius:20px;margin:0;padding:20px}
	.treeview-loading img{width:60px;height:60px;border:0;margin:0}

	#main2 .full-screen img{position:absolute;top:0;bottom:0;left:0;right:0;margin:auto;width:auto;border:5px solid rgba(255, 255, 255, 0.3);border-radius:5px;max-width:100%;max-height:100%}
	
	.clean-slate{opacity:0.95;height:auto!important}

<style>
	/* Sites Browser */
	#sites_browser{font-family:"Roboto Condensed",Arial,Helvetica,sans-serif}
	#sites_browser .treeview{padding-left:25px;padding-bottom:25px;min-height:50vh}
	#sites_browser input[type="checkbox"]{display:none}
	#sites_browser a{display:block;cursor:pointer;padding:0 7px 0 0;line-height:1.8em;max-height:1.8em;white-space:nowrap;margin-right:10px;width:auto;width:max-content}
	#sites_browser a:hover,
	#sites_browser a.selected{color:var(--color-default);background-color:var(--table-hover-bg-color)}
	#sites_browser a span{float:right;padding:0 10px 0 7px;width:110px;text-align:right;color:#5c5d5e}
	#sites_browser label>a{font-weight:400;font-size:1.6rem;line-height:2.8rem}
	#sites_browser .fa{float:none;width:30px;color:var(--color-default)}
	#sites_browser .fa-folder{color:#ffb85d}
	#sites_browser label{position:relative;color:#5c5d5e;display:block;margin-bottom:0}
	#sites_browser label::before{content:'\f105';margin-left:0;display:block;position:absolute;top:2px;left:-17px;font-family:'FontAwesome';font-size:2rem;padding:0 7px;color:#5c5d5e;opacity:0.3}
	#sites_browser input:checked+label::before{content:'\f107';margin-left:-3px}
	#sites_browser input:checked+label .fa-folder::before{content:'\f07c'}
	#sites_browser .treeview:hover div>label::before{opacity:0.3}
	#sites_browser .treeview:hover input:checked+label::before{opacity:1}
	#sites_browser input~.sub{display:none;margin-left:22px}
	#sites_browser input:checked~.sub{display:inline-block}
	#sites_browser input:checked~.sub.loading,
	#sites_browser input:checked~.sub.empty{height:auto}
	#sites_browser input:checked~.sub.empty::after{content:"Empty...";color:#b1d3e6;width:100%;display:block;padding:0 10px;text-align:left;font-size:0.8em;line-height:16px}
	#sites_browser input:checked~.sub.loading::after{content:"Loading...";color:red;width:100%;display:block;padding:0 10px;text-align:left;font-size:1em;line-height:16px}
	#sites_browser input:checked~.sub.loading.failed::after{content:"Loading failed...";color:#da0000;font-weight:700}
	#sites_browser label.select-for{position:absolute;margin:0;top:0;left:0;width:23px;height:25px;cursor:pointer}
	#sites_browser label.select-for::before{position:absolute;left:7px;top:9px;content:"\002713";line-height:0;padding:0;opacity:0}
	#sites_browser label.select-for::after{content:'';position:absolute;width:13px;height:13px;border:1px solid rgba(89,161,185,0.25);left:6px;top:5px}
	#sites_browser label.select-for~a{margin-left:23px}
	#sites_browser label.select-for.checked::after{border:1px solid #59a1b9}
	#sites_browser label.select-for.checked::before{color:#ff7000;opacity:1}
	#sites_browser label.select-for:hover::after{border:1px solid #59a1b9}
	#sites_browser label.select-for.checked:hover::after{border:1px solid #ff7000}
	#sites_browser .has-selectable-for>div>label>a>span.fa-folder{margin-left:-2px}
	#sites_browser .has-selectable-for>div>.sub{margin-left:43px}
	#sites_browser .fa-fw{margin-right:5px}
	#sites_browser .treeview.compact{width:75%}
	#sites_browser a.unavailable,
	#sites_browser a.unavailable span,
	#sites_browser a.unavailable .fa{opacity:0.5}
	#sites_browser .treeview .scroll-at-left{max-height:22.5em;overflow-y:auto}
	
	.ui-dialog .ui-dialog-title{white-space:break-spaces;}
</style>
<style>
	/* Search Filters */
	#search_filters{font-size:14px;font-family:"Roboto Condensed",Arial,Helvetica,sans-serif;max-height:calc(100vh - 180px)!important;}
	#search_filters .panel-body{padding:10px}
	#search_filters .select2-container--default .select2-selection--multiple{border-color:var(--table-border-color);line-height:22px}
	#search_filters .select2-selection__choice{background-color:var(--color-default);color:white;line-height:20px}
	#search_filters .select2-container--default .select2-selection--multiple .select2-selection__choice__remove{font-size:18px;color:white;line-height:18px}
	#search_filters .select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover{color:red}
	#search_filters .checkboxGroup>label{position:relative;cursor:pointer;font-weight:400;padding-left:20px;line-height:20px;margin:0}
	#search_filters .checkboxGroup>label input[type="checkbox"]{display:none}
	#search_filters .checkboxGroup>label .checkbox-container{width:13px;height:13px;position:absolute;top:3px;left:0;background:#fff;border:1px solid #bcbcbc}
	#search_filters .checkboxGroup>label:hover input[type="checkbox"]:not(:disabled)+.checkbox-container{border-color:var(--color-default)}
	#search_filters .checkboxGroup>label input[type="checkbox"]:disabled +.checkbox-container{opacity:0.3}

	#search_filters .checkboxGroup>label input[type="checkbox"]:checked+.checkbox-container .checkbox{background-color:var(--color-default)}
	#search_filters .searchSensor{border-bottom:1px dashed var(--table-border-color);margin-bottom:10px;background-color:rgba(128,128,128,0.08);margin:-10px -10px 10px -10px;padding:7px 10px}
	#search_filters .searchSensor      .checkboxGroup>label{font-size:16px;padding-right:10px}
	#search_filters .searchProductType .checkboxGroup{column-count:2}
	#search_filters .searchProductType .checkboxGroup>label{display:block;margin-bottom:5px;font-size:12px;line-height:15px;padding-top:3px}
	#search_filters .filter-group .form-control{font-size:14px;padding:4px 7px;height:auto;font-family:"Roboto Condensed",Arial,Helvetica,sans-serif}
	#search_filters .filter-group>.group-left{width:30%;float:left;font-weight:700}
	#search_filters .filter-group>.group-right{width:70%;float:right}
	#search_filters .filter-group::after{display:table;content:" ";clear:both;margin-bottom:10px}
	#search_filters .filter-group:last-child::after{content:none}
	#search_filters .inlineDatepicker{width:12ch;display:inline}
	#search_filters button[name='search']{width:100%;text-transform:uppercase;height:2.6em}
	#myFlatMap .search-markers input, #myFlatMap .search-markers h4{display: inline;padding-right: 10px;}
</style>

function isElementVisible(element) {
	var $element = $(element);
	var $parent = $element.parent().parent();
	var containerTop = $parent.scrollTop();
	var containerBottom = containerTop + $parent.height();
	var elemTop = element.offsetTop;
	var elemBottom = elemTop + $element.height();
	if (elemBottom < containerTop || elemTop > containerBottom) {
		return false;
	}
	return true;
}

			$dialog.position({ my: "left top", at: "right+10px top", of: ".ui-dialog.sites_browser" });

	function alignDialogRight($dialog) {

	// === FILE TREE SECTION ========================================================================== //
	var filterResponseData = null;
	function refreshTree(attributes, filter) {
		var root = (typeof attributes === "undefined");
		var deferred = $.Deferred();
		
		if (root) $(".treeview-loading").removeClass("hidden");
		var url = baseApiUrl + "products/?userId=" + window.userID + "&siteId=0&productTypeId=0";
		if (attributes && attributes.site && attributes.fileInfo) {
			url = baseApiUrl + "products/?userId=" + window.userID + "&siteId=" + attributes.site.id + "&productTypeId=" + attributes.fileInfo.fileID;
		}
		
		if(filterResponseData === null && typeof filter !== "undefined"){
			$.when(filterProducts(filter)).done(function (response) {
				if (response.status == responseStatus.success) {
					filterResponseData = JSON.parse(response.data);
				}
			});
		}
		if (filterResponseData !== null && filterResponseData.length === 0) {
			$("#sites_browser .treeview").html("");
			$(".treeview-loading").addClass("hidden");
		} else {
			$.ajax({
				url: url,
				type: "GET",
				dataType: 'json',
				beforeSend: function (xhr) {
					xhr.setRequestHeader("Accept", "application/json");
					xhr.setRequestHeader("Content-Type", "application/json");
				},
				success: function(response) {
					if (root) $(".treeview-loading").addClass("hidden");
					if (response.status === responseStatus.success) {
						var data = response.data;
						if (root) {
							if (filterResponseData === null){
								populateFiltersForm(data);
							} else {
								data = responseFilter(response.data, filter, filterResponseData);
							}
							populateTreeBranch(data);
							populateOptionsHolder(data);
						} else {
							// Filter products list for selected Product Type
							if (filterResponseData !== null) {
								data = filterTreeBranch(data, filterResponseData);
							}
							// Reach products list for selected Product Type
							$.each(data, function () {
								$.each(this.products, function () {
									populateTreeBranch(this, attributes.relativePath);
								});
							});
						}
						deferred.resolve(response);
					} else {
						alert(response.message);
						deferred.reject(null, response.status, response.message);
					}
				},
				error: function (jqXHR, textStatus, errorThrown) {
					if (jqXHR.status == 500) {
						deferred.reject(jqXHR, textStatus, errorThrown);
					}
					if (root) $(".treeview-loading").addClass("hidden");
					deferred.reject(jqXHR, textStatus, "Error while loading files.");
				}
			});
			return deferred.promise();
		}
	}

		var attributes = $.extend({},

	function populateTreeBranch(nodes, relativePath) {
		var $compsTree = $("#sites_browser .treeview");
		
		if ((typeof nodes === "undefined") ||
			($.isArray(nodes) && nodes.length === 0) ||
			(typeof nodes === "object" && Object.keys(nodes).length === 0)) {
			
			$("input[id='" + relativePath + "']~div.sub", $compsTree).removeClass("loading");
			return;
		}
		
		var parentFolder = (typeof relativePath === "undefined" ? "" : relativePath);
		if (parentFolder === "") {
			// Sites => render as folders
			$compsTree.html("");
			$.each(nodes, function () {
				var site = this;
				site.relativePath = site.name + ":" + site.id;
				site.type = "site";
				renderFolder(site);
				
				// Continue with produt types
				populateTreeBranch(site.products, site.relativePath);
			});
		} else if (parentFolder.indexOf(":") >= 0 && parentFolder.indexOf(":") == parentFolder.lastIndexOf(":")) {
			// Product Types => render as folders
			$.each(nodes, function (typeIdx, productTypes) {
				var info = typeIdx.split(":");
				var productType = {
					id          : parseInt(info[1]),
					name        : info[0],
					type        : JSON.parse(info[3]) ? "raster" : "vector",
					shortName	: info[2],
					relativePath: parentFolder + "/" + typeIdx,
					parent      : $('~label>a', 'input[id="' + parentFolder + '"]').data("attributes"),
					site        : $('input[id="' + parentFolder + '"]').closest("div.site").find(">label>a").data("attributes")
				};
				renderFolder(productType);
				if (markersPattern.test(info[2])) {
					var description = info[0];
					$.each(markerNameString, function(idx,str) {
						description = description.toLowerCase().replace(str,"");
					});
					var startIndex = info[0].toLowerCase().indexOf(description);
					var endIndex = info[0].indexOf(" (");
					markers[info[2]] = info[0].substring(startIndex, endIndex);
				}
				// Continue with produts
				populateTreeBranch(productTypes, parentFolder);
			});
		} else {
			// Products => render as files
			$.each(nodes, function (index, file) {
				var size = parseInt(file.size);
				if (size < 1024) {
					size = size + " B";
				} else if (size < 1024*1024) {
					size = parseFloat(size / 1024, 2).toFixed(2) + " KB";
				} else if (size < 1024*1024*1024) {
					size = parseFloat(size / 1024 / 1024, 2).toFixed(2) + " MB";
				} else if (size < 1024*1024*1024*1024) {
					size = parseFloat(size / 1024 / 1024 / 1024, 2).toFixed(2) + " GB";
				} else {
					size = parseFloat(size / 1024 / 1024 / 1024 / 1024, 2).toFixed(2) + " TB";
				}
				
				var parent = $('~label>a', 'input[id="' + parentFolder + '"]').data("attributes");
				var attributes = $.extend({},
					file,
					{
						fileInfo: {
							fileID  : file.name, 
							fileName: file.name,
							fileSize: size,
							fileType: parent.type,
							uri	    : file.path
						},
						geometry    : file.footprint,
						size        : size,
						parent      : parent,
						site        : $('input[id="' + parentFolder + '"]').closest("div.site").find(">label>a").data("attributes")
					}
				);
				delete attributes.footprint;
				
				var fafile = attributes.fileInfo.fileType == "vector" ? "fa-cubes" : "fa-cube";
				var $element = $('<a href="#" title="' + attributes.name + '"' + ((attributes.path || attributes.type === ".tile") ? '' : ' class="unavailable"') + '><span class="fa ' + fafile + '"></span>' + attributes.name + '</a>');
				$element.data("attributes", attributes);
				
				var $folder = getParentFolder(attributes);
				if (!$element.hasClass("unavailable") && $(".unavailable", $folder).length > 0) {
					$element.insertBefore($(".unavailable", $folder).get(0));
				} else {
					$folder.append($element);
				}
				$folder.removeClass("empty loading");
			});
		}
		
		// Adjust folder indentation
		$(".select-for", $compsTree).closest(".sub").addClass("has-selectable-for");
	}

	function displayPreviewOnMap(attributes) {
		if (!myPolygonMap.mapActive) {
			return;

		if (typeof attributes === "undefined") {

			_map.setFeaturesStyleByProperty({ "description": "preview" }, _map.styleDefaultRO);
			_map.fitAllFeatures();
		}
		var features = _map.getAllFeatures("preview").getArray();
		if (features.length > 0 && features[0].getGeometry().getArea() > 0) {
			proj4.defs("EPSG:32632", "+proj=utm +zone=33 +datum=WGS84 +units=m +no_defs");
			proj4.defs("EPSG:32633", "+proj=utm +zone=34 +datum=WGS84 +units=m +no_defs");
			proj4.defs("EPSG:3035" , "+proj=laea +lat_0=52 +lon_0=10 +x_0=4321000 +y_0=3210000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs");
			proj4.defs("EPSG:28992", "+proj=sterea +lat_0=52.15616055555555 +lon_0=5.38763888888889 +k=0.9999079 +x_0=155000 +y_0=463000 +ellps=bessel +towgs84=565.417,50.3319,465.552,-0.398957,0.343988,-1.8774,4.0725 +units=m +no_defs");
			ol.proj.proj4.register(proj4);
			
			var mapDefaultProjection = "EPSG:3857";
			var imgProjection = mapDefaultProjection;
			// TODO: remove hardcoded values
			if (attributes.name.indexOf("_L2A_") > 0) {
				imgProjection = "EPSG:3035";

				switch (attributes.site) {

				}
			} else if (attributes.name.indexOf("_L3B_") > 0) {
				imgProjection = "EPSG:32632";
			}
			
			var feature = features[0];
			var extent = feature.clone().getGeometry().transform(mapDefaultProjection, imgProjection).getExtent();

				name       : "Raster",

					url: attributes.previewImage.base64,
					projection: imgProjection,

		}

	function displayVectorTileOnMap(attributes) {
		var _map = myPolygonMap;
		if (!_map.mapActive) { return; }
		cleanMap("VectorTile");
		parcelsRendered = [];
		var vectorTileSource = new ol.source.VectorTile({
			format: new ol.format.MVT({ idProperty: 'NewID' }),
			url: baseApiUrl + attributes.vector.tiles[0],
			declutter: true,
			//preload: 1,
			attributions: '<a id="VectorTile">Data from Sen4CAP</a>',
			tileGrid: ol.tilegrid.createXYZ({ maxZoom: attributes.vector.maxzoom }),
			tileLoadFunction: function(tile, url) {
			  tile.setLoader(function(extent, resolution, projection) {
				fetch(url, {headers: {'X-Auth-Token': window.tokenKey}}).then(function(response) {
				  response.arrayBuffer().then(function(data) {
					const format = tile.getFormat();
					const features = format.readFeatures(data, {
					  extent: extent,
					  featureProjection: projection
					});
					tile.setFeatures(features);
					$.each(features, function () {
						// Save parcel features for later use (parcel highlight on parcel search)
						var ori_id = this.properties_.ori_id + "";
						parcelsRendered[ori_id] = this;
						if ($.inArray(ori_id, parcelsSearchQueue) > -1) {
							parcelsSearchQueue = $.grep(parcelsSearchQueue, function(value) { return value != ori_id; });
							setTimeout(function () { _map.container.trigger("select-feature", [ parcelsRendered[ori_id] ]); }, 500);
						}
					});
				  });
				});
			  });
			}
		});
		var boundsExtent = ol.proj.transformExtent(attributes.vector.bounds, "EPSG:4326", "EPSG:3857");
		var vectorTileLayer = new ol.layer.VectorTile({
			name  : "VectorTile",
			source: vectorTileSource,
			style: function (feature) {
				return (typeof attributes.extra === "undefined" || attributes.extra.parcelId != feature.getId()) ? _map.styleDefaultRO : _map.styleDefaultEN;
			},
			extent: boundsExtent
		});
		vectorTileLayer.setZIndex(2);
		_map.map.addLayer(vectorTileLayer);
		_map.refreshLayerOpacity();
		
		// Fit on map
		_map.map.getView().fit(boundsExtent, _map.map.getSize());
		if (_map.map.getView().getZoom() < 12.5) {
			_map.map.getView().setZoom(12.5);
		}
		_map.panToFit();
		
		function selectFeature(feature) {
			attributes.extra = feature.getProperties();
			attributes.extra.parcelId = feature.getId();
			attributes.extra.polygon = $.extend({}, ol.geom.Polygon.fromExtent(feature.getExtent()), { ends_: feature.getEnds(), flatCoordinates: feature.getFlatCoordinates(), extent_: feature.getExtent() });
			
			createParcelGraph(attributes);
			if ($("#showTimeline").is(":checked")) {
				var productTypeId = $('#choose_productType').find(':selected').val();
				createParcelTimeline(attributes, productTypeId);
			}
			
			// Trigger map selection
			vectorTileLayer.changed();
			
			showProperties(attributes);
			
			if (!$(".sites_browser").hasClass("reduced")) {
				$(".panel-control.min", ".sites_browser").get(0).click();
			}
			if ($(".ui-dialog.properties:not(.minimized):visible").length) {
				alignDialogRight($(".ui-dialog.properties"));
			}
			
			$("[name='parcel_id']", "#properties").val("");
		}
		
		ol.Observable.unByKey(window.mapClickListener);
		window.mapClickListener = _map.map.on("click", function (event) {
			if (typeof event.pixel !== "undefined") {
				vectorTileLayer.getFeatures(event.pixel)
				.then(function (features) {
					if (features.length > 0) {
						selectFeature(features[0]);
					}
				});
			}
		});
		_map.container.on("select-feature", function (event, feature) {
			selectFeature(feature);
		});
	}

	function responseFilter(data, filter, filteredData) {
		var fData = new Array();
		if (filter.sites !== null && filter.sites.length > 0) {
			filteredData = $.grep(filteredData, function(object) {
			  return $.inArray(object.site_id, filter.sites) >= 0;
			});
		}
		
		$.each(data, function (idx, node) {
			var currentSiteId = node.id;
			var removeFromSite = [];
			$.each(node.products, function (typeIdx, productTypes) {
				var typeId = parseInt(typeIdx.split(":")[1]);
				var filterResult =  $.grep(filteredData, function(object) {
				  return object.site_id === currentSiteId && object.product_type_id === typeId;
				});
				if (filterResult.length === 0) {
					removeFromSite.push(typeIdx);
				}
				console.log();
			});
			$.each(removeFromSite, function(idx, val) {
				delete node.products[val];
			});
			if (removeFromSite.length > 0) {
				fData.push(node);
			}
		});
		
		return fData;	
	}
	
	function filterTreeBranch(data, filteredData) {
		var fData = new Array();
		$.each(data, function (idx, node) {
			var siteId = node.id;
			var prodToRemove = [];
			$.each(node.products, function (index, prod) {
				var typeId = parseInt(index.split(":")[1]);
				$.each(prod, function (i, elem) {
					var keep = false;
					$.each (filteredData, function (fidx, fElem) {
						var foundMatch = fElem.full_path.match("\/" + elem.name + "\.[a-zA-Z]+$");
						if (foundMatch !== null && foundMatch.length > 0 && siteId === fElem.site_id && typeId === fElem.product_type_id) {
							keep = true;
							return false;
						}
					});
					if (!keep) {
						prodToRemove.push(i);
					}
				});
				$.each(prodToRemove, function(i, val) {
					delete prod[val];
				});
				console.log();
			});
			fData.push(node);
		});
		return fData;
	}

			$("#optseason", "#range_filters").prop({ "checked" : false });
			// Reset season filter: hide all season options and set value to empty
			$("#choose_season option:not([value=''])", "#range_filters").addClass("hidden");
			$("#choose_season", "#range_filters").val("");
		} else {
			// Enable tiles filtes
			$("#optseason,input[name='tiles']", "#range_filters").prop({ "disabled": false });
			
			// Activate/deactivate seasons according to selected sites
			$("#choose_season option:not([value=''])", "#range_filters").addClass("hidden");
			$.each(selectedSites, function (index, siteId) {
				$("#choose_season option[data-siteid='" + siteId + "']", "#range_filters").removeClass("hidden");
			});
			 // Reset season when its parrent site is no longer selected
			var season = $("#choose_season", "#range_filters").val();
			if ($("#choose_season option[value='" + season + "']", "#range_filters").hasClass("hidden")) {
				$("#choose_season", "#range_filters").val("");
			}
		}
	});
	$("#search_filters").on("change", ".searchInterval input[type='checkbox']", function () {
		if ($(this).is(':checked')) {
			// disable ALL form controls from FilterBy section
			$(this).closest(".searchInterval").find(".form-control").prop("disabled", true);
			// only enable form controls for the selected filter
			$(this).closest(".checkboxGroup").find(".form-control").prop("disabled", false);
			// disable all other filters from FilterBy section
			$(this).closest(".checkboxGroup").siblings().find("input[type='checkbox']").prop("checked", false);
		} else {
			// only disable form controls for the selected filter
			$(this).closest(".checkboxGroup").find(".form-control").prop("disabled", true);
		}
	});
	
	$("#mapExtent, #graph_full_screen").on("click", ".selection-reset", function(){
		var attributes = $("#properties").data("attributes");
		var $ancestor = $(this.closest("[id]"));
		//uncheck all checkboxes
		$.each($(".markers", $ancestor).find(":checked"), function (index, elem) {
			elem.checked = false
			attributes.markers[$(elem).val()].selected = false;
		});
		if ($ancestor.attr("id") === "graph_full_screen") {
			$(".markers", "#mapExtent").find(":checked").prop("checked", false);
		}
		//clear search markers
		$(".search-markers .icon").trigger("click");
		//check first marker
		var $firstMarker = $(".markers input[type=checkbox]",$ancestor).first();
		$firstMarker.prop("checked", true);
		attributes.markers[$firstMarker.val()].selected = true;
		plotGraph(myPolygonMap.container);
		if ($ancestor.attr("id") === "graph_full_screen") {
			$(".markers", "#mapExtent").find(":checked").prop("checked", false);
			$(".markers input[type=checkbox]","#mapExtent").first().prop("checked", true);
			plotGraph($("#graph_full_screen"));
		}
	});
	// === MAP SECTION ========================================================================== //
	function cleanMap(layerName) {
		var _map = myPolygonMap;
		_map.removeAllFeatures("preview");
		if (typeof layerName === "undefined") {
			$(".drawer-content .slidercontainer:not(:has([data-name='Map'],[data-name='Features']))", "#mapExtent").remove();
			
			var layersToRemove = [];
			_map.map.getLayers().forEach(function (layer) {
				if (typeof layer !== "undefined" && layer.get("name") != "Map" && layer.get("name") != "Features") {
					layersToRemove.push(layer);
				}
			});
			for (var i = 0; i < layersToRemove.length; i++) {
				_map.map.removeLayer(layersToRemove[i]);
			}
		} else {
			$(".drawer-content .slidercontainer:has([data-name='" + layerName + "'])", "#mapExtent").remove();
			
			var layersToRemove = [];
			_map.map.getLayers().forEach(function (layer) {
				if (typeof layer !== "undefined" && layer.get("name") == layerName) {
					layersToRemove.push(layer);
				}
			});
			for (var i = 0; i < layersToRemove.length; i++) {
				_map.map.removeLayer(layersToRemove[i]);
			}
		}
	}
	function handlePolygonMapEvents() {
		var _map = myPolygonMap;
		//_map.el.on("newfootprint", function (evt, footprint) { evt.stopPropagation(); });
		//_map.el.on("hoverMap", function (evt, e) { evt.stopPropagation(); });
		//_map.el.on("clickextrafeature dblclickextrafeature", function (evt, feature, modifier) { evt.stopPropagation(); });
		_map.el.on("layerOpacityChange", function (evt, layer) { //function (evt, layer, modifier) {
			evt.stopPropagation();
			if (layer) {
				if (layer.get("name") == "Raster") {
					window.imageLayerOpacity = layer.getOpacity();
				}
			}
		});
	}
	function getMapPanPercentage() {
		var $dialog = $("#sites_browser").closest(".ui-dialog");
		if ($("#map").length > 0) {
			if ($dialog.hasClass("minimized")) {
				return 0;
			} else {
				return parseInt(($dialog.outerWidth() + $dialog.offset().left + 5)/$("#map").innerWidth()*10000)/100;
			}
		} else {
			return parseInt(($dialog.outerWidth() + $dialog.offset().left + 5)/$(window).innerWidth()*10000)/100;
		}
	}
	function setMapSize() {
		var h = 400;
		if ($("#header").length > 0 && $("#bar").length > 0 && $("#footer").length > 0) {
			h = $(window).height() - $("#header")[0].offsetHeight - $("#bar")[0].offsetHeight - $("#footer")[0].offsetHeight;
		}
		$("#mapExtent").css({ "height": h + "px" });
		if (typeof myPolygonMap !== "undefined" && myPolygonMap.mapActive) {
			var _map = myPolygonMap;
			var pan = getMapPanPercentage();
			_map.setPanPercentage(pan);
		}
	}
	$(window).on("ready resize", function() {
		setMapSize();
		// Resize graph
		waitForFinalEvent(function(){
			if ($("#graph_full_screen").is(":visible")) {
				createParcelFullScreenGraph();
			}
		}, 250, "resizing charts");
	});
	
	// === GLOBAL EVENTS SECTION ========================================================================== //
	$(".dialogs .panel-heading .panel-control").on("click", function () {
		var $panel = $(this).closest(".panel");
		if ($(this).filter(".min,.max").length > 0) {
			$panel.toggleClass("minimized");
		} else if ($(this).filter(".close").length > 0) {
			$panel.addClass("hidden");
		} else if ($(this).filter(".filter").length > 0) {
			if ($("#search_filters").dialog("isOpen")) {
				hideFiltersWindow();
			} else {
				showFiltersWindow();
			}
			
		} else if ($(this).filter(".filter-reset").length > 0) {
			resetFilters();
		}
	});
	// === START ====================================================================================== //
	defineFormDialogs();
	// Define click event action on dialog header button right after dialogs are created
	
	setMapSize();
	
	window.imageLayerOpacity = 0.8;
	window.myPolygonMap = { mapActive: false };
	// Initialize map and query
	var pan = getMapPanPercentage();
	var olPoly = $("#mapExtent").poly2D({ startLat: 47, startLon: 14, zoom: 5, maxFeaturesNo: 5, extraFeatureDescription: "preview", panPrc: pan });
	$.when(olPoly)
	.done(function (result) {
		if (typeof result.readOnly === "boolean") {
			$(".extent", "#myModalNodes").removeClass("no-map");
			$("#mapExtent").removeClass("hidden");
			myPolygonMap = result;
			if (myPolygonMap.mapActive) {
				window.defaultMapZoom = myPolygonMap.map.getView().getZoom();
				handlePolygonMapEvents();
				myPolygonMap.setReadOnly(true);
			}
		}
		// Initialize query functionality after map is loaded
	})
	// Initialize query functionality without map
	.fail(function () { });
	
	// Get tree
	resetFilters();
});

</script>
