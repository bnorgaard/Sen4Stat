<div class="panel panel-resources">
    <div class="panel-heading">
        <h2 class="panel-title">Analytical dashboard</h2>
    </div>
    <div class="panel-body"> 
        <div class="panel-group">
            <div id="accordion_ad">
                <div class="panel panel-success">
                    <div class="panel-heading">
                        <h3 class="panel-title"><a data-toggle="collapse" data-parent="#accordion_ad" class="collapsed" href="#pnlMap">Region of interest</a></h3>
                    </div>
                    <div class="panel-body panel-collapse collapse" id="pnlMap">
                        <form id="frmMap" role="form">
                            <div class="panel dash-row">
                                <div class="panel-heading">
                                    <h3 class="panel-title">Map</h3>
                                </div>
                                <div class="panel-body slim">
                                    <div class="row">
                                        <div class="col-xs-12">
                                            <div id="mapExtent"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="panel dash-row">
                                <div class="panel-heading">
                                    <h3 class="panel-title">Period</h3>
                                </div>
                                <div class="panel-body slim">
                                    <div class="row">
                                        <div class="col-xs-12">
                                            <div class="form-group horizontal" id="time_range_grp">
                                                <label class="col-md-4" style="display:inline-block">
                                                    <strong>From:</strong>
                                                    <input type="text" class="form-control date-field" name="startDate" id="startDate" autocomplete="off" value="" />
                                                </label>
                                                <label class="col-md-4" style="display:inline-block">
                                                    <strong>To:</strong>
                                                    <input type="text" class="form-control date-field" name="endDate" id="endDate" autocomplete="off" value="" />
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row submit-buttons mt-15">
                                <div class="col-xs-12">
                                    <input class="btn btn-success pull-right btn-update-dashboard" name="update" type="button" value="Update dashboard" />
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="panel panel-success">
                    <div class="panel-heading">
                        <h3 class="panel-title"><a data-toggle="collapse" data-parent="#accordion_ad" class="" href="#pnlDashboard">Dashboard</a></h3>
                    </div>
                    <div class="panel-body panel-collapse collapse in" id="pnlDashboard">
                        <div class="row grid-stack-toolbar">
                            <div class="col-xs-12">
                                <button type="button" class="btn btn-success" onclick="addWidget1()"><i class="fa fa-plus"></i> Widget 1</button>
                                <button type="button" class="btn btn-success" onclick="addWidget2()"><i class="fa fa-plus"></i> Widget 2</button>
                                <button type="button" class="btn btn-info pull-right" onclick="saveGrid()"><i class="fa fa-save"></i> Save</button>
                                <button type="button" class="btn btn-warning pull-right mr-5" onclick="loadGrid()"><i class="fa fa-th-large"></i> Load</button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-xs-12 grid-stack"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <hr />
    </div>
</div>

<script type="text/javascript">

    var grid = null;
    var sampleGrid = '[{"gridLocation":{"x":0,"y":0,"w":6,"h":4},"widgetoptions":{"chartType":"bar","labels":["January","February","March","April","May","June","July"]}},{"gridLocation":{"x":6,"y":0,"w":6,"h":4},"widgetoptions":{"chartType":"pie","labels":["June","July","August","September","October","November","December"]}}]';
    localStorage.setItem("gridData", sampleGrid);

    function initMap() {

    }

    function saveGrid() {

        var gridData = [];
        var items = grid.getGridItems();
        items.forEach(function (item) {
            var itemData = {};
            itemData.gridLocation = {
                x: item.gridstackNode.x,
                y: item.gridstackNode.y,
                w: item.gridstackNode.w,
                h: item.gridstackNode.h
            };
            itemData.widgetoptions = $(item).data('widgetoptions');
            gridData.push(itemData);
        });

        var serializedGridData = JSON.stringify(gridData);
        localStorage.setItem("gridData", serializedGridData);
    }

    function loadGrid() {
        var serializedGridData = localStorage.getItem("gridData");
        if (serializedGridData != null) {
            var gridData = JSON.parse(serializedGridData);
            grid.removeAll();
            gridData.forEach(function (item) {
                var $el = $('<div class="grid-stack-item"><div class="grid-stack-item-content"></div></div>');
                $el.data('widgetoptions', item.widgetoptions);
                grid.addWidget($el[0], item.gridLocation);
            });
        }
    }

    function addWidget1() {
        var $el = $('<div class="grid-stack-item" gs-id="id1" data-custom="1"><div class="grid-stack-item-content"></div></div>');
        $el.data('widgetoptions', JSON.parse('{"chartType":"bar","labels":["January","February","March","April","May","June","July"]}'));//to be read from DB
        grid.addWidget($el[0], { w: 6, h: 4 });
    }

    function addWidget2() {
        var $el = $('<div class="grid-stack-item"><div class="grid-stack-item-content"></div></div>');
        $el.data('widgetoptions', JSON.parse('{"chartType":"pie","labels":["June","July","August","September","October","November","December"]}'));//to be read from DB
        grid.addWidget($el[0], { w: 6, h: 4 });
    }

    //fix: map is not displayed when accordion is expanded
    $("#pnlMap").on('shown.bs.collapse', function () {
      window.myPolygonMap.map.updateSize();
    });

    $("#pnlMap").on("click", ".btn-update-dashboard", function () {

        //validate form
        $("#frmMap").validate({
            rules: {
                startDate: { datesGroupValidation: { datesGroup: "time_range_grp" } },
                endDate: { datesGroupValidation: { datesGroup: "time_range_grp" } }
            },
            groups: {
				timeRange    : "startDate endDate"
			},
			highlight: function(element, errorClass) {
				$(element).closest(".form-group").addClass("has-error");
			},
			unhighlight: function(element, errorClass) {
				$(element).closest(".form-group").removeClass("has-error");
			},
			success: function(label) {
				label.remove();
			}
        });
        if (!$("#frmMap").valid()) {
            return false;
        }

        var _map = myPolygonMap;
        var drawnFeatures = _map.getAllFeatures().getArray();
        if (drawnFeatures.length > 0) {
            var geometry = drawnFeatures[0].getGeometry();
            var extent = drawnFeatures[0].getGeometry().getExtent();
            var transedExtent = ol.proj.transformExtent(extent, "EPSG:3857", "EPSG:4326");
            var area = drawnFeatures[0].getGeometry().getArea();
            //close map
            $("#pnlMap").collapse('hide');
            //TODO: update dashboard
            //show dashboard
            $("#pnlDashboard").collapse('show');
        }
    });

    $.validator.addMethod('datesGroupValidation', function(value, element, params) {
        var dates = $(".date-field", "#" + params.datesGroup).filter(function () { return this.value !== ''; });
        var isValid = dates.length == 2 && $(dates[0]).datepicker("getDate") <= $(dates[1]).datepicker("getDate");
        return isValid;
		}, function (params, element) {
			var dates = $(".date-field", "#" + params.datesGroup).filter(function () { return this.value !== ''; });
			return dates.length < 2 ? 'Both fields above are required' : 'Start date should not be greater than end date';
		});	

    // ======================== DOCUMENT READY ======================== //
    $(document).ready(function () {

        grid = GridStack.init({
            removable: true //drag outside the grid to remove
            //acceptWidgets: true,
            //dragIn: '.newWidget',  // class that can be dragged from outside
            //dragInOptions: { revert: 'invalid', scroll: false, appendTo: 'body', helper: 'clone' }, // clone or can be your function
            //removable: '#trash', // drag-out delete class
        });
        grid.on('added', function (event, items) {
            items.forEach(function (item) {
                var widgetOptions = $(item.el).data("widgetoptions");
                $(item.el).statWidget(widgetOptions);
            });
        });

        //init map
        window.myPolygonMap = { mapActive: false };
	    var olPoly = $("#mapExtent").poly2D({ startLat: 47, startLon: 14, zoom: 4, maxFeaturesNo: 1, extraFeatureDescription: "preview", panPrc: 0 });
	    $.when(olPoly).done(function (result) {
		    if (typeof result.readOnly === "boolean") {
			    $("#mapExtent").removeClass("hidden");
			    $(".sliderscontainer ","#mapExtent").addClass("hidden");
			    myPolygonMap = result;
			    var _map = myPolygonMap;
			    if (_map.mapActive) {
				    _map.setReadOnly(false);
			    }
		    }
		    _map.el.on("newfootprint", function (evt, footprint) {
			    evt.stopPropagation();
			    var drawnFeatures = _map.getAllFeatures().getArray();
			    if (drawnFeatures.length > 0) {
				    var extent = drawnFeatures[0].getGeometry().getExtent();
				    var transedExtent = ol.proj.transformExtent(extent, "EPSG:3857", "EPSG:4326");
				    $("#latmin").val(transedExtent[1]);
				    $("#latmax").val(transedExtent[3]);
				    $("#lonmin").val(transedExtent[0]);
				    $("#lonmax").val(transedExtent[2]);
				    $(".roi", "#request_usr_page_2").find("label.error").remove();  
			    }else {
				    clearRegionOfInterest();
			    }
		    });
	    });
        //init dates
        $(".date-field").datepicker({ changeYear: true, changeMonth: true, dateFormat: "yy-mm-dd" });

        // ======================== START ======================== //
        loadGrid();   
    });

//# sourceURL=analyticaldashboard.js
</script>
