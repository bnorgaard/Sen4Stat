###############
## SOBLOO DIAS
##
## Sentinel-2 L1C path is S2[AB]/UU/L/SS/<product_folder>, where:
##  S2[AB]  = the satellite (S2A or S2B)
##  UU      = the UTM code
##  L       = the latitude band
##  SS      = the UTM square code
##  <product_folder> = the product folder, with .SAFE suffix
##
## Landsat-8 L1 path is PPP/RRR/yyyy/MM/<product>, where:
##  PPP     = the path (0-padded)
##  RRR     = the row (0-padded)
##  yyyy    = year
##  MM      = month (0-padded)
##  <product> = the product, as a tar.gz archive
##
##  The respective repository roots should be set in the database, in the respective datasource table records
##
#SciHubDataSource.Sentinel1.path.builder.class = ro.cs.eo.dias.sobloo.Sentinel1PathBuilder
#SciHubDataSource.Sentinel1.local.archive.path.format = S1B/IW/SLC
#SciHubDataSource.Sentinel1.path.suffix = none
#SciHubDataSource.Sentinel1.product.format = folder
#SciHubDataSource.Sentinel2.path.builder.class = ro.cs.eo.dias.sobloo.Sentinel2PathBuilder
#SciHubDataSource.Sentinel2.local.archive.path.format = UU/L/SS/
#SciHubDataSource.Sentinel2.path.suffix = .SAFE
#SciHubDataSource.Sentinel2.product.format = folder
#USGSDataSource.Landsat8.path.builder.class = ro.cs.eo.dias.sobloo.Landsat8PathBuilder
#USGSDataSource.Landsat8.local.archive.path.format = PPP/RRR/yyyy/MM
#USGSDataSource.Landsat8.path.suffix = none
#USGSDataSource.Landsat8.product.format = tar_gz

###############
## MUNDI DIAS
##
## Sentinel-2 L1C path is s2-l1c-YYYY-qq/UU/L/SS/yyyy/MM/dd/<product_folder>, where:
##  UU      = the UTM code
##  L       = the latitude band
##  SS      = the UTM square code
##  yyyy    = year
##  MM      = month (0-padded)
##  dd      = day (0-padded)
##  <product_folder> = the product folder, without .SAFE suffix
##
## Landsat-8 L1 path is PPP/RRR/yyyy/MM/<product>, where:
##  PPP     = the path (0-padded)
##  RRR     = the row (0-padded)
##  yyyy    = year
##  MM      = month (0-padded)
##  <product> = the product, as a tar.gz archive
##
##  The respective repository roots should be set in the database, in the respective datasource table records
##
#SciHubDataSource.Sentinel1.path.builder.class = ro.cs.eo.dias.mundi.Sentinel1PathBuilder
#SciHubDataSource.Sentinel1.local.archive.path.format = s1-l1-slc-yyyy-qq/yyyy/MM/dd/IW/DV
#SciHubDataSource.Sentinel1.path.suffix = none
#SciHubDataSource.Sentinel1.product.format = zip
#SciHubDataSource.Sentinel2.path.builder.class = ro.cs.eo.dias.mundi.Sentinel2PathBuilder
#SciHubDataSource.Sentinel2.local.archive.path.format = s2-l1c-yyyy-qq/UU/L/SS/yyyy/MM/dd
#SciHubDataSource.Sentinel2.path.suffix = none
#SciHubDataSource.Sentinel2.product.format = folder
#USGSDataSource.Landsat8.path.builder.class = ro.cs.eo.dias.mundi.Landsat8PathBuilder
#USGSDataSource.Landsat8.local.archive.path.format = PPP/RRR/yyyy/MM
#USGSDataSource.Landsat8.path.suffix = none
#USGSDataSource.Landsat8.product.format = tar_gz

###############
## ONDA DIAS
##
## Sentinel-2 L1C path is yyyy/MM/dd/<product_name>.zip/<product_name>.SAFE, where:
##  yyyy    = year
##  MM      = month (0-padded)
##  dd      = day (0-padded)
##  <product_name> = the product name, without .SAFE suffix
##
## Landsat-8 L1 path is yyyy/MM/dd/<product_name>.tar/<product_name>, where:
##  yyyy    = year
##  MM      = month (0-padded)
##  dd      = day (0-padded)
##  <product_name> = the product name, without any suffix
##
##  The respective repository roots should be set in the database, in the respective datasource table records
##
#SciHubDataSource.Sentinel1.path.builder.class = ro.cs.eo.dias.onda.Sentinel1PathBuilder
#SciHubDataSource.Sentinel1.local.archive.path.format = yyyy/MM/dd
#SciHubDataSource.Sentinel1.path.suffix = .SAFE
#SciHubDataSource.Sentinel1.product.format = folder
#SciHubDataSource.Sentinel2.path.builder.class = ro.cs.eo.dias.onda.Sentinel2PathBuilder
#SciHubDataSource.Sentinel2.local.archive.path.format = yyyy/MM/dd
#SciHubDataSource.Sentinel2.path.suffix = .SAFE
#SciHubDataSource.Sentinel2.product.format = folder
#USGSDataSource.Landsat8.path.builder.class = ro.cs.eo.dias.onda.Landsat8PathBuilder
#USGSDataSource.Landsat8.local.archive.path.format = yyyy/MM/dd
#USGSDataSource.Landsat8.path.suffix = .tar
#USGSDataSource.Landsat8.product.format = folder

