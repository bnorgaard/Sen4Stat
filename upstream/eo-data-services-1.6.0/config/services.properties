################################################
## General Spring services configuration
server.port = 8080
spring.datasource.url=jdbc:postgresql://localhost:5432/sen4cap?stringtype=unspecified
spring.datasource.username=admin
spring.datasource.password=sen2agri
site.location=static
site.prefix = /ui
site.title = Sen4CAP
# site.external.url = http|https://server:port
vector.tile.service.url = http://localhost:6767
endpoints.not.authenticated=/;/login;/products/download;/users/pwd/request;/users/pwd/reset

plugins.use.docker = true
plugins.use = docker
# GDAL docker container if plugins.use.docker=true. Uncomment and change if different than geodata/gdal (default)
docker.gdal.image = osgeo/gdal:ubuntu-full-3.4.1

# SNAP 8 docker container
snap.use.docker = true
docker.snap.image = sen4cap/snap:8.0
# docker.snap.image = sen4x/snap:11-ubuntu-24.04

# SNAP 8 SRTM DEM
#dem.name = SRTM 1Sec HGT
# snap.dem.location = /mnt/archive/dem/SRTM 1Sec HGT

# SNAP 8 ASTER DEM
#dem.name = ASTER 1sec GDEM v3
# snap.dem.location = /mnt/archive/dem/ASTER_Northern_Europe/

# dem.histogram.location = /mnt/archive/dem/histograms

#physical location to be mapped for .snap from within container
snap.home.location = /mnt/archive/snap_tmp/

# OTB 7.2 docker container
otb.use.docker = true
docker.otb.image = sen4x/otb:7.2.0

# ZARR converter container
docker.zarr.image = sen4cap/zarr

##################################################################
## Datatabase configuration polling (in minutes). 0 means disabled
database.config.polling=0

################################################
## Data sources configuration
SciHubDataSource.Sentinel1.auto.uncompress=false
## IMPORTANT NOTE: if value for key "downloader.use.esa.l2a" is set to true in the config table, this value should be set on true
SciHubDataSource.Sentinel2.auto.uncompress=true
CreoDiasDataSource.Sentinel2.auto.uncompress=true

## What to do if, in local archive mode, a product is not found
## Possible values are: none|download
SciHubDataSource.Sentinel2.local.missing.action=download
ASFDataSource.Sentinel1.specific_params = {"parameters":[{"name":"platformName","type":"java.lang.String","value":"Sentinel-1"},{"name":"productType","type":"java.lang.String","value":"SLC"}]}

################################################
##GDAL Tile Cache config
##
##Cache activation
gdal.tile.cache.enabled=true
##Cache location
gdal.tile.cache.dir=.eds/zxy-tiles-cache/
##Size of cache (MB)
gdal.tile.cache.size=1024
##Clear cache at startup
gdal.tile.cache.clear=false
gdal.auxdata.path=/mnt/archive/snap_tmp
################################################
## Miscellaneous settings
quicklook.extension=.png

