spring.application.name=sen4cap-services
#server.servlet.context-path=/sen4cap
server.url=https://localhost
logging.level.root=ERROR
logging.level.ro.cs.tao=TRACE
logging.level.ro.cs.eo=TRACE
logging.level.org.esa.sen4cap=TRACE
logging.file=../log/${spring.application.name}.log
logging.pattern.file= %d{yyyy-MMM-dd HH:mm:ss.SSS} %-5level [%-10thread{10}] %-30logger{30} - %msg%n
logging.pattern.console= %d{yyyy-MMM-dd HH:mm:ss.SSS} %-5level [%-10thread{10}] %-30logger{30} - %msg%n
banner.location=classpath:org/esa/sen4cap/banner.txt
spring.session.store-type=NONE
security.enable-csrf=false
spring.servlet.multipart.max-file-size=10000MB
spring.servlet.multipart.max-request-size=10000MB
spring.main.allow-bean-definition-overriding=true

## HTTPS Configuration
# The server.port value defined here has precedence over the one set in services.properties
# server.ssl.enabled = true
# server.ssl.key-store = classpath:keystore.p12
# server.ssl.key-store-password = sen2agri
# server.ssl.keyStoreType = PKCS12
# server.ssl.keyAlias = Sen2Agri-Services

# HTTP compression of text responses (HTML, CSS, JavaScript, JSON), from 2 KB
server.compression.enabled=true
